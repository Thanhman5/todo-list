    /* ================= THAO TÁC VIỆC ================= */
    function setStatus(o, st, rerender){
      pushUndo("đổi trạng thái việc “"+o.title+"”");
      o.status=st;
      if(st==="done"){ o.progress=100; var run=liveSession(o); if(run) stopSession(o, run, false); }
      if(st==="doing" && (o.progress==null || o.progress>=100)) o.progress = seriesTargetOf(o)? Math.min(99, Math.round((o.count||0)/seriesTargetOf(o)*100)) : 0;
      if(st==="todo"){ o.progress=0; }
      if(st==="skipped"){ var r2=liveSession(o); if(r2) stopSession(o, r2, false); }
      var label={done:"Hoàn thành", doing:"Bắt đầu làm", todo:"Mở lại (chưa làm)", skipped:"Bỏ qua"}[st]||st;
      logAct(o, st, label);
      save(); if(rerender!==false) render(); if(UI.drawerOcc===o.id) openDrawer(o.id, true);
    }
    function setProgress(o, p, log){
      if(o.status!=="doing"){ o.status="doing"; }
      o.progress=Math.max(0, Math.min(99, p));
      if(log){ logAct(o,"progress","Cập nhật tiến độ: "+o.progress+"%"); save(); }
    }
    function setCount(o, n, rerender){
      var s=o.seriesId? seriesById(o.seriesId): null;
      var target=s? (s.targetValue||null) : null;
      if(!target) return;
      if(rerender!==false) pushUndo("cập nhật số đếm “"+o.title+"”");
      o.count=Math.max(0, n);
      if(o.count>=target){ o.status="done"; o.progress=100; }
      else {
        if(o.status==="done" || o.status==="todo" || o.status==="skipped"){ o.status = o.count>0? "doing" : "todo"; }
        o.progress = o.count>0? Math.min(99, Math.round(o.count/target*100)) : 0;
      }
      logAct(o,"count","Cập nhật số đếm · "+o.count+"/"+target+(s.targetUnit? " "+s.targetUnit : ""));
      save(); if(rerender!==false){ render(); if(UI.drawerOcc===o.id) openDrawer(o.id, true); }
    }
    function cycleStatus(o){
      if(o.status==="todo") setStatus(o,"doing");
      else if(o.status==="doing") setStatus(o,"done");
      else setStatus(o,"todo");
    }
    function snoozeOcc(o, toDate, label){
      pushUndo("hoãn việc “"+o.title+"”");
      var from=o.dueDate;
      if(o.seriesId){
        o.detached=true;
        var s=seriesById(o.seriesId);
        if(s && from){ s.skipDates=s.skipDates||[]; if(s.skipDates.indexOf(from)<0) s.skipDates.push(from); }
      }
      o.dueDate=toDate; o.remindFired=false; o.snoozeUntil=0;
      logAct(o,"snooze","Hoãn từ "+(from||"chưa có ngày")+" sang "+toDate);
      save(); render(); toast("Đã hoãn “"+o.title+"” sang "+label+" ("+fmtDate(toDate)+").");
      if(UI.drawerOcc===o.id) openDrawer(o.id, true);
    }
    function toggleTimerBtn(o){
      pushUndo("đếm giờ “"+o.title+"”");
      var run=liveSession(o);
      if(run){ if(run.pausedAt) resumeSession(o, run); else pauseSession(o, run); }
      else startSession(o, "up", null);
      save(); render(); if(UI.drawerOcc===o.id) openDrawer(o.id, true);
    }

    /* ================= DÒNG VIỆC ================= */
    function priChip(p){
      if(p==="gap") return '<span class="chip p-gap">Gấp</span>';
      if(p==="cao") return '<span class="chip p-cao">Cao</span>';
      if(p==="thap") return '<span class="chip">Thấp</span>';
      return "";
    }
    var STATUS_LABEL = {todo:"Chưa làm", doing:"Đang làm", done:"Hoàn thành", skipped:"Bỏ qua"};
    function statusChip(o){ return '<span class="stchip '+o.status+'">'+STATUS_LABEL[o.status]+(o.status==="doing" && !seriesTargetOf(o)? " · "+(o.progress||0)+"%":"")+'</span>'; }
    function countCtlHTML(o, s){
      var target=s.targetValue; var unit=s.targetUnit||"";
      return '<div class="countctl" data-countctl="'+o.id+'"><button type="button" data-cnt="-1" aria-label="Trừ 1">−</button>'
        + '<span class="cv">'+(o.count||0)+' / '+target+(unit? ' <small>'+esc(unit)+' · còn '+(Math.max(0,target-(o.count||0)))+'</small>' : '<small>còn '+Math.max(0,target-(o.count||0))+'</small>')+'</span>'
        + '<button type="button" data-cnt="1" aria-label="Cộng 1">+</button></div>';
    }
    function taskRowHTML(o, showDate){
      var run=liveSession(o);
      var s=o.seriesId? seriesById(o.seriesId): null;
      var proj=o.projectId? projectById(o.projectId): null;
      var doneSteps=(o.steps||[]).filter(function(x){return x.done;}).length;
      var meta="";
      if(showDate && o.dueDate) meta+='<span class="'+(isOverdue(o)?"overdue":"")+'">'+(o.dueDate===todayStr()?"Hôm nay":fmtDate(o.dueDate))+'</span>';
      if(!showDate && isOverdue(o)) meta+='<span class="overdue">Quá hạn từ '+fmtDate(o.dueDate)+'</span>';
      if(o.dueTime) meta+='<span>'+esc(o.dueTime)+'</span>';
      if(o.estimateMin) meta+='<span>Ước tính '+fmtDur(o.estimateMin)+'</span>';
      var act=actualMin(o); if(act>0) meta+='<span>Đã làm '+fmtDur(act)+'</span>';
      if(run) meta+='<span data-tick="'+o.id+'">đang đếm…</span>';
      if(o.note) meta+='<span>Có ghi chú</span>';
      if(o.sourceNoteId) meta+='<span>Từ ghi chú</span>';
      var tagsHtml=(o.tags||[]).map(function(tid){ var t=tagById(tid); return t? '<span class="chip tagchip">#'+esc(t.name)+'</span>' : ""; }).join("");
      var checkCls = o.status==="done" ? "done" : (o.status==="doing" ? "doing" : "");
      var target = s? (s.targetValue||null) : null;
      return '<div class="task '+o.status+'" data-occ="'+o.id+'">'
        + '<button class="check '+checkCls+'" data-act="cycle" title="Đổi trạng thái" aria-label="Đổi trạng thái việc '+esc(o.title)+'">'+(o.status==="done"?ICONS.check:(o.status==="doing"&&!target?'<span style="font-size:11px;font-weight:800">'+(o.progress||0)+'%</span>':""))+'</button>'
        + '<div class="body" data-act="open"><div class="title">'+(s? '<span class="sdot" style="background:'+seriesColor(s)+'" title="Màu chuỗi"></span>' : '')+'<span>'+esc(o.title)+'</span></div>'
        + '<div class="meta">'+statusChip(o)+priChip(o.priority)+(proj? '<span class="chip"><span class="dot" style="background:'+esc(proj.color)+'"></span>'+esc(proj.name)+'</span>' : '')+tagsHtml+meta+'</div>'
        + ((o.steps&&o.steps.length)? '<div class="steps-mini">Bước: '+doneSteps+'/'+o.steps.length+' xong</div>' : '')
        + (target? countCtlHTML(o, s) : '')
        + '<div class="prog'+(o.status==="doing"&&!target?" show":"")+'"><input type="range" min="0" max="99" value="'+(o.progress||0)+'" data-prog="'+o.id+'" aria-label="Tiến độ phần trăm" /><b>'+(o.progress||0)+'%</b></div>'
        + '</div>'
        + '<div class="acts">'
        + '<button class="iconbtn'+(run&&!run.pausedAt?" run":"")+'" data-act="timer" title="'+(run? (run.pausedAt?"Tiếp tục đếm giờ":"Tạm dừng đếm giờ") : "Bắt đầu đếm giờ")+'">'+(run&&!run.pausedAt?ICONS.pause:ICONS.play)+'</button>'
        + (o.status!=="done"&&o.status!=="skipped"? '<button class="iconbtn" data-act="snooze" title="Hoãn sang ngày mai">'+ICONS.snooze+'</button>' : '')
        + '<button class="iconbtn" data-act="open" title="Chi tiết">'+ICONS.dots+'</button>'
        + '</div></div>';
    }
    function wireTaskRows(root){
      $$(".task", root).forEach(function(row){
        var id=row.getAttribute("data-occ");
        $$("[data-act]", row).forEach(function(b){
          b.addEventListener("click", function(ev){
            ev.stopPropagation();
            var act=b.getAttribute("data-act"), o=occById(id); if(!o) return;
            if(act==="open") openDrawer(id);
            else if(act==="cycle") cycleStatus(o);
            else if(act==="timer") toggleTimerBtn(o);
            else if(act==="snooze") snoozeOcc(o, addDays(todayStr(),1), "ngày mai");
          });
        });
        var ctl=$("[data-countctl]", row);
        if(ctl) $$("[data-cnt]", ctl).forEach(function(b){ b.addEventListener("click", function(ev){ ev.stopPropagation(); var o=occById(id); if(o) setCount(o, (o.count||0) + (+b.getAttribute("data-cnt"))); }); });
        var rg=$('input[type=range]', row);
        if(rg) rg.addEventListener("input", function(){ var o=occById(id); if(!o) return; setProgress(o, +rg.value, false); var b=rg.parentElement.querySelector("b"); if(b) b.textContent=rg.value+"%"; var chk=row.querySelector(".check span"); if(chk) chk.textContent=rg.value+"%"; });
        if(rg) rg.addEventListener("change", function(){ var o=occById(id); if(o){ logAct(o,"progress","Cập nhật tiến độ: "+o.progress+"%"); save(); } render(); });
      });
    }
    function refreshListArea(){
      if(UI.view==="today") renderTodayList();
      else if(UI.view==="inbox") render();
    }
    function emptyHTML(title, sub){
      return '<div class="empty"><b>'+esc(title)+'</b>'+esc(sub)+'</div>';
    }
    /* bộ lọc dùng cho Hôm Nay / Kanban (không có nút lưu view) */
    function filterbarHTML(){
      var f=UI.filter;
      var projOpts='<option value="">Mọi dự án</option>'+state.projects.filter(function(p){return !p.archived;}).map(function(p){return '<option value="'+p.id+'"'+(f.projectId===p.id?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");
      var tagOpts='<option value="">Mọi tag</option>'+state.tags.map(function(t){return '<option value="'+t.id+'"'+(f.tagId===t.id?" selected":"")+'">#'+esc(t.name)+'</option>';}).join("");
      return '<div class="filterbar"><input type="search" id="f-q" placeholder="Tìm theo tên, mô tả, ghi chú…" value="'+esc(f.q)+'" />'
        + '<select id="f-proj">'+projOpts+'</select><select id="f-tag">'+tagOpts+'</select>'
        + '<select id="f-pri"><option value="">Mọi ưu tiên</option><option value="gap"'+(f.priority==="gap"?" selected":"")+'>Gấp</option><option value="cao"'+(f.priority==="cao"?" selected":"")+'>Cao</option><option value="vua"'+(f.priority==="vua"?" selected":"")+'>Vừa</option><option value="thap"'+(f.priority==="thap"?" selected":"")+'>Thấp</option></select>'
        + '<select id="f-status"><option value="">Mọi trạng thái</option><option value="todo"'+(f.status==="todo"?" selected":"")+'>Chưa làm</option><option value="doing"'+(f.status==="doing"?" selected":"")+'>Đang làm</option><option value="done"'+(f.status==="done"?" selected":"")+'>Hoàn thành</option><option value="skipped"'+(f.status==="skipped"?" selected":"")+'>Bỏ qua</option><option value="overdue"'+(f.status==="overdue"?" selected":"")+'>Quá hạn</option></select>'
        + ((f.q||f.projectId||f.tagId||f.priority||f.status)? '<button class="btn small ghost" id="f-clear" type="button">Xoá lọc</button>' : '')
        + '</div>';
    }
    function wireFilterbar(){
      var q=$("#f-q"); if(!q) return;
      q.addEventListener("input", function(){ UI.filter.q=q.value; refreshListArea(); });
      $("#f-proj").addEventListener("change", function(e){ UI.filter.projectId=e.target.value; render(); });
      $("#f-tag").addEventListener("change", function(e){ UI.filter.tagId=e.target.value; render(); });
      $("#f-pri").addEventListener("change", function(e){ UI.filter.priority=e.target.value; render(); });
      $("#f-status").addEventListener("change", function(e){ UI.filter.status=e.target.value; render(); });
      var c=$("#f-clear"); if(c) c.addEventListener("click", function(){ UI.filter={q:"",projectId:"",tagId:"",priority:"",status:""}; render(); });
    }
    function occMatchesFilter(o, f){
      if(f.q){ var hay=(o.title+" "+(o.desc||"")+" "+(o.note||"")).toLowerCase(); if(hay.indexOf(f.q.toLowerCase())<0) return false; }
      if(f.projectId && o.projectId!==f.projectId) return false;
      if(f.tagId && (o.tags||[]).indexOf(f.tagId)<0) return false;
      if(f.priority && (o.priority||"vua")!==f.priority) return false;
      if(f.status){ if(f.status==="overdue"){ if(!isOverdue(o)) return false; } else if(o.status!==f.status) return false; }
      return true;
    }
    function applyFilter(list){ var f=UI.filter; return list.filter(function(o){ return occMatchesFilter(o, f); }); }
</script>

    <script>
    "use strict";
    /* ================= MÀN: HÔM NAY ================= */
    function attentionData(){
      var now=Date.now(), t=todayStr();
      var overdue=liveOccs().filter(function(o){ return isOverdue(o); }).sort(function(a,b){ return a.dueDate<b.dueDate? -1:1; });
      var dueRem=[];
      liveOccs().forEach(function(o){
        if(o.status==="done"||o.status==="skipped") return;
        (o.reminders||[]).forEach(function(r){ if(!r.done && r.at<=now) dueRem.push({occ:o, rem:r}); });
        var ra=remindAtOf(o);
        if(ra && ra<=now && o.dueDate<=t && !o.remindFired) dueRem.push({occ:o, rem:null});
      });
      return { overdue:overdue, dueRem:dueRem };
    }
    function renderToday(){
      var vd=UI.viewDate, isToday=vd===todayStr();
      var h='<div class="viewhead"><h2>'+(isToday?"Hôm Nay":fmtDate(vd))+'</h2><span class="sub">'+(isToday? fmtDate(vd) : "Đang xem lại — vẫn sửa được như thường")+'</span>'
        + '<div class="datenav"><button class="btn" id="d-prev" title="Ngày trước">‹</button><input type="date" id="d-pick" value="'+vd+'" /><button class="btn" id="d-next" title="Ngày sau">›</button>'
        + (!isToday? '<button class="btn" id="d-today">Về hôm nay</button>' : '') + '</div></div>'
        + '<div id="todayextra"></div>'
        + filterbarHTML() + '<div id="todaylist"></div>';
      $("#main").innerHTML = topbarHTML() + h;
      wireTopbar(); wireFilterbar();
      $("#d-prev").addEventListener("click", function(){ UI.viewDate=addDays(UI.viewDate,-1); render(); });
      $("#d-next").addEventListener("click", function(){ UI.viewDate=addDays(UI.viewDate,1); render(); });
      $("#d-pick").addEventListener("change", function(e){ if(e.target.value){ UI.viewDate=e.target.value; render(); } });
      var dt=$("#d-today"); if(dt) dt.addEventListener("click", function(){ UI.viewDate=todayStr(); render(); });
      renderTodayExtra();
      renderTodayList();
    }
    function renderTodayExtra(){
      var host=$("#todayextra"); if(!host) return;
      if(UI.viewDate!==todayStr()){ host.innerHTML=""; return; }
      var h="";
      if(backupStale()){
        h+='<div class="backup-warn"><span>Đã quá 7 ngày chưa có bản sao lưu thành công nào. Hãy sao lưu ngay để dữ liệu luôn có bản dự phòng trong trình duyệt này.</span><button class="btn small primary" id="bw-now" type="button">Sao lưu ngay</button></div>';
      }
      var att=attentionData();
      var total=att.overdue.length+att.dueRem.length;
      if(total>0){
        var shownO=att.overdue.slice(0,5), shownR=att.dueRem.slice(0, Math.max(0, 5-shownO.length));
        var hidden=total-shownO.length-shownR.length;
        h+='<section class="attention" aria-label="Cần chú ý"><h3>Cần chú ý ('+total+')</h3>'
          + shownO.map(function(o){
              return '<div class="a-row"><span class="a-t">'+esc(o.title)+'<span class="a-m"> · quá hạn từ '+fmtShort(o.dueDate)+'</span></span>'
                + '<button class="btn small primary" data-att-done="'+o.id+'" type="button">Hoàn thành</button>'
                + '<button class="btn small" data-att-snooze="'+o.id+'" type="button">Hoãn</button>'
                + '<button class="btn small ghost" data-att-open="'+o.id+'" type="button">Chi tiết</button></div>';
            }).join("")
          + shownR.map(function(x){
              return '<div class="a-row"><span class="a-t">'+esc(x.occ.title)+'<span class="a-m"> · nhắc đã tới hạn'+(x.rem? " ("+fmtDT(x.rem.at)+")" : "")+'</span></span>'
                + '<button class="btn small" data-att-remdone="'+x.occ.id+'" data-rem="'+(x.rem? x.rem.id : "")+'" type="button">Đã nhắc</button>'
                + '<button class="btn small" data-att-remsnooze="'+x.occ.id+'" data-rem="'+(x.rem? x.rem.id : "")+'" type="button">+10p</button>'
                + '<button class="btn small ghost" data-att-open="'+x.occ.id+'" type="button">Chi tiết</button></div>';
            }).join("")
          + (hidden>0? '<p class="hint" style="margin:8px 0 0">… và '+hidden+' mục nữa — xem ở Hộp Đến / danh sách quá hạn bên dưới.</p>' : '')
          + '</section>';
      }
      var quits=liveSeries().filter(function(s){ return s.kind==="quit"; });
      if(quits.length){
        h+='<div class="group-title">Đang cai</div>'+quits.map(function(s){
          return '<button class="quitstrip-row" data-quit-open="'+s.id+'" type="button"><span class="sdot" style="background:'+seriesColor(s)+'"></span><span class="qt">'+esc(s.title)+'</span><span class="quit-clock-sm" data-quit-clock="'+s.id+'">…</span></button>';
        }).join("");
      }
      host.innerHTML=h;
      var bw=$("#bw-now"); if(bw) bw.addEventListener("click", function(){ createBackup("manual"); toast("Đã sao lưu ngay. Bản sao lưu giữ trong trình duyệt này."); render(); });
      $$("[data-att-done]", host).forEach(function(b){ b.addEventListener("click", function(){ var o=occById(b.getAttribute("data-att-done")); if(o) setStatus(o,"done",true); }); });
      $$("[data-att-snooze]", host).forEach(function(b){ b.addEventListener("click", function(){ var o=occById(b.getAttribute("data-att-snooze")); if(o) snoozeOcc(o, addDays(todayStr(),1), "ngày mai"); }); });
      $$("[data-att-open]", host).forEach(function(b){ b.addEventListener("click", function(){ openDrawer(b.getAttribute("data-att-open")); }); });
      $$("[data-att-remdone]", host).forEach(function(b){ b.addEventListener("click", function(){ var o=occById(b.getAttribute("data-att-remdone")); if(!o) return; var rid=b.getAttribute("data-rem"); if(rid){ var r=(o.reminders||[]).filter(function(x){return x.id===rid;})[0]; if(r) r.done=true; } else o.remindFired=true; save(); render(); }); });
      $$("[data-att-remsnooze]", host).forEach(function(b){ b.addEventListener("click", function(){ var o=occById(b.getAttribute("data-att-remsnooze")); if(!o) return; var rid=b.getAttribute("data-rem"); if(rid){ var r=(o.reminders||[]).filter(function(x){return x.id===rid;})[0]; if(r){ r.at=Date.now()+10*60000; } } else { o.snoozeUntil=Date.now()+10*60000; o.remindFired=false; } save(); render(); toast("Sẽ nhắc lại sau 10 phút."); }); });
      $$("[data-quit-open]", host).forEach(function(b){ b.addEventListener("click", function(){ UI.view="habits"; render(); }); });
      tickClocks();
    }
    function renderTodayList(){
      var host=$("#todaylist"); if(!host) return;
      var vd=UI.viewDate, isToday=vd===todayStr();
      var dayOccs = liveOccs().filter(function(o){ return o.dueDate===vd; });
      var total=dayOccs.length;
      var doneN=dayOccs.filter(function(o){return o.status==="done";}).length;
      var pct= total? Math.round(doneN/total*100) : 0;
      var list = sortOccs(applyFilter(dayOccs));
      var overdue = isToday ? sortOccs(applyFilter(liveOccs().filter(function(o){ return isOverdue(o) && o.dueDate!==vd; }))) : [];
      var focus = list.filter(function(o){ return (o.priority==="gap"||o.priority==="cao") && o.status!=="done" && o.status!=="skipped"; }).slice(0,3);
      var focusIds={}; focus.forEach(function(o){ focusIds[o.id]=1; });
      var rest = list.filter(function(o){ return !focusIds[o.id]; });
      var h='<div class="day-progress"><div class="row"><span>Tiến độ ngày: <b>'+doneN+'/'+total+' việc xong</b></span><span><b>'+pct+'%</b></span></div><div class="pbar"><i style="width:'+pct+'%"></i></div></div>';
      if(overdue.length) h+='<div class="group-title overdue">Quá hạn <span class="cnt">'+overdue.length+'</span></div>'+overdue.map(function(o){return taskRowHTML(o,true);}).join("");
      if(focus.length) h+='<div class="group-title">Trọng tâm <span class="cnt">'+focus.length+'</span></div>'+focus.map(function(o){return taskRowHTML(o,false);}).join("");
      h+='<div class="group-title">'+(isToday?"Việc hôm nay":"Việc trong ngày")+' <span class="cnt">'+rest.length+'</span></div>';
      h+= rest.length? rest.map(function(o){return taskRowHTML(o,false);}).join("") : emptyHTML(total? "Không có việc nào khớp bộ lọc" : "Chưa có việc nào cho ngày này", "Dùng ô thêm nhanh ở trên, hoặc nút “Tạo việc” ghim ở cạnh dưới để tạo việc.");
      host.innerHTML=h;
      wireTaskRows(host);
    }

    /* ================= MÀN: HỘP ĐẾN (v2.1 gọn 3 lớp · v2.10 · v2.13) ================= */
    var INBOX_GROUPS = [
      {key:"overdue", label:"Quá Hạn"}, {key:"today", label:"Hôm Nay"}, {key:"next7", label:"Sắp Tới 7 Ngày"},
      {key:"later", label:"Sau Đó"}, {key:"completed", label:"Đã Hoàn Thành"}
    ];
    function inboxGroupOf(o){
      var t=todayStr();
      if(o.status==="done"||o.status==="skipped") return "completed";
      if(!o.dueDate) return "later";
      if(o.dueDate<t) return "overdue";
      if(o.dueDate===t) return "today";
      if(o.dueDate<=addDays(t,7)) return "next7";
      return "later";
    }
    function seriesSummary(sid){
      var occs=liveOccs().filter(function(o){ return o.seriesId===sid; });
      var open=occs.filter(function(o){ return o.status!=="done"&&o.status!=="skipped"; });
      var doneN=occs.filter(function(o){ return o.status==="done"; }).length;
      var t=todayStr();
      var rep=null;
      var overdueOpen=open.filter(function(o){ return o.dueDate<t; }).sort(function(a,b){ return a.dueDate<b.dueDate? -1:1; });
      if(overdueOpen.length) rep=overdueOpen[0];
      if(!rep){ var tod=open.filter(function(o){ return o.dueDate===t; }); if(tod.length) rep=sortOccs(tod)[0]; }
      if(!rep && open.length) rep=open.slice().sort(function(a,b){ return a.dueDate<b.dueDate? -1:1; })[0];
      if(!rep && occs.length) rep=occs.slice().sort(function(a,b){ return a.dueDate>b.dueDate? -1:1; })[0];
      var nextOpen=open.filter(function(o){ return o.dueDate>t; }).sort(function(a,b){ return a.dueDate<b.dueDate? -1:1; })[0];
      return { occs:occs, total:occs.length, done:doneN, rep:rep, nextDate: nextOpen? nextOpen.dueDate : null,
        group: rep? inboxGroupOf(rep) : "later", sortKey: rep? rep.dueDate : "9999" };
    }
    function inboxPanelHTML(){
      var f=UI.inboxFilter;
      var projOpts='<option value="">Mọi dự án</option>'+state.projects.map(function(p){return '<option value="'+p.id+'"'+(f.projectId===p.id?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");
      var tagOpts='<option value="">Mọi tag</option>'+state.tags.map(function(t){return '<option value="'+t.id+'"'+(f.tagId===t.id?" selected":"")+'">#'+esc(t.name)+'</option>';}).join("");
      var s= f.seriesId? seriesById(f.seriesId) : null;
      var h='<div class="filter-panel">'
        + '<label class="fp-search">'+ICONS.search+'<input type="search" id="ib-q" placeholder="Tìm theo tên, mô tả, ghi chú..." value="'+esc(f.q)+'" aria-label="Tìm kiếm công việc" /></label>'
        + '<div class="fp-row"><select id="ib-proj" aria-label="Lọc theo dự án">'+projOpts+'</select><select id="ib-tag" aria-label="Lọc theo tag">'+tagOpts+'</select>'
        + '<select id="ib-pri" aria-label="Lọc theo ưu tiên"><option value="">Mọi ưu tiên</option><option value="gap"'+(f.priority==="gap"?" selected":"")+'>Gấp</option><option value="cao"'+(f.priority==="cao"?" selected":"")+'>Cao</option><option value="vua"'+(f.priority==="vua"?" selected":"")+'>Vừa</option><option value="thap"'+(f.priority==="thap"?" selected":"")+'>Thấp</option></select>'
        + '<select id="ib-status" aria-label="Lọc theo trạng thái"><option value="">Mọi trạng thái</option><option value="todo"'+(f.status==="todo"?" selected":"")+'>Chưa làm</option><option value="doing"'+(f.status==="doing"?" selected":"")+'>Đang làm</option><option value="done"'+(f.status==="done"?" selected":"")+'>Hoàn thành</option><option value="skipped"'+(f.status==="skipped"?" selected":"")+'>Bỏ qua</option></select></div>'
        + '<div class="fp-toggles">'
        + '<label class="show-done"><input type="checkbox" id="ib-showdone"'+(UI.showDone?" checked":"")+' /> Hiện việc đã xong</label>'
        + ((f.status==="done"||f.status==="skipped")? '<span class="fp-note">Đang lọc đích danh trạng thái đã xong nên việc đã xong vẫn hiện dù công tắc đang tắt.</span>' : '')
        + (s? '<span class="series-chip"><span>Chuỗi: '+esc(s.title)+'</span><button type="button" id="ib-clearseries" aria-label="Bỏ lọc theo chuỗi">'+ICONS.x+'</button></span>' : '')
        + (UI.saveViewOpen? '' : '<button class="btn small" id="ib-saveview" type="button" style="margin-left:auto">Lưu view</button>')
        + '</div>'
        + (UI.saveViewOpen? '<form class="saveview-form" id="ib-saveform"><input id="ib-viewname" type="text" placeholder="Tên view cho bộ lọc này…" aria-label="Tên view" /><button class="btn primary" type="submit">Lưu view</button><button class="btn" type="button" id="ib-savecancel">Huỷ</button></form>' : '')
        + (state.views.length? '<div class="saved-chips">'+state.views.map(function(v){ return '<span class="saved-chip"><button type="button" data-view-apply="'+v.id+'">'+esc(v.name)+'</button><button type="button" class="del" data-view-del="'+v.id+'" aria-label="Xoá view '+esc(v.name)+'">✕</button></span>'; }).join("")+'</div>' : '')
        + '</div>';
      return h;
    }
    function renderInbox(){
      var f=UI.inboxFilter;
      var showCompleted = UI.showDone || f.status==="done" || f.status==="skipped";
      var all=liveOccs().filter(function(o){ return occMatchesFilter(o, f); });
      if(f.seriesId) all=all.filter(function(o){ return o.seriesId===f.seriesId; });
      var bySeries={}, singles=[];
      all.forEach(function(o){ if(o.seriesId){ (bySeries[o.seriesId]=bySeries[o.seriesId]||[]).push(o); } else singles.push(o); });
      var summaries=Object.keys(bySeries).map(function(sid){ var sm=seriesSummary(sid); sm.series=seriesById(sid); sm.occs=bySeries[sid]; return sm; }).filter(function(sm){ return sm.series && !sm.series.deletedAt; });
      var items=[];
      summaries.forEach(function(sm){ items.push({kind:"series", group:sm.group, sortKey:sm.sortKey||"9999", sm:sm}); });
      singles.forEach(function(o){ items.push({kind:"single", group:inboxGroupOf(o), sortKey:o.dueDate||"9999-99", occ:o}); });
      var hasSpecific = f.q.trim() || f.status || f.seriesId;
      var h='<div class="viewhead"><h2>Hộp Đến</h2><span class="sub">Mọi việc gom theo chuỗi và nhóm thời gian — chuỗi chỉ hiện một dòng gốc</span></div>'+inboxPanelHTML();
      var anyResult=items.length>0;
      INBOX_GROUPS.forEach(function(g){
        var gItems=items.filter(function(it){ return it.group===g.key; });
        if(g.key==="completed" && !showCompleted) gItems=[];
        if(!gItems.length) return;
        gItems.sort(function(a,b){ return a.sortKey<b.sortKey? -1 : a.sortKey>b.sortKey? 1 : 0; });
        var occCount=gItems.reduce(function(n,it){ return n + (it.kind==="series"? it.sm.total : 1); }, 0);
        var open = hasSpecific? true : (UI.inboxGroups[g.key]!==false);
        h+='<div class="group-title"><button type="button" class="group-toggle" data-ibgroup="'+g.key+'" aria-expanded="'+open+'">'+esc(g.label)+' <span class="cnt">'+occCount+'</span><span class="chev'+(open?" open":"")+'">'+ICONS.chev+'</span></button></div>';
        if(open){
          h+=gItems.map(function(it){
            if(it.kind==="single") return taskRowHTML(it.occ, true);
            var sm=it.sm, s=sm.series, rep=sm.rep;
            var expanded=!!UI.inboxExpanded[s.id];
            var repLine = rep? (rep.dueDate<todayStr()? "Quá hạn từ "+fmtShort(rep.dueDate) : rep.dueDate===todayStr()? "Lần gần nhất: hôm nay" : "Lần gần nhất: "+fmtShort(rep.dueDate)) : "Chưa có lần làm";
            var row='<button type="button" class="series-row" data-series-toggle="'+s.id+'" aria-expanded="'+expanded+'">'
              + '<span class="sdot" style="background:'+seriesColor(s)+'"></span>'
              + '<span class="st-t"><b>'+esc(s.title)+'</b><span class="st-m"><span class="repeat-badge">'+ICONS.repeat+' Lặp lại · '+esc(rruleLabel(s.rrule))+'</span><span>'+sm.done+'/'+sm.total+' lần đã xong</span><span>'+repLine+'</span>'+(sm.nextDate? '<span>Lần tới: '+fmtShort(sm.nextDate)+'</span>' : '')+(rep&&isOverdue(rep)? '<span style="color:var(--red);font-weight:700">Có lần quá hạn</span>' : '')+'</span></span>'
              + '<span class="chev" style="color:var(--ink3);transform:rotate('+(expanded?90:0)+'deg)">'+ICONS.chev+'</span></button>';
            if(expanded){
              var vis=UI.inboxVisible[s.id]||30;
              var sorted=sortOccs(sm.occs.slice().sort(function(a,b){ return a.dueDate<b.dueDate? -1:1; }));
              row+='<div class="series-occs">'+sorted.slice(0,vis).map(function(o){ return taskRowHTML(o,true); }).join("")
                + (sorted.length>vis? '<button class="btn loadmore" type="button" data-series-more="'+s.id+'">Hiện thêm ('+(sorted.length-vis)+' lần nữa)</button>' : '') + '</div>';
            }
            return row;
          }).join("");
        }
      });
      if(!anyResult) h+=emptyHTML("Không có việc nào khớp", "Nới lỏng bộ lọc hoặc tạo việc mới bằng ô thêm nhanh ở trên.");
      else if(!showCompleted && !items.some(function(it){ return it.group!=="completed"; }) && items.length) h+=emptyHTML("Chỉ còn việc đã hoàn thành", "Bật “Hiện việc đã xong” trong panel lọc để xem.");
      $("#main").innerHTML = topbarHTML()+h;
      wireTopbar(); wireInboxPanel(); wireTaskRows($("#main"));
      $$("[data-ibgroup]").forEach(function(b){ b.addEventListener("click", function(){ var k=b.getAttribute("data-ibgroup"); UI.inboxGroups[k]=!(UI.inboxGroups[k]!==false); render(); }); });
      $$("[data-series-toggle]").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-series-toggle"); UI.inboxExpanded[id]=!UI.inboxExpanded[id]; render(); }); });
      $$("[data-series-more]").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-series-more"); UI.inboxVisible[id]=(UI.inboxVisible[id]||30)+30; render(); }); });
    }
    function wireInboxPanel(){
      var q=$("#ib-q"); if(!q) return;
      q.addEventListener("input", function(){ UI.inboxFilter.q=q.value; var pos=q.selectionStart; render(); var nq=$("#ib-q"); if(nq){ nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(e){} } });
      $("#ib-proj").addEventListener("change", function(e){ UI.inboxFilter.projectId=e.target.value; render(); });
      $("#ib-tag").addEventListener("change", function(e){ UI.inboxFilter.tagId=e.target.value; render(); });
      $("#ib-pri").addEventListener("change", function(e){ UI.inboxFilter.priority=e.target.value; render(); });
      $("#ib-status").addEventListener("change", function(e){ UI.inboxFilter.status=e.target.value; render(); });
      $("#ib-showdone").addEventListener("change", function(e){ UI.showDone=e.target.checked; if(UI.showDone) UI.inboxGroups.completed=true; render(); });
      var cs=$("#ib-clearseries"); if(cs) cs.addEventListener("click", function(){ UI.inboxFilter.seriesId=""; render(); });
      var sv=$("#ib-saveview"); if(sv) sv.addEventListener("click", function(){ UI.saveViewOpen=true; render(); var inp=$("#ib-viewname"); if(inp) inp.focus(); });
      var sc=$("#ib-savecancel"); if(sc) sc.addEventListener("click", function(){ UI.saveViewOpen=false; render(); });
      var sf=$("#ib-saveform"); if(sf) sf.addEventListener("submit", function(ev){ ev.preventDefault(); var name=$("#ib-viewname").value.trim(); if(!name){ toast("Hãy nhập tên view."); return; } state.views.push({id:uid(), name:name, filter:deepClone(UI.inboxFilter)}); save(); UI.saveViewOpen=false; render(); toast("Đã lưu view “"+name+"”."); });
      $$("[data-view-apply]").forEach(function(b){ b.addEventListener("click", function(){ var v=state.views.filter(function(x){return x.id===b.getAttribute("data-view-apply");})[0]; if(v){ UI.inboxFilter=Object.assign({q:"",projectId:"",tagId:"",priority:"",status:"",seriesId:""}, deepClone(v.filter)); if(UI.inboxFilter.seriesId) UI.inboxExpanded[UI.inboxFilter.seriesId]=true; render(); } }); });
      $$("[data-view-del]").forEach(function(b){ b.addEventListener("click", function(){ state.views=state.views.filter(function(x){return x.id!==b.getAttribute("data-view-del");}); save(); render(); toast("Đã xoá view."); }); });
    }

    /* ================= MÀN: LỊCH THÁNG ================= */
    function renderCalendar(){
      var ym=UI.calCursor.split("-"); var y=+ym[0], m=+ym[1]-1;
      var first=new Date(y,m,1); var startOffset=first.getDay();
      var gridStart=new Date(y,m,1-startOffset);
      var monthNames=["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6","Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];
      var h='<div class="viewhead"><h2>'+monthNames[m]+' '+y+'</h2><div class="datenav"><button class="btn" id="c-prev">‹ Tháng trước</button><button class="btn" id="c-today">Tháng này</button><button class="btn" id="c-next">Tháng sau ›</button></div></div>';
      h+='<div class="cal-grid">'+["CN","T2","T3","T4","T5","T6","T7"].map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join("");
      for(var i=0;i<42;i++){
        var d=new Date(gridStart.getTime()); d.setDate(gridStart.getDate()+i);
        var ds=dstr(d); var inMonth=d.getMonth()===m;
        var os=liveOccs().filter(function(o){return o.dueDate===ds;});
        var shown=os.slice(0,3).map(function(o){ var ss=o.seriesId? seriesById(o.seriesId): null; return '<div class="mini '+o.status+'">'+(o.status==="done"?"✓ ":o.status==="doing"?"◐ ":"")+(ss? "● " : "")+esc(o.title)+'</div>'; }).join("");
        h+='<button class="cal-cell'+(inMonth?"":" dim")+(ds===todayStr()?" today":"")+'" data-day="'+ds+'"><span class="d">'+d.getDate()+'</span>'+shown+(os.length>3? '<span class="more">+'+(os.length-3)+' việc nữa</span>' : '')+'</button>';
      }
      h+='</div><p class="hint" style="margin-top:12px">Bấm vào một ngày để xem và sửa việc của ngày đó (kể cả ngày đã qua). Dấu ● là việc thuộc chuỗi lặp, màu theo màu của chuỗi.</p>';
      $("#main").innerHTML=topbarHTML()+h; wireTopbar();
      $("#c-prev").addEventListener("click", function(){ var d=new Date(y,m-1,1); UI.calCursor=dstr(d).slice(0,7); render(); });
      $("#c-next").addEventListener("click", function(){ var d=new Date(y,m+1,1); UI.calCursor=dstr(d).slice(0,7); render(); });
      $("#c-today").addEventListener("click", function(){ UI.calCursor=todayStr().slice(0,7); render(); });
      $$("[data-day]").forEach(function(b){ b.addEventListener("click", function(){ UI.viewDate=b.getAttribute("data-day"); UI.view="today"; render(); }); });
    }

    /* ================= MÀN: KANBAN (v2.2 — chuỗi chỉ 1 thẻ gốc) ================= */
    function renderKanban(){
      var t=todayStr(), lo=addDays(t,-14), hi=addDays(t,14);
      var singles=liveOccs().filter(function(o){ return !o.seriesId && o.dueDate && o.dueDate>=lo && o.dueDate<=hi; });
      singles=applyFilter(singles);
      var cards=[];
      liveSeries().filter(function(s){ return s.kind!=="quit"; }).forEach(function(s){
        var sm=seriesSummary(s.id);
        if(!sm.rep) return;
        if(UI.filter.q || UI.filter.projectId || UI.filter.tagId || UI.filter.priority || UI.filter.status){ if(!occMatchesFilter(sm.rep, UI.filter)) return; }
        cards.push({series:s, sm:sm, rep:sm.rep});
      });
      function colOf(o){ if(isOverdue(o)) return "overdue"; return o.status; }
      var cols=[{k:"overdue",t:"Quá hạn"},{k:"todo",t:"Chưa làm"},{k:"doing",t:"Đang làm"},{k:"done",t:"Hoàn thành"},{k:"skipped",t:"Bỏ qua"}];
      var items=[];
      singles.forEach(function(o){ items.push({kind:"single", occ:o, col:colOf(o)}); });
      cards.forEach(function(c){ items.push({kind:"series", card:c, occ:c.rep, col:colOf(c.rep)}); });
      var h='<div class="viewhead"><h2>Bảng Kanban</h2><span class="sub">Việc một lần trong 14 ngày trước – 14 ngày tới · chuỗi lặp chỉ hiện một thẻ gốc</span></div>'
        + filterbarHTML()
        + '<p class="hint" style="margin-bottom:12px">Thẻ chuỗi xếp cột theo lần làm hôm nay hoặc gần nhất. Dùng nút chuyển cột trên mỗi thẻ để đổi trạng thái nhanh.</p>'
        + '<div class="kanban">'
        + cols.map(function(c){
            var its=items.filter(function(it){ return it.col===c.k; });
            return '<div class="kcol col-'+c.k+'"><h3>'+c.t+'<span>'+its.length+'</span></h3>'
              + (its.length? its.map(function(it){
                  var o=it.occ;
                  var proj=o.projectId? projectById(o.projectId): null;
                  var moveBtns=["todo","doing","done","skipped"].filter(function(st){ return st!==o.status; }).map(function(st){ return '<button class="btn small" data-kmove="'+o.id+'" data-st="'+st+'" type="button">→ '+STATUS_LABEL[st]+'</button>'; }).join("");
                  if(it.kind==="series"){
                    var s=it.card.series, sm=it.card.sm;
                    return '<div class="kcard"><div class="t" data-kopen="'+o.id+'"><span class="sdot" style="background:'+seriesColor(s)+'"></span><span>'+esc(s.title)+'</span></div>'
                      + '<div class="m"><span class="repeat-badge">'+ICONS.repeat+' Lặp lại · '+esc(rruleLabel(s.rrule))+'</span></div>'
                      + '<div class="m">'+(isOverdue(o)? '<span style="color:var(--red);font-weight:600">Có lần quá hạn · </span>' : '')+(sm.nextDate? 'Lần tới: '+fmtShort(sm.nextDate)+' · ' : '')+sm.done+'/'+sm.total+' lần đã xong</div>'
                      + '<div class="rowbtns">'+moveBtns+'</div></div>';
                  }
                  return '<div class="kcard"><div class="t" data-kopen="'+o.id+'"><span>'+esc(o.title)+'</span></div>'
                    + '<div class="m">'+(isOverdue(o)? '<span style="color:var(--red);font-weight:600">Quá hạn · </span>' : '')+esc(fmtShort(o.dueDate))+(o.dueTime?" · "+esc(o.dueTime):"")+(proj? " · "+esc(proj.name) : "")+(o.status==="doing"?" · "+(o.progress||0)+"%":"")+'</div>'
                    + '<div class="rowbtns">'+moveBtns+'</div></div>';
                }).join("") : '<p class="hint">Trống</p>')
              + '</div>';
          }).join("") + '</div>';
      $("#main").innerHTML=topbarHTML()+h; wireTopbar(); wireFilterbar();
      $$("[data-kmove]").forEach(function(b){ b.addEventListener("click", function(){ var o=occById(b.getAttribute("data-kmove")); if(o) setStatus(o, b.getAttribute("data-st"), true); }); });
      $$("[data-kopen]").forEach(function(b){ b.addEventListener("click", function(){ openDrawer(b.getAttribute("data-kopen")); }); });
    }
</script>

    <script>
    "use strict";
    /* ================= MÀN: DỰ ÁN & MẪU ================= */
    var projFormOpen=false, tagFormOpen=false, confirmTplDel=null, editingProjId=null;
    function renderProjects(){
      var active=state.projects.filter(function(p){return !p.archived;});
      var archived=state.projects.filter(function(p){return p.archived;});
      function projCard(p){
        var os=liveOccs().filter(function(o){return o.projectId===p.id;});
        var open=os.filter(function(o){return o.status!=="done"&&o.status!=="skipped";}).length;
        var done=os.filter(function(o){return o.status==="done";}).length;
        var seriesN=liveSeries().filter(function(s){return s.projectId===p.id;}).length;
        var notesN=state.notes.filter(function(n){return !n.deletedAt && n.projectId===p.id;}).length;
        if(editingProjId===p.id){
          return '<div class="card"><form data-pedit="'+p.id+'"><div class="f-field"><label>Tên dự án</label><input name="pname" value="'+esc(p.name)+'" /></div>'
            + '<div class="f-field"><label>Màu</label><div class="swatches">'+PROJECT_COLORS.map(function(c){ return '<button type="button" class="swatch'+(p.color===c?" sel":"")+'" data-pcolor="'+c+'" style="background:'+c+'" aria-label="Chọn màu '+c+'"></button>'; }).join("")+'</div></div>'
            + '<div style="display:flex;gap:6px"><button class="btn small primary" type="submit">Lưu</button><button class="btn small" type="button" data-pedit-cancel="1">Huỷ</button></div></form></div>';
        }
        return '<div class="card"><h3><span class="dot" style="width:12px;height:12px;border-radius:50%;background:'+esc(p.color)+';display:inline-block"></span>'+esc(p.name)+(p.archived?' <span class="chip">Đã lưu trữ</span>':'')+'</h3>'
          + '<p>'+open+' việc đang mở · '+done+' đã xong · '+seriesN+' chuỗi lặp · '+notesN+' ghi chú</p>'
          + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn small" data-pview="'+p.id+'">Xem việc</button><button class="btn small" data-pnotes="'+p.id+'">Ghi chú của dự án</button><button class="btn small" data-pedit-open="'+p.id+'">Sửa</button><button class="btn small" data-parch="'+p.id+'">'+(p.archived?"Bỏ lưu trữ":"Lưu trữ")+'</button><button class="btn small ghost" data-pdel="'+p.id+'">Xoá</button></div></div>';
      }
      var h='<div class="viewhead"><h2>Dự Án &amp; Mẫu</h2><span class="sub">Nhóm việc theo dự án, nhãn (tag) và mẫu việc</span></div>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'
        + (projFormOpen? '' : '<button class="btn primary" id="np-open" type="button">+ Tạo dự án</button>')
        + (tagFormOpen? '' : '<button class="btn" id="nt-open" type="button">+ Thêm tag</button>')
        + '</div>'
        + (projFormOpen? '<form class="filterbar" id="newproj" style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px"><input type="search" style="flex:1" id="np-name" placeholder="Tên dự án mới…" /><div class="swatches" id="np-colors">'+PROJECT_COLORS.map(function(c,i){ return '<button type="button" class="swatch'+(i===0?" sel":"")+'" data-npcolor="'+c+'" style="background:'+c+'" aria-label="Màu '+c+'"></button>'; }).join("")+'</div><button class="btn primary" type="submit">Tạo dự án</button><button class="btn" type="button" id="np-cancel">Huỷ</button></form>' : '')
        + (tagFormOpen? '<form class="filterbar" id="newtag" style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px"><input type="search" style="flex:1" id="nt-name" placeholder="Tên tag mới (không cần #)…" /><button class="btn" type="submit">Tạo tag</button><button class="btn" type="button" id="nt-cancel">Huỷ</button></form>' : '');
      h+='<div class="group-title">Dự án đang dùng <span class="cnt">'+active.length+'</span></div>';
      h+= active.length? '<div class="cards">'+active.map(projCard).join("")+'</div>' : emptyHTML("Chưa có dự án nào","Bấm “+ Tạo dự án” để nhóm các việc liên quan.");
      if(archived.length){ h+='<div class="group-title">Đã lưu trữ <span class="cnt">'+archived.length+'</span></div><div class="cards">'+archived.map(projCard).join("")+'</div>'; }
      h+='<div class="group-title">Tag <span class="cnt">'+state.tags.length+'</span></div>';
      h+= state.tags.length? '<div style="display:flex;gap:8px;flex-wrap:wrap">'+state.tags.map(function(t){ var n=liveOccs().filter(function(o){return (o.tags||[]).indexOf(t.id)>=0;}).length + state.notes.filter(function(x){return !x.deletedAt && (x.tags||[]).indexOf(t.id)>=0;}).length; return '<span class="chip tagchip" style="min-height:36px;padding:6px 12px">#'+esc(t.name)+' · '+n+' <button class="iconbtn" style="width:28px;height:28px" data-tdel="'+t.id+'" title="Xoá tag">✕</button></span>'; }).join("")+'</div>' : '<p class="hint">Chưa có tag nào.</p>';
      h+='<div class="group-title">Mẫu việc <span class="cnt">'+state.templates.length+'</span></div>';
      h+= state.templates.length? '<div class="cards">'+state.templates.map(function(t){
          var isDel = confirmTplDel===t.id;
          return '<div class="card"><h3>'+esc(t.name)+'</h3><p>'+esc(t.payload.title||"")+(t.payload.rrule? ' · '+esc(rruleLabel(t.payload.rrule)) : '')+'</p>'
            + (isDel? '<div class="inline-confirm"><span>Xoá mẫu này?</span><button class="btn small danger" data-tpldel-yes="'+t.id+'">Xoá mẫu</button><button class="btn small" data-tpldel-no="1">Giữ lại</button></div>'
                     : '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small primary" data-tpl="'+t.id+'">Tạo việc từ mẫu</button><button class="btn small ghost" data-tpldel="'+t.id+'">Xoá mẫu</button></div>')

      var guard=0;
      while(guard<800){ guard++; var o=byDate[d]; if(!o) break; if(o.status==="done"){ cur++; d=addDays(d,-1); } else if(o.status==="skipped"){ d=addDays(d,-1); } else break; }
      var dates=Object.keys(byDate).sort(); var best=0, run=0, prev=null;

      var doneTotal=dates.filter(function(ds){return byDate[ds].status==="done";}).length;
      var dueDates=dates.filter(function(ds){ return ds<=todayStr(); });
      var doneDue=dueDates.filter(function(ds){return byDate[ds].status==="done";}).length;
      return {cur:cur, best:Math.max(best,cur), doneTotal:doneTotal, total:dates.length, totalDue:dueDates.length, rate30: rate30Of(s)};

        + '<div class="card"><p>Dự báo 7 ngày tới</p><div class="big">'+fc.reduce(function(a,b){return a+b.n;},0)+'</div><p>'+fc.map(function(f){return f.ds.slice(8)+'/'+f.ds.slice(5,7)+': '+f.n;}).join(" · ")+'</p></div></div>'

    function reportRange(){
      var t=todayStr(), period=UI.reportPeriod, off=UI.reportOffset, from, to, label;

        var dow=parseD(t).getDay(); var monday=addDays(t, -((dow+6)%7) + off*7);
        from=monday; to=addDays(monday,6); label="Tuần "+fmtShort(from)+" – "+fmtShort(to);
      } else if(period==="month"){
        var base=parseD(t); base.setDate(1); base.setMonth(base.getMonth()+off);
        var y=base.getFullYear(), m=base.getMonth();
        from=y+"-"+pad2(m+1)+"-01"; to=y+"-"+pad2(m+1)+"-"+pad2(new Date(y,m+1,0).getDate());
        label="Tháng "+(m+1)+"/"+y;
      } else {
        var yy=parseD(t).getFullYear()+off;
        from=yy+"-01-01"; to=yy+"-12-31"; label="Năm "+yy;
      }
      return {from:from, to:to, label:label};
    }
    function habitReportsHTML(){
      var r=reportRange(); var t=todayStr();
      var dates=[]; for(var d=r.from; d<=r.to; d=addDays(d,1)) dates.push(d);
      var seriesList=liveSeries().filter(function(s){ return s.kind!=="quit"; });
      var h='<div class="group-title">Báo cáo từng thói quen</div><div class="panel">'
        + '<div class="report-controls"><div class="seg" style="max-width:300px" role="group" aria-label="Kỳ báo cáo">'
        + [["week","Tuần"],["month","Tháng"],["year","Năm"]].map(function(p){ return '<button type="button" data-rp="'+p[0]+'" class="'+(UI.reportPeriod===p[0]?"sel":"")+'">'+p[1]+'</button>'; }).join("")
        + '</div><div class="report-nav"><button class="btn small" id="rp-prev" type="button">‹ Kỳ trước</button><b>'+esc(r.label)+'</b><button class="btn small" id="rp-now" type="button"'+(UI.reportOffset===0?" disabled":"")+'>Nay</button><button class="btn small" id="rp-next" type="button"'+(UI.reportOffset>=0?" disabled":"")+'>Kỳ sau ›</button></div></div>'
        + '<p class="hint"><span class="legend-dot"></span> Chấm tròn đặc = Hoàn thành · <span class="legend-tri"></span> Tam giác = Đạt một phần · <span class="legend-ring"></span> Ô viền = Đã tới hạn, chưa làm · chấm mờ = chưa tới hạn / không có lần làm</p>';
      if(!seriesList.length) h+='<p class="hint">Chưa có chuỗi lặp nào để báo cáo. Tạo một việc lặp lại (mỗi ngày, hằng tuần…) để xem lưới chấm tại đây.</p>';
      else h+=seriesList.map(function(s){
        var byDate={};
        state.occs.forEach(function(o){ if(o.seriesId===s.id && !o.deletedAt) byDate[o.dueDate]=o; });
        var dueDays=dates.filter(function(ds){ return ds<=t && byDate[ds]; });
        var doneDays=dueDays.filter(function(ds){ return byDate[ds].status==="done"; });
        var rate= dueDays.length? Math.round(doneDays.length/dueDays.length*100) : 0;
        var color=seriesColor(s);
        var dots=dates.map(function(ds){
          var o=byDate[ds]; var cls, style="", title;
          if(ds>t){ cls="rdot future"; title=fmtShort(ds)+": chưa tới"; }
          else if(!o){ cls="rdot future"; title=fmtShort(ds)+": không có lần làm"; }
          else if(o.status==="done"){ cls="rdot done"; style=' style="background:'+color+'"'; title=fmtShort(ds)+": hoàn thành"; }
          else if(o.status==="doing" || (o.progress||0)>0 || (o.count||0)>0){ cls="rdot partial"; style=' style="background:'+color+';opacity:.45"'; title=fmtShort(ds)+": đang làm "+(o.progress||0)+"%"; }
          else if(o.status==="skipped"){ cls="rdot due"; title=fmtShort(ds)+": bỏ qua"; }
          else { cls="rdot due"; title=fmtShort(ds)+": chưa làm"; }
          return '<span class="'+cls+'"'+style+' title="'+title+'"></span>';
        }).join("");
        return '<div class="report-block"><div class="report-head"><span class="sdot" style="background:'+color+'"></span><b>'+esc(s.title)+'</b>'
          + (s.targetValue? '<span class="rt">'+s.targetValue.toLocaleString("vi-VN")+(s.targetUnit? " "+esc(s.targetUnit) : "")+' / lần</span>' : '')
          + '<span class="rr">'+rate+'%</span></div>'
          + '<div class="report-grid" role="img" aria-label="'+esc(s.title)+': hoàn thành '+doneDays.length+' trên '+dueDays.length+' lần đã tới hạn trong kỳ, đạt '+rate+'%">'+dots+'</div>'
          + (UI.reportPeriod==="week"? '<div class="report-week-labels">'+dates.map(function(ds){ var dn=["CN","T2","T3","T4","T5","T6","T7"]; return '<span>'+dn[parseD(ds).getDay()]+' '+ds.slice(8)+'</span>'; }).join("")+'</div>' : '')
          + '<p class="report-note">'+doneDays.length+'/'+dueDays.length+' lần đã tới hạn trong kỳ đã hoàn thành</p></div>';
      }).join("");
      return h+'</div>';
    }
    function wireHabitReports(){
      $$("[data-rp]").forEach(function(b){ b.addEventListener("click", function(){ UI.reportPeriod=b.getAttribute("data-rp"); UI.reportOffset=0; render(); }); });
      var pv=$("#rp-prev"); if(pv) pv.addEventListener("click", function(){ UI.reportOffset--; render(); });
      var nx=$("#rp-next"); if(nx) nx.addEventListener("click", function(){ if(UI.reportOffset<0){ UI.reportOffset++; render(); } });

</script>

    <script>
    "use strict";
    /* ================= GHI CHÚ (v2.2) ================= */
    UI.notesQ=""; UI.notesTagFilter=""; UI.notesProjectFilter="";
    var CHECKLIST_RE = /^(\s*-\s*)\[([ xX])\]\s?(.*)$/;
    function checklistParts(line){ var m=line.match(CHECKLIST_RE); if(!m) return null; return { checked:(m[2]||" ").toLowerCase()==="x", text:m[3]||"" }; }
    function noteExcerpt(content, n){ return (content||"").split("\n").map(function(l){return l.trim();}).filter(Boolean).slice(0, n||2).join(" "); }
    function normalizeLineForLink(line){ var p=checklistParts(line); return p? ("[] "+p.text) : line; }
    function matchLineLinks(links, lines){
      var result={}, used={};
      lines.forEach(function(line, index){
        var norm=normalizeLineForLink(line);
        function sameLine(stored){ return stored===line || normalizeLineForLink(stored)===norm; }
        var found=null;
        (links||[]).forEach(function(l){ if(found||used[l.id]) return; if(l.lineIndex===index && (l.lineText===""||sameLine(l.lineText))) found=l; });
        if(!found) (links||[]).forEach(function(l){ if(found||used[l.id]) return; if(l.lineText!==""&&sameLine(l.lineText)) found=l; });
        if(found){ used[found.id]=true; result[index]=found; }
      });
      return result;
    }
    function liveNotes(){ return state.notes.filter(function(n){ return !n.deletedAt; }); }
    function renderNotes(){
      var h='<div class="viewhead"><h2>Ghi Chú</h2><span class="sub">Ghi chú độc lập, nhật ký ngày và tài liệu quy trình gắn chuỗi</span></div>'
        + '<div class="tabswitch" role="tablist" aria-label="Ghi chú và nhật ký"><button type="button" role="tab" data-ntab="notes" class="'+(UI.notesTab==="notes"?"sel":"")+'">Ghi chú</button><button type="button" role="tab" data-ntab="journal" class="'+(UI.notesTab==="journal"?"sel":"")+'">Nhật ký ngày</button></div>'
        + '<div id="notesbody"></div>';
      $("#main").innerHTML=topbarHTML()+h; wireTopbar();
      $$("[data-ntab]").forEach(function(b){ b.addEventListener("click", function(){ UI.notesTab=b.getAttribute("data-ntab"); render(); }); });
      if(UI.notesTab==="journal") renderJournalTab(); else renderNotesTab();
    }
    function renderNotesTab(){
      var host=$("#notesbody"); if(!host) return;
      var q=UI.notesQ, tf=UI.notesTagFilter, pf=UI.notesProjectFilter;
      var list=liveNotes().filter(function(n){
        if(q && (n.title+" "+n.content).toLowerCase().indexOf(q.toLowerCase())<0) return false;
        if(tf && (n.tags||[]).indexOf(tf)<0) return false;
        if(pf && n.projectId!==pf) return false;
        return true;
      }).sort(function(a,b){ if(a.pinned!==b.pinned) return a.pinned? -1:1; return (b.updatedAt||0)-(a.updatedAt||0); });
      var h='<div class="filter-panel"><label class="fp-search">'+ICONS.search+'<input type="search" id="nt-q" placeholder="Tìm trong ghi chú…" value="'+esc(q)+'" aria-label="Tìm trong ghi chú" /></label>'
        + '<div class="fp-row" style="grid-template-columns:1fr 1fr"><select id="nt-tag" aria-label="Lọc ghi chú theo tag"><option value="">Mọi tag</option>'+state.tags.map(function(t){return '<option value="'+t.id+'"'+(tf===t.id?" selected":"")+'>#'+esc(t.name)+'</option>';}).join("")+'</select>'
        + '<select id="nt-proj" aria-label="Lọc ghi chú theo dự án"><option value="">Mọi dự án</option>'+state.projects.map(function(p){return '<option value="'+p.id+'"'+(pf===p.id?" selected":"")+'>'+esc(p.name)+'</option>';}).join("")+'</select></div></div>'
        + '<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><button class="btn primary" id="nt-new" type="button">+ Ghi chú mới</button><span class="hint">'+list.length+' ghi chú · ghim xếp trước, rồi sửa gần nhất</span></div>';
      if(!list.length) h+=emptyHTML((q||tf||pf)? "Không có ghi chú khớp bộ lọc" : "Chưa có ghi chú nào", (q||tf||pf)? "Nới lỏng điều kiện tìm/lọc hoặc tạo ghi chú mới." : "Bấm “Ghi chú mới” để viết ghi chú đầu tiên — ghi chú đứng độc lập hoặc gắn vào dự án/chuỗi việc làm tài liệu quy trình.");
      else h+='<div class="note-grid">'+list.map(function(n){
        var proj=n.projectId? projectById(n.projectId): null;
        var ser=n.seriesId? seriesById(n.seriesId): null;
        return '<button class="note-card" data-note-open="'+n.id+'" type="button"><span class="n-t">'+(n.pinned? ICONS.pin : '')+esc(n.title||"Không tiêu đề")+'</span>'
          + '<span class="n-x">'+esc(noteExcerpt(n.content,3)||"Chưa có nội dung")+'</span>'
          + '<span class="n-m">'+(proj? '<span class="chip"><span class="dot" style="background:'+esc(proj.color)+'"></span>'+esc(proj.name)+'</span>' : '')+(ser? '<span class="chip">Chuỗi: '+esc(ser.title)+'</span>' : '')+(n.tags||[]).map(function(tid){ var t=tagById(tid); return t? '<span class="chip tagchip">#'+esc(t.name)+'</span>' : ""; }).join("")+((n.lineLinks||[]).length? '<span class="chip">'+n.lineLinks.length+' dòng đã thành việc</span>' : '')+'</span>'
          + '<span class="n-u">Sửa '+fmtDT(n.updatedAt)+'</span></button>';
      }).join("")+'</div>';
      host.innerHTML=h;
      var nq=$("#nt-q"); nq.addEventListener("input", function(){ UI.notesQ=nq.value; var pos=nq.selectionStart; renderNotesTab(); var e2=$("#nt-q"); if(e2){ e2.focus(); try{ e2.setSelectionRange(pos,pos); }catch(e){} } });
      $("#nt-tag").addEventListener("change", function(e){ UI.notesTagFilter=e.target.value; renderNotesTab(); });
      $("#nt-proj").addEventListener("change", function(e){ UI.notesProjectFilter=e.target.value; renderNotesTab(); });
      $("#nt-new").addEventListener("click", function(){
        var n={ id:uid(), title:"", content:"", pinned:false, projectId:null, seriesId:null, tags:[], lineLinks:[], deletedAt:null, createdAt:Date.now(), updatedAt:Date.now() };
        state.notes.push(n); save(); openNoteEditor(n.id);
      });
      $$("[data-note-open]", host).forEach(function(b){ b.addEventListener("click", function(){ openNoteEditor(b.getAttribute("data-note-open")); }); });
    }
    function renderJournalTab(){
      var host=$("#notesbody"); if(!host) return;
      var date=UI.journalDate, t=todayStr();
      var completed=liveOccs().filter(function(o){ return o.dueDate===date && o.status==="done"; });
      var overdue=liveOccs().filter(function(o){ return o.dueDate && o.dueDate<=date && o.status!=="done" && o.status!=="skipped" && (date===t? isOverdue(o) : o.dueDate<date); });
      var withNotes=liveOccs().filter(function(o){ return o.dueDate===date && o.note; });
      var content=state.journals[date]||"";
      var h='<div style="display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><button class="btn" id="j-prev" type="button">‹</button><input type="date" id="j-pick" value="'+date+'" style="padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px" /><button class="btn" id="j-next" type="button">›</button>'
        + (date!==t? '<button class="btn" id="j-today" type="button">Về hôm nay</button>' : '') + '<span class="hint">Ngày nhật ký: '+esc(fmtDate(date))+'</span></div>'
        + '<div class="panel"><h3>Tự tổng hợp · '+esc(fmtDate(date))+'</h3>'
        + '<div class="sub-t">Việc đã hoàn thành ('+completed.length+')</div>'
        + (completed.length? completed.map(function(o){ return '<div class="step-row"><span style="color:var(--green)">'+ICONS.check+'</span><span class="st"><button class="textlink" data-jopen="'+o.id+'" type="button" style="color:var(--ink);text-decoration:none;font-weight:600">'+esc(o.title)+'</button></span></div>'; }).join("") : '<p class="hint">Chưa có việc nào hoàn thành trong ngày này.</p>')
        + '<div class="sub-t">Việc quá hạn tính đến ngày này ('+overdue.length+')</div>'
        + (overdue.length? overdue.map(function(o){ return '<div class="step-row"><span class="st"><button class="textlink" data-jopen="'+o.id+'" type="button" style="color:var(--ink);text-decoration:none;font-weight:600">'+esc(o.title)+'</button> <span class="hint">· hạn '+fmtShort(o.dueDate)+' · '+STATUS_LABEL[o.status]+'</span></span></div>'; }).join("") : '<p class="hint">Không có việc quá hạn tính đến ngày này.</p>')
        + '<div class="sub-t">Ghi chú từng lần làm trong ngày ('+withNotes.length+')</div>'
        + (withNotes.length? withNotes.map(function(o){ return '<div class="step-row"><span class="st"><button class="textlink" data-jopen="'+o.id+'" type="button" style="color:var(--ink);text-decoration:none;font-weight:600">'+esc(o.title)+'</button><span style="display:block;color:var(--ink2);font-size:13.5px">'+esc(o.note)+'</span></span></div>'; }).join("") : '<p class="hint">Ngày này chưa có ghi chú nào ở từng lần làm.</p>')
        + '</div>'
        + '<div class="panel"><h3>Viết tự do</h3>'
        + ((completed.length===0&&overdue.length===0&&withNotes.length===0&&!content)? '<p class="hint">Trang nhật ký trống — ngày này chưa có gì được ghi. Viết vài dòng đầu tiên ở dưới, nội dung tự lưu.</p>' : '')
        + '<textarea id="j-content" rows="7" placeholder="Hôm nay thế nào? Điều gì đáng nhớ, điều gì cần rút kinh nghiệm…" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical">'+esc(content)+'</textarea>'
        + '<p class="savestate" id="j-state">Tự lưu khi gõ</p></div>';
      host.innerHTML=h;
      $("#j-prev").addEventListener("click", function(){ UI.journalDate=addDays(UI.journalDate,-1); renderJournalTab(); });

      var jt=$("#j-today"); if(jt) jt.addEventListener("click", function(){ UI.journalDate=todayStr(); renderJournalTab(); });

      var ta=$("#j-content"), st=$("#j-state"), jTimer=null;

        st.textContent="Chưa lưu thay đổi…";
        clearTimeout(jTimer);
        jTimer=setTimeout(function(){ state.journals[UI.journalDate]=ta.value; save(); st.textContent="Đã lưu ✓"; }, 600);
      });
    }
    function openNoteEditor(noteId){
      var n=noteById(noteId); if(!n) return;
      var draft={ title:n.title, content:n.content, pinned:n.pinned, projectId:n.projectId, seriesId:n.seriesId, tags:(n.tags||[]).slice() };
      var saveStateEl=null, saveTimer=null;
      function persist(msg){
        n.title=draft.title.trim(); n.content=draft.content; n.pinned=draft.pinned; n.projectId=draft.projectId; n.seriesId=draft.seriesId; n.tags=draft.tags.slice(); n.updatedAt=Date.now();
        save();
        if(saveStateEl) saveStateEl.textContent=msg||"Đã lưu ✓";
      }
      function scheduleSave(){
        if(saveStateEl) saveStateEl.textContent="Chưa lưu thay đổi…";
        clearTimeout(saveTimer);
        saveTimer=setTimeout(function(){ persist(); drawLines(); }, 650);
      }
      function linesHTML(){
        var lines=draft.content.split("\n");
        var linkByLine=matchLineLinks(n.lineLinks||[], lines);
        var rows=lines.map(function(line, index){ return {line:line, index:index}; }).filter(function(e){ return e.line.trim().length>0; });
        if(!rows.length) return '<p class="hint">Chưa có dòng nào. Viết nội dung ở trên, mỗi dòng có thể tick (nếu là dòng có ô tick) và chuyển thành việc đến hạn hôm nay.</p>';
        return '<ul class="note-lines-list">'+rows.map(function(e){
          var parts=checklistParts(e.line);
          var link=linkByLine[e.index];
          var display=(parts? parts.text : e.line.trim())||e.line.trim();
          var right="";
          if(link){
            var lo=link.occId? occById(link.occId) : null;
            if(!link.occId || (lo && lo.deletedAt && !seriesById(lo.seriesId)) || !lo) right='<span class="link-chip deleted">Việc đã xoá</span>';
            else if(lo.deletedAt) right='<button type="button" class="link-chip" data-nl-open="'+lo.id+'">↗ '+esc(link.occTitle)+' (thùng rác)</button>';
            else right='<button type="button" class="link-chip" data-nl-open="'+lo.id+'">↗ '+esc(link.occTitle)+'</button>';
          } else {
            right='<button type="button" class="btn small" data-nl-convert="'+e.index+'">Thành việc</button>';
          }
          return '<li class="note-line-row">'
            + (parts? '<button type="button" class="steptoggle'+(parts.checked?" done":"")+'" data-nl-toggle="'+e.index+'" aria-label="Tick dòng">'+ICONS.check+'</button>' : '<span class="nl-dot"></span>')
            + '<span class="nl-t'+(parts&&parts.checked?" done":"")+'">'+esc(display)+'</span>'+right+'</li>';
        }).join("")+'</ul>';
      }
      function drawLines(){
        var host=$("#ne-lines"); if(!host) return;
        host.innerHTML=linesHTML();
        wireLines();
      }
      function wireLines(){
        $$("[data-nl-toggle]").forEach(function(b){ b.addEventListener("click", function(){
