<!doctype html>
<html lang="vi" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Task Manager — Bản Public</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#f6f4ef; --surface:#fffdfa; --surface2:#efece4; --ink:#1d2129; --ink2:#5b6068; --ink3:#8a8f98;
        --line:#e2ded2; --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e0f2ef;
        --amber:#b45309; --amber-soft:#fdf0dd; --red:#b3352b; --red-soft:#fbe9e7;
        --green:#2e7d4f; --green-soft:#e4f2e8; --blue:#2563eb; --blue-soft:#e6eefc;
        --shadow:0 10px 30px rgba(29,33,41,.10); --radius:14px;
        --heat1:#bfe3d2; --heat2:#7cc7a4; --heat3:#3da873; --heat4:#1d7a4c;
      }
      :root[data-theme="dark"]{
        --bg:#14161a; --surface:#1d2026; --surface2:#262a31; --ink:#eceef1; --ink2:#a8adb6; --ink3:#767c86;
        --line:#333842; --accent:#2dd4bf; --accent-ink:#06231f; --accent-soft:#123b36;
        --amber:#f0b269; --amber-soft:#3d2f18; --red:#f08a80; --red-soft:#40201d;
        --green:#7fce9b; --green-soft:#1e3325; --blue:#8fb4f5; --blue-soft:#1d2c47;
        --shadow:0 10px 30px rgba(0,0,0,.45);
        --heat1:#1e3d2c; --heat2:#276848; --heat3:#2f9263; --heat4:#43b67c;
      }
      @media (prefers-color-scheme: dark){
        :root[data-theme="system"]{
          --bg:#14161a; --surface:#1d2026; --surface2:#262a31; --ink:#eceef1; --ink2:#a8adb6; --ink3:#767c86;
          --line:#333842; --accent:#2dd4bf; --accent-ink:#06231f; --accent-soft:#123b36;
          --amber:#f0b269; --amber-soft:#3d2f18; --red:#f08a80; --red-soft:#40201d;
          --green:#7fce9b; --green-soft:#1e3325; --blue:#8fb4f5; --blue-soft:#1d2c47;
          --shadow:0 10px 30px rgba(0,0,0,.45);
          --heat1:#1e3d2c; --heat2:#276848; --heat3:#2f9263; --heat4:#43b67c;
        }
      }
      *{box-sizing:border-box;scrollbar-width:none}
      *::-webkit-scrollbar{display:none;width:0;height:0}
      html,body{margin:0;padding:0}
      body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
      button{font:inherit;cursor:pointer}
      input,select,textarea{font:inherit;color:var(--ink)}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      kbd{background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px;font-family:inherit}

      /* ---------- GATE (AUTH) ---------- */
      #gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
      #gate[hidden]{display:none}
      .gate-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);max-width:400px;width:100%;padding:32px 28px;text-align:left}
      .gate-mark{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
      .gate-card h1{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
      .gate-card p{color:var(--ink2);margin:0 0 20px;font-size:14px}
      .gate-card label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
      .gate-card input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
      .gate-err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:14px;display:none}
      .gate-err.show{display:block}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px;font-size:14.5px;text-decoration:none}
      .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
      .btn.danger{background:var(--red);border-color:var(--red);color:#fff}
      .btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
      .btn.small{min-height:38px;padding:6px 12px;font-size:13.5px}
      .btn.block{width:100%}
      .btn[disabled]{opacity:.55;cursor:default}
      .gate-card .btn.primary{width:100%;margin-top:20px}
      .gate-foot{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;text-align:center}
      .gate-note{font-size:12.5px;color:var(--ink3);margin-top:16px;text-align:center}

      /* ---------- APP SHELL ---------- */
      #app{display:none;min-height:100dvh}
      #app.on{display:flex}
      aside{width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:2px}
      .brand{font-weight:800;font-size:16px;padding:4px 10px 12px;letter-spacing:.04em}
      .brand small{display:block;font-weight:500;color:var(--ink3);font-size:12px;margin-top:2px;letter-spacing:0}
      .side-nav{overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
      .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;color:var(--ink2);font-weight:600;min-height:42px;font-size:14.5px}
      .navbtn svg{flex:0 0 auto}
      .navbtn.active{background:var(--accent-soft);color:var(--ink)}
      .navbtn .cnt{margin-left:auto;background:var(--surface2);border-radius:99px;font-size:12px;padding:1px 8px;color:var(--ink2)}
      .navbtn .cnt.hot{background:var(--red-soft);color:var(--red)}
      .navbtn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
      aside .spacer{flex:1;min-height:8px}
      .side-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
      .theme-seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin:4px 2px}
      .theme-seg button{flex:1;border:0;background:transparent;padding:7px 2px;border-radius:7px;font-weight:600;color:var(--ink2);font-size:12.5px;min-height:32px}
      .theme-seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
      .version-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;color:var(--ink2);font-size:13px;font-weight:600;min-height:40px}
      .version-row:hover{background:var(--surface2)}
      .unseen-dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:0 0 auto;margin-left:auto}
      main{flex:1;min-width:0;padding:0 26px 110px;max-width:1060px;margin:0 auto;width:100%}
      .qa-sticky{position:sticky;top:0;z-index:40;background:var(--bg);padding:16px 0 10px}
      .quickadd{display:flex;gap:8px}
      .quickadd input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;min-height:48px}
      .qa-hint{font-size:12px;color:var(--ink3);margin-top:6px}
      .viewhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
      .viewhead h2{font-size:24px;margin:0;font-weight:800;letter-spacing:-.01em}
      .viewhead .sub{color:var(--ink2);font-size:14px}
      .datenav{display:flex;align-items:center;gap:6px;margin-left:auto}
      .datenav .btn{min-width:44px;padding:8px 10px}
      .datenav input[type=date]{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
      #fab{display:none}
      @media (min-width:861px){
        #fab{display:inline-flex;position:fixed;right:26px;bottom:26px;z-index:70;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:var(--shadow);align-items:center;gap:8px;min-height:52px}
      }

      /* error banner */
      #errbanner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:180;width:min(560px,calc(100vw - 24px));display:none}
      #errbanner.on{display:block}
      .err-card{background:var(--red-soft);border:1px solid var(--red);color:var(--ink);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);font-size:14px}
      .err-card .rowb{display:flex;gap:6px;margin-top:9px}

      .day-progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
      .day-progress .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);margin-bottom:8px}
      .day-progress .row b{color:var(--ink);font-size:15px}
      .pbar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
      .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

      .group-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
      .group-title .cnt{background:var(--surface2);border-radius:99px;padding:0 8px;font-size:12px;letter-spacing:0}
      .group-title.overdue{color:var(--red)}
      button.group-toggle{width:100%;background:none;border:0;color:inherit;font:inherit;display:flex;align-items:center;gap:8px;padding:0;text-align:left;cursor:pointer}
      .group-toggle .chev{margin-left:auto;color:var(--ink3);transition:transform .2s}
      .group-toggle .chev.open{transform:rotate(90deg)}

      /* attention + backup warning + quit strip */
      .attention{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
      .attention h3{margin:0 0 10px;font-size:15.5px}
      .attention .a-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
      .attention .a-row:first-of-type{border-top:0}
      .attention .a-t{flex:1;min-width:0;font-weight:600;font-size:14.5px}
      .attention .a-m{font-size:12.5px;color:var(--ink2);font-weight:500}
      .backup-warn{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius);padding:13px 16px;margin-bottom:18px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
      .quitstrip-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;color:var(--ink)}
      .quitstrip-row .qt{flex:1;font-weight:600;min-width:0}
      .quit-clock-sm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}

      /* task rows */
      .task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
      .task.done{opacity:.62}
      .task.skipped{opacity:.5}
      .task .check{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink3);background:transparent;display:flex;align-items:center;justify-content:center;margin-top:2px;color:transparent;padding:0}
      .task .check.doing{border-color:var(--amber);color:var(--amber)}
      .task .check.done{border-color:var(--green);background:var(--green);color:#fff}
      .task .body{flex:1;min-width:0;cursor:pointer}
      .task .title{font-weight:600;font-size:15.5px;word-break:break-word;display:flex;align-items:center;gap:8px}
      .task.done .title{text-decoration:line-through}
      .sdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;display:inline-block}
      .task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:12.5px;color:var(--ink2);align-items:center}
      .task .meta .overdue{color:var(--red);font-weight:600}
      .chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2)}
      .chip .dot{width:8px;height:8px;border-radius:50%}
      .chip.p-gap{background:var(--red-soft);color:var(--red)}
      .chip.p-cao{background:var(--amber-soft);color:var(--amber)}
      .chip.tagchip{background:var(--blue-soft);color:var(--blue)}
      .stchip{display:inline-flex;align-items:center;border:1.5px solid var(--ink3);border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:700;color:var(--ink2)}
      .stchip.doing{border-color:var(--amber);color:var(--amber)}
      .stchip.done{border-color:var(--green);color:var(--green)}
      .stchip.skipped{border-color:var(--ink3);color:var(--ink3)}
      .task .acts{display:flex;gap:4px;flex:0 0 auto}
      .iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
      .iconbtn:hover{background:var(--surface2)}
      .iconbtn.run{color:var(--red)}
      .task .prog{margin-top:8px;display:none}
      .task .prog.show{display:flex;align-items:center;gap:10px}
      .task .prog input[type=range]{flex:1;accent-color:var(--amber);min-height:32px}
      .task .prog b{font-size:13px;min-width:38px;text-align:right}
      .steps-mini{margin-top:6px;font-size:12.5px;color:var(--ink3)}
      .countctl{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:99px;padding:2px;margin-top:8px}
      .countctl button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
      .countctl .cv{min-width:86px;text-align:center;font-size:13px;font-weight:700}
      .countctl .cv small{display:block;font-weight:500;color:var(--ink2);font-size:11px}
      .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--ink2)}
      .empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:4px}

      /* filter panel (Hộp Đến) */
      .filter-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
      .fp-search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--surface);margin-bottom:10px}
      .fp-search svg{color:var(--ink3);flex:0 0 auto}
      .fp-search input{flex:1;border:0;background:transparent;padding:12px 0;font-size:15px;min-height:46px;min-width:0}
      .fp-search input:focus{outline:none}
      .fp-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
      .fp-row select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;font-size:14px;width:100%;min-width:0}
      .fp-toggles{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
      .show-done{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px}
      .show-done input{width:19px;height:19px;accent-color:var(--accent)}
      .fp-note{font-size:12.5px;color:var(--ink3)}
      .series-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
      .series-chip button{border:0;background:transparent;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
      .saveview-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
      .saveview-form input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
      .saved-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
      .saved-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
      .saved-chip>button:first-child{border:0;background:transparent;font:inherit;color:inherit;padding:2px}
      .saved-chip .del{border:0;background:transparent;width:26px;height:26px;border-radius:50%;color:var(--ink2);display:flex;align-items:center;justify-content:center}
      .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
      .filterbar input[type=search],.filterbar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;font-size:14px}
      .filterbar input[type=search]{flex:1;min-width:160px}

      /* inbox series rows */
      .series-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;color:var(--ink)}
      .series-row .st-t{flex:1;min-width:0}
      .series-row .st-t b{font-size:15.5px;display:block}
      .series-row .st-m{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
      .repeat-badge{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
      .series-occs{margin:0 0 10px 14px}
      .loadmore{width:100%;margin:2px 0 10px}

      /* calendar */
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
      .cal-dow{font-size:12px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
      .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;color:var(--ink)}
      .cal-cell.dim{opacity:.38}
      .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
      .cal-cell .d{font-weight:700;font-size:13px}
      .cal-cell .mini{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .cal-cell .mini.done{color:var(--green)}
      .cal-cell .mini.doing{color:var(--amber)}
      .cal-cell .more{font-size:11px;color:var(--ink3)}

      /* kanban */
      .kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px;align-items:start}
      .kcol{background:var(--surface2);border-radius:var(--radius);padding:12px;min-height:110px}
      .kcol h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
      .kcol.col-overdue h3{color:var(--red)}
      .kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
      .kcard .t{font-weight:600;font-size:14.5px;cursor:pointer;display:flex;gap:7px;align-items:flex-start}
      .kcard .m{font-size:12px;color:var(--ink2);margin-top:3px}
      .kcard .rowbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
      .kcard .rowbtns .btn{min-height:34px;padding:4px 10px;font-size:12.5px}

      /* cards generic */
      .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
      .card h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
      .card .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
      .card p{margin:4px 0;color:var(--ink2);font-size:13.5px}
      .heat{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin-top:8px}
      .heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
      .heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3)}.heat i.l4{background:var(--heat4)}
      table.stats{width:100%;border-collapse:collapse;font-size:14px}
      table.stats th,table.stats td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
      table.stats th{color:var(--ink3);font-size:12.5px}
      table.stats td.num,table.stats th.num{text-align:right}
      .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
      .panel>h3{margin:0 0 10px;font-size:16.5px}
      .panel .sub-t{font-size:13px;font-weight:700;color:var(--ink3);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}

      /* habits / quit */
      .habit-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;color:var(--ink)}
      .habit-card .h-info{flex:1;min-width:0}
      .habit-card .h-info b{font-size:15.5px;display:block}
      .habit-card .h-info small{color:var(--ink2);font-size:12.5px}
      .habit-card .h-streaks{display:flex;gap:16px;text-align:center}
      .habit-card .h-streaks b{font-size:19px;display:block}
      .habit-card .h-streaks small{color:var(--ink3);font-size:11px}
      .quit-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
      .quit-card .q-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
      .quit-name{font-weight:700;font-size:16px;color:#fff;border-radius:99px;padding:3px 13px}
      .quit-clock{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
      .quit-facts{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0 4px}
      .quit-facts div dt{font-size:12px;color:var(--ink3);font-weight:600}
      .quit-facts div dd{margin:2px 0 0;font-weight:700;font-size:14.5px}
      .quit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
      .inline-confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;background:var(--red-soft);border-radius:10px;padding:6px 10px}

      /* habit reports */
      .report-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
      .report-nav{display:flex;align-items:center;gap:8px}
      .report-block{border-top:1px solid var(--line);padding:14px 0 4px}
      .report-block:first-of-type{border-top:0}
      .report-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
      .report-head b{font-size:15px}
      .report-head .rt{font-size:12.5px;color:var(--ink2)}
      .report-head .rr{margin-left:auto;font-weight:800}
      .report-grid{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 6px}
      .rdot{width:11px;height:11px;border-radius:50%;background:var(--surface2);display:inline-block;flex:0 0 auto}
      .rdot.done{border-radius:50%}
      .rdot.partial{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
      .rdot.due{background:transparent;border:1.5px solid var(--ink3);width:9px;height:9px}
      .rdot.future{opacity:.35}
      .report-week-labels{display:flex;gap:3px;font-size:10.5px;color:var(--ink3)}
      .report-week-labels span{width:11px;text-align:center;overflow:visible;white-space:nowrap}
      .report-note{font-size:12.5px;color:var(--ink2)}
      .legend-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ink3);vertical-align:-1px}
      .legend-tri{display:inline-block;width:11px;height:11px;background:var(--ink3);clip-path:polygon(50% 0,100% 100%,0 100%);vertical-align:-1px}
      .legend-ring{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink3);vertical-align:-1px}

      /* notes */
      .tabswitch{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;margin-bottom:16px;max-width:420px}
      .tabswitch button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:8px;font-weight:600;color:var(--ink2);min-height:40px;font-size:14px}
      .tabswitch button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
      .note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
      .note-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;text-align:left;width:100%;color:var(--ink);display:block}
      .note-card .n-t{font-weight:700;font-size:15.5px;display:flex;gap:7px;align-items:center}
      .note-card .n-x{color:var(--ink2);font-size:13.5px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
      .note-card .n-m{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
      .note-card .n-u{font-size:12px;color:var(--ink3);margin-top:9px}
      .note-lines-list{list-style:none;margin:0;padding:0}
      .note-line-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
      .note-line-row .nl-t{flex:1;min-width:0;font-size:14.5px;padding-top:5px}
      .note-line-row .nl-t.done{text-decoration:line-through;color:var(--ink3)}
      .nl-dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin:11px 3px 0;flex:0 0 auto}
      .link-chip{display:inline-flex;align-items:center;gap:5px;background:var(--blue-soft);color:var(--blue);border:0;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;min-height:32px}
      .link-chip.deleted{background:var(--surface2);color:var(--ink3)}
      .savestate{font-size:12.5px;color:var(--ink3)}

      /* system list */
      .syslist{list-style:none;margin:0;padding:0}
      .syslist li{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
      .syslist li:last-child{border-bottom:0}
      .syslist .sl{flex:0 0 110px;font-weight:700;color:var(--ink2)}
      .syslist .sv{flex:1;min-width:0}
      .textlink{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:inherit;text-decoration:underline}
      .switch{position:relative;width:48px;height:28px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);padding:0;flex:0 0 auto;vertical-align:middle}
      .switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .18s}
      .switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
      .switch[aria-checked="true"] i{left:22px;background:#fff}
      .trash-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
      .trash-row:last-child{border-bottom:0}
      .trash-row .tt{flex:1;min-width:0}
      .trash-row .tt small{display:block;color:var(--ink3);font-size:12.5px}
      .type-badge{background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;color:var(--ink2)}

      /* collapsible group */
      .cgroup{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:var(--surface)}
      .cgroup-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:13px 14px;color:var(--ink);font-weight:700;font-size:14.5px}
      .cgroup-head .cs{font-weight:500;color:var(--ink3);font-size:12.5px;flex:1;min-width:0}
      .cgroup-head .chev{color:var(--ink3);transition:transform .2s;flex:0 0 auto}
      .cgroup-head .chev.open{transform:rotate(90deg)}
      .cgroup-body{padding:2px 14px 14px}
      .cgroup-body[hidden]{display:none}

      /* drawer */
      #scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:90;display:none}
      #scrim.on{display:block}
      #drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--surface);z-index:100;transform:translateX(105%);transition:transform .25s ease;overflow-y:auto;padding:20px;box-shadow:var(--shadow)}
      #drawer.on{transform:none}
      #drawer h3{margin:0 40px 4px 0;font-size:19px}
      .dsec{margin-top:20px}
      .dsec>h4{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
      .dclose{position:absolute;top:14px;right:14px}
      .step-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
      .step-row .st{flex:1;min-width:0}
      .step-row .st.done{text-decoration:line-through;color:var(--ink3)}
      .steptoggle{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--ink3);background:transparent;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;padding:0}
      .steptoggle.done{background:var(--green);border-color:var(--green);color:#fff}
      .step-note{margin:2px 0 8px 44px}
      .step-note-view{display:block;width:100%;text-align:left;background:var(--surface2);border:0;border-radius:9px;padding:8px 11px;font-size:13.5px;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
      .step-note-add{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:2px 0;min-height:30px}
      .step-note-edit textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);resize:vertical;min-height:60px}
      .step-note-edit .rowb{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;align-items:center}
      .step-note-edit .rowb .cnt-n{margin-right:auto;font-size:12px;color:var(--ink3)}
      .step-add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
      .step-add input{flex:1;min-width:130px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
      .scope-seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
      .scope-seg button{border:0;background:transparent;padding:7px 10px;border-radius:7px;font-weight:600;color:var(--ink2);font-size:12.5px;min-height:34px}
      .scope-seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
      textarea.note{width:100%;min-height:74px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical}
      .hist{font-size:13px;color:var(--ink2)}
      .hist div{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
      .hist time{color:var(--ink3);white-space:nowrap;font-size:12px;padding-top:1px}
      .seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
      .seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:8px;font-weight:600;color:var(--ink2);min-height:40px;font-size:13.5px;white-space:nowrap}
      .seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
      .drawer-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .drawer-btn-grid .btn{width:100%}
      .facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}
      .facts dt{color:var(--ink3);font-weight:600}
      .facts dd{margin:0;font-weight:600}
      .timer-live{text-align:center;padding:8px 0 2px}
      .timer-big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
      .timer-lbl{color:var(--ink2);font-size:13px;margin-top:2px}
      .cd-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
      .cd-chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;min-height:38px}
      .cd-chips button.sel{background:var(--accent-soft);border-color:var(--accent)}
      .sess-block{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
      .sess-head{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:13.5px}
      .sess-badge{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700}
      .sess-badge.down{background:var(--amber-soft);color:var(--amber)}
      .sess-tl{list-style:none;margin:9px 0 0;padding:0 0 0 6px;font-size:13px;color:var(--ink2)}
      .sess-tl li{display:flex;gap:9px;padding:3px 0;align-items:center}
      .sess-tl .ev-dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
      .sess-tl .ev-start{background:var(--green)} .sess-tl .ev-pause{background:var(--amber)} .sess-tl .ev-resume{background:var(--blue)} .sess-tl .ev-stop{background:var(--red)}
      .sess-tl time{margin-left:auto;color:var(--ink3);font-size:12px}
      .remind-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
      .remind-row .rt-t{font-weight:600}
      .remind-row.done{opacity:.55}
      .remind-row .rt-t.done{text-decoration:line-through}
      .series-note-item{display:block;width:100%;text-align:left;background:var(--surface2);border:0;border-radius:11px;padding:11px 13px;margin-bottom:8px;color:var(--ink)}
      .series-note-item b{display:block;font-size:14.5px}
      .series-note-item span{font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

      /* modal + forms */
      #modalwrap{position:fixed;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;background:rgba(10,12,16,.45);padding:18px;overflow-y:auto}
      #modalwrap.on{display:flex}
      .modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;padding:22px;margin:auto 0;box-shadow:var(--shadow)}
      .modal.wide{max-width:720px}
      .modal h3{margin:0 0 14px;font-size:19px}
      .modal h3 .micro{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--ink3);font-weight:700;margin-bottom:3px}
      .f-field{margin-bottom:13px}
      .f-field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
      .f-field label span{color:var(--ink3);font-weight:500}
      .f-field input,.f-field select,.f-field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
      .f-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .f-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
      .chipsel{display:flex;flex-wrap:wrap;gap:6px}
      .chipsel .chip{cursor:pointer;border:1px solid var(--line);min-height:34px;padding:4px 12px;background:var(--surface)}
      .chipsel .chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
      .modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
      .hint{font-size:12.5px;color:var(--ink3);margin-top:4px}
      .form-err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
      .scope-list{display:flex;flex-direction:column;gap:8px}
      .scope-opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
      .scope-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
      .scope-opt input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent)}
      .scope-opt b{display:block;font-size:14.5px}
      .scope-opt small{color:var(--ink2);font-size:12.5px}
      .kind-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .kind-opt{display:flex;gap:9px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;font-weight:600}
      .kind-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
      .kind-opt input{width:17px;height:17px;accent-color:var(--accent)}
      .rec-cell{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:700;font-size:15px;color:var(--ink)}
      .rec-cell .chev{margin-left:auto;color:var(--ink3);transition:transform .2s}
      .rec-cell .chev.open{transform:rotate(90deg)}
      .rec-panel{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:8px}
      .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0;position:relative}
      .swatch.sel{border-color:var(--ink)}
      .swatch.auto{background:var(--surface2);color:var(--ink2);font-size:10.5px;font-weight:700;width:auto;border-radius:99px;padding:0 12px;height:34px}
      .healthy-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
      .healthy-row:last-child{border-bottom:0}
      .healthy-row .h-c{flex:1;min-width:0}
      .healthy-row .h-c b{font-size:14.5px;display:block}
      .healthy-row .h-c p{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}

      /* version dialog */
      .whatsnew-hl{list-style:none;margin:0 0 6px;padding:0}
      .whatsnew-hl li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
      .chg{flex:0 0 auto;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700;margin-top:1px}
      .chg.feature{background:var(--green-soft);color:var(--green)}
      .chg.improvement{background:var(--blue-soft);color:var(--blue)}
      .chg.fix{background:var(--amber-soft);color:var(--amber)}
      .ver-timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
      .ver-item{position:relative;padding:0 0 16px 16px}
      .ver-item::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
      .ver-item.cur::before{background:var(--accent);border-color:var(--accent)}
      .ver-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
      .ver-head{display:flex;align-items:flex-start;gap:10px}
      .ver-badge{background:var(--accent);color:var(--accent-ink);border-radius:8px;font-weight:800;padding:2px 10px;font-size:14px}
      .ver-head h4{margin:0;font-size:15.5px;flex:1}
      .ver-head .vd{font-size:12.5px;color:var(--ink3)}
      .cur-badge{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
      .ver-changes{list-style:none;margin:10px 0 0;padding:0}
      .ver-changes li{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:14px}
      .help-sec{margin-bottom:20px}
      .help-sec h4{font-size:15.5px;margin:0 0 7px}
      .help-sec p{margin:0 0 8px;color:var(--ink2);font-size:14.5px}
      .help-sec ul{margin:0 0 8px;padding-left:20px;color:var(--ink2);font-size:14.5px}
      .help-sec li{margin-bottom:4px}
      .help-sec strong{color:var(--ink)}

      /* palette */
      #palette{position:fixed;inset:0;z-index:130;display:none;background:rgba(10,12,16,.45);padding:12vh 16px 16px;justify-content:center;align-items:flex-start}
      #palette.on{display:flex}
      .pal-box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;box-shadow:var(--shadow);overflow:hidden}
      .pal-box input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px;font-size:16px;background:var(--surface)}
      .pal-list{max-height:50vh;overflow-y:auto}
      .pal-group{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:10px 16px 2px}
      .pal-item{padding:11px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14.5px}
      .pal-item.sel,.pal-item:hover{background:var(--surface2)}
      .pal-item .k{margin-left:auto;font-size:12px;color:var(--ink3)}

      /* toast + reminder */
      #toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;width:min(480px,calc(100vw - 24px))}
      .toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:14px}
      .toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:32px;text-align:left}
      #remindbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:140;width:min(520px,calc(100vw - 24px));display:none}
      #remindbar.on{display:block}
      .remind-card{background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
      .remind-card b{font-size:15.5px}
      .remind-card .rowb{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

      /* bottom nav mobile + more sheet */
      #bottomnav{display:none}
      #moresheet{display:none}
      @media (max-width:860px){
        aside{display:none}
        main{padding:0 14px 150px}
        #toasts{bottom:150px}

    /* ---------- AUTH ---------- */
    function loadAuth(){ try{ var a=JSON.parse(localStorage.getItem(LS_AUTH)); return (a && a.hash) ? a : null; }catch(e){ return null; } }
    function saveAuth(a){ if(a) localStorage.setItem(LS_AUTH, JSON.stringify(a)); else localStorage.removeItem(LS_AUTH); }
    function sha256Hex(text){
      if(window.crypto && crypto.subtle && crypto.subtle.digest){
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){
          return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
        });
      }
      var h1=0x811c9dc5, h2=0x01000193, out="";
      for(var r=0;r<8;r++){ for(var i=0;i<text.length;i++){ h1^=text.charCodeAt(i)+r; h1=Math.imul(h1,0x01000193); h2=Math.imul(h2^text.charCodeAt(i),0x811c9dc5);} out+=("0000000"+(h1>>>0).toString(16)).slice(-8); }
      return Promise.resolve(out);
    }
    function makeSalt(){ var a=new Uint8Array(16); if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(var i=0;i<16;i++) a[i]=Math.floor(Math.random()*256); return Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2);}).join(""); }
    function hashCode(code, salt){ return sha256Hex(salt+"::"+code); }

    function showGate(mode, err){
      var g=$("#gate"); g.hidden=false; g.innerHTML=gateHTML(mode, err);

          var code2=$("#gatecode2").value;
          if(code.length<4){ showGate("setup","Mã truy cập cần ít nhất 4 ký tự."); return; }
          if(code!==code2){ showGate("setup","Hai lần nhập mã chưa khớp. Hãy nhập lại."); return; }
          var salt=makeSalt();
          hashCode(code, salt).then(function(h){ saveAuth({salt:salt, hash:h}); sessionStorage.setItem(SS_UNLOCK,"1"); enterApp(); });
        } else {
          var auth=loadAuth(); if(!auth){ showGate("setup"); return; }
          hashCode(code, auth.salt).then(function(h){
            if(h===auth.hash){ sessionStorage.setItem(SS_UNLOCK,"1"); enterApp(); }
            else showGate("lock","Mã truy cập chưa đúng. Hãy thử lại.");

    /* ---------- DỮ LIỆU + MIGRATION v2.0 → v3 ---------- */
    function defaultState(){
      return { v:3, projects:[], tags:[], series:[], occs:[], notes:[], journals:{}, activity:[], templates:[], views:[], requireLock:true };
    }
    var state = defaultState();
    function migrateData(d){
      /* Đưa dữ liệu schema cũ (v2 — bản public v2.0) sang cấu trúc v3 mà không mất gì. */
      var s = defaultState();
      s.projects = d.projects||[]; s.tags = d.tags||[]; s.activity = d.activity||[];
      s.templates = d.templates||[]; s.views = d.views||[];
      s.requireLock = d.requireLock!==false;
      s.notes = (d.notes||[]).map(function(n){
        return { id:n.id||uid(), title:n.title||"", content:n.content||"", pinned:!!n.pinned,
          projectId:n.projectId||null, seriesId:n.seriesId||null, tags:(n.tags||[]).slice(),
          lineLinks:(n.lineLinks||[]).slice(), deletedAt:n.deletedAt||null,
          createdAt:n.createdAt||Date.now(), updatedAt:n.updatedAt||n.createdAt||Date.now() };
      });
      s.journals = d.journals||{};
      s.series = (d.series||[]).map(function(x){
        return { id:x.id, title:x.title, desc:x.desc||"", projectId:x.projectId||null, priority:x.priority||"vua",
          estimateMin:x.estimateMin||0, dueTime:x.dueTime||"", tags:(x.tags||[]).slice(), steps:(x.steps||[]).slice(),
          rrule:x.rrule||null, start:x.start||todayStr(), endType:x.endType||"never", endDate:x.endDate||"", endCount:x.endCount||0,
          active:x.active!==false, deletedAt:x.deletedAt||null, createdAt:x.createdAt||Date.now(),
          remindOffset:(x.remindOffset!=null? x.remindOffset : -1), skipDates:(x.skipDates||[]).slice(),
          kind:(x.kind==="quit" ? "quit" : "task"), color:x.color||null,
          targetValue:(x.targetValue!=null? x.targetValue : null), targetUnit:x.targetUnit||"",
          quitStartedAt:x.quitStartedAt||null, relapses:(x.relapses||[]).slice(),
          generateAheadDays:(x.generateAheadDays!=null? Math.max(0, Math.min(30, x.generateAheadDays)) : 7) };
      });
      s.occs = (d.occs||[]).map(function(o){
        return { id:o.id, seriesId:o.seriesId||null, title:o.title, desc:o.desc||"", projectId:o.projectId||null,
          priority:o.priority||"vua", estimateMin:o.estimateMin||0, dueDate:o.dueDate||null, dueTime:o.dueTime||"",
          status:o.status||"todo", progress:o.progress||0, count:o.count||0, note:o.note||"", tags:(o.tags||[]).slice(),
          steps:(o.steps||[]).map(function(st){ return { id:st.id||uid(), title:st.title, done:!!st.done, note:st.note||"" }; }),
          sessions:(o.sessions||[]).map(function(ss){
            if(ss.mode) return ss;
            return { id:uid(), start:ss.start, end:ss.end||null, mode:"up", targetSec:null, acc:0, segStart:ss.start,
              pausedAt:null, finalSec:(ss.end? Math.max(0, Math.round((ss.end-ss.start)/1000)) : null),
              events:[{kind:"start", at:ss.start}].concat(ss.end? [{kind:"stop", at:ss.end}] : []) };
          }),
          reminders:(o.reminders||[]).slice(),
          remindOffset:(o.remindOffset!=null? o.remindOffset : -1), remindFired:!!o.remindFired, snoozeUntil:o.snoozeUntil||0,
          detached:!!o.detached, deletedAt:o.deletedAt||null, createdAt:o.createdAt||Date.now(),
          sourceNoteId:o.sourceNoteId||null, sourceLineIndex:(o.sourceLineIndex!=null? o.sourceLineIndex : null) };
      });
      return s;
    }
    function loadData(){
      try{
        var raw=localStorage.getItem(LS_DATA);
        if(raw){ var d=JSON.parse(raw); if(d && (d.v===3 || d.v===2)){ state = (d.v===3)? d : migrateData(d); return; } }
      }catch(e){ logError("loadData", e && e.message); }
      state=defaultState();
    }
    var saveTimer=null;
    function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(function(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(state)); }catch(e){ logError("save", e && e.message); toast("Không lưu được dữ liệu (bộ nhớ trình duyệt đầy?). Hãy xuất sao lưu JSON ngay."); } }, 60); }
    function saveNow(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(state)); }catch(e){ logError("saveNow", e && e.message); } }

    /* ---------- SAO LƯU CỤC BỘ (v2.4 — tương đương localStorage) ---------- */
    function loadBackups(){ try{ var b=JSON.parse(localStorage.getItem(LS_BACKUPS)); return Array.isArray(b)? b : []; }catch(e){ return []; } }
    function storeBackups(list){ try{ localStorage.setItem(LS_BACKUPS, JSON.stringify(list)); }catch(e){ logError("storeBackups", e && e.message); } }
    function createBackup(source){
      var list=loadBackups();
      var payload=JSON.stringify({app:"task-manager", format:"checklist-v2", version:3, exportedAt:new Date().toISOString(), data:state});
      list.unshift({ id:uid(), ts:Date.now(), source:source||"manual", size:payload.length, payload:payload });
      while(list.length>5) list.pop();
      storeBackups(list);
      return list[0];
    }
    function maybeAutoBackup(){
      var list=loadBackups();
      var latest=list[0];
      if(!latest || (Date.now()-latest.ts) > 24*3600000) createBackup("auto");
    }
    function backupStale(){
      var list=loadBackups();
      if(!list.length) return false;
      return (Date.now()-list[0].ts) > 7*24*3600000;
    }
    function runRestoreDrill(){
      try{
        var list=loadBackups(); if(!list.length) return;
        var parsed=JSON.parse(list[0].payload); var d=parsed && parsed.data ? parsed.data : parsed;
        if(!d || !Array.isArray(d.occs) || !Array.isArray(d.series)) throw new Error("bad");
        meta.drill={ ts:Date.now(), passed:true, detail:d.series.length+" chuỗi · "+d.occs.length+" lần làm đọc lại khớp" };
      }catch(e){ meta.drill={ ts:Date.now(), passed:false, detail:"Bản gần nhất không đọc lại được" }; }
      saveMeta();
    }

    /* ---------- undo ---------- */
    var undoStack=[];
    function pushUndo(label){ undoStack.push({label:label, snap:JSON.stringify(state)}); if(undoStack.length>25) undoStack.shift(); refreshUndoUI(); }
    function undoLabel(){ var u=undoStack[undoStack.length-1]; return u? ("Hoàn tác: "+u.label) : null; }
    function doUndo(){
      var u=undoStack.pop(); if(!u){ toast("Không còn thao tác nào để hoàn tác."); return; }

      toast("Đã hoàn tác: "+u.label);
    }

        else b.style.display="none";

    /* ---------- activity log ---------- */
    function logAct(occ, kind, text){
      state.activity.push({ id:uid(), ts:Date.now(), occId:occ?occ.id:null, seriesId:occ?(occ.seriesId||null):null, title:occ?occ.title:"", kind:kind, text:text });
      if(state.activity.length>4000) state.activity.splice(0, state.activity.length-4000);
    }
    function logSystem(text){
      state.activity.push({ id:uid(), ts:Date.now(), occId:null, seriesId:null, title:"", kind:"system", text:text });
      if(state.activity.length>4000) state.activity.splice(0, state.activity.length-4000);
    }

    /* ---------- bộ máy lặp ---------- */
    function rruleLabel(r){
      if(!r) return "Một lần";
      var iv=r.interval||1;
      if(r.freq==="daily") return iv>1 ? "Mỗi "+iv+" ngày" : "Hằng ngày";
      if(r.freq==="workday") return "Ngày làm việc (T2–T6)";
      if(r.freq==="weekly"){ var names=["CN","T2","T3","T4","T5","T6","T7"]; var ds=(r.weekdays&&r.weekdays.length? r.weekdays.map(function(w){return names[w];}).join(", ") : ""); return (iv>1?"Mỗi "+iv+" tuần":"Hằng tuần")+(ds?" · "+ds:""); }
      if(r.freq==="monthly"){
        if(r.monthMode==="nth") { var nn=["","đầu","thứ 2","thứ 3","thứ 4","cuối"]; var wd=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"]; return (iv>1?"Mỗi "+iv+" tháng":"Hằng tháng")+" · "+wd[r.monthWeekday||1]+" "+(nn[r.monthNth||1]||"")+" của tháng"; }
        return (iv>1?"Mỗi "+iv+" tháng":"Hằng tháng")+" · ngày "+(r.monthDay||1);
      }
      return "Lặp lại";
    }
    function seriesDates(s, fromStr, toStr){
      var out=[]; if(!s.rrule) return out;
      var start=parseD(s.start); if(!start) return out;
      var from=parseD(fromStr), to=parseD(toStr);
      var lo = from>start? from : new Date(start.getTime());
      var hi = to;
      if(s.endType==="date" && s.endDate){ var ed=parseD(s.endDate); if(ed<hi) hi=ed; }
      if(hi<lo) return out;
      var count=0;
      if(s.endType==="count"){ count = countMatches(s, start, addDays(dstr(lo),-1)); if(count>=(s.endCount||0)) return out; }
      var d=new Date(lo.getTime()), guard=0;
      while(d<=hi && guard<4000){
        guard++;
        if(matchesRule(s, d)){
          if(s.endType==="count"){ if(count>=(s.endCount||0)) break; count++; }
          out.push(dstr(d));
        }
        d.setDate(d.getDate()+1);
      }
      return out;
    }
    function countMatches(s, fromD, toStr){
      var to=parseD(toStr); if(!to||to<fromD) return 0; var n=0, d=new Date(fromD.getTime()), g=0;
      while(d<=to && g<4000){ g++; if(matchesRule(s,d)) n++; d.setDate(d.getDate()+1); }
      return n;
    }
    function matchesRule(s, d){
      var r=s.rrule; if(!r) return false;
      var start=parseD(s.start); var iv=r.interval||1;
      var diffDays=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);
      if(diffDays<0) return false;
      if(r.freq==="daily") return diffDays % iv === 0;
      if(r.freq==="workday") return d.getDay()>=1 && d.getDay()<=5;
      if(r.freq==="weekly"){
        if(!r.weekdays || !r.weekdays.length) return d.getDay()===start.getDay();
        if(r.weekdays.indexOf(d.getDay())<0) return false;
        var startSunday=new Date(start.getTime()); startSunday.setDate(start.getDate()-start.getDay());
        var dSunday=new Date(d.getTime()); dSunday.setDate(d.getDate()-d.getDay());
        return Math.round((dSunday-startSunday)/604800000) % iv === 0;
      }
      if(r.freq==="monthly"){
        var mDiff=(d.getFullYear()-start.getFullYear())*12 + (d.getMonth()-start.getMonth());
        if(mDiff<0 || mDiff % iv !== 0) return false;
        if(r.monthMode==="nth"){
          if(d.getDay()!==(r.monthWeekday!=null?r.monthWeekday:start.getDay())) return false;
          var nth=r.monthNth||1;
          if(nth===5){ var nm=new Date(d.getFullYear(), d.getMonth(), d.getDate()+7); return nm.getMonth()!==d.getMonth(); }
          return Math.floor((d.getDate()-1)/7)+1===nth;
        }
        var md=r.monthDay||start.getDate();
        var lastDay=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
        return d.getDate()===Math.min(md, lastDay);
      }
      return false;
    }
    function occInteracted(o){
      return o.status!=="todo" || (o.progress||0)>0 || (o.count||0)>0 || !!o.note || (o.steps||[]).some(function(st){return st.done || st.note;}) || (o.sessions||[]).length>0 || (o.reminders||[]).length>0;
    }
    function newOccFromSeries(s, ds){
      return { id:uid(), seriesId:s.id, title:s.title, desc:s.desc||"", projectId:s.projectId||null,
        priority:s.priority||"vua", estimateMin:s.estimateMin||0, dueDate:ds, dueTime:s.dueTime||"",
        status:"todo", progress:0, count:0, note:"", tags:(s.tags||[]).slice(),
        steps:(s.steps||[]).map(function(t){ return {id:uid(), title:t, done:false, note:""}; }),
        sessions:[], reminders:[], remindOffset:(s.remindOffset!=null?s.remindOffset:-1), remindFired:false, snoozeUntil:0,
        detached:false, deletedAt:null, createdAt:Date.now(), sourceNoteId:null, sourceLineIndex:null };
    }
    function materialize(){
      var today=todayStr();
      var from=addDays(today,-370);
      var changed=false;
      state.series.forEach(function(s){
        if(s.deletedAt || s.active===false || s.kind==="quit" || !s.rrule) return;
        var ahead=(s.generateAheadDays!=null? s.generateAheadDays : 7);
        var to=addDays(today, ahead);
        var have={};
        state.occs.forEach(function(o){ if(o.seriesId===s.id) have[o.dueDate]=true; });
        var skip={}; (s.skipDates||[]).forEach(function(d){ skip[d]=true; });
        seriesDates(s, from, to).forEach(function(ds){
          if(have[ds] || skip[ds]) return;
          state.occs.push(newOccFromSeries(s, ds)); changed=true;
        });
        /* v2.12 — dọn lần làm tương lai vượt mốc tạo trước mà CHƯA có tương tác:
           xoá hẳn (không vào thùng rác), chỉ ghi 1 dòng nhật ký hệ thống tổng hợp. */
        var pruned=0;
        state.occs = state.occs.filter(function(o){
          if(o.seriesId===s.id && !o.deletedAt && o.dueDate>to && !occInteracted(o)){ pruned++; return false; }
          return true;
        });
        if(pruned>0){ logSystem("Hệ thống dọn "+pruned+" lần làm tương lai chưa có tương tác của chuỗi “"+s.title+"” (vượt mốc tạo trước)."); changed=true; }
      });
      if(changed) save();
    }

    /* ---------- truy vấn ---------- */
    function occById(id){ for(var i=0;i<state.occs.length;i++) if(state.occs[i].id===id) return state.occs[i]; return null; }
    function seriesById(id){ for(var i=0;i<state.series.length;i++) if(state.series[i].id===id) return state.series[i]; return null; }
    function projectById(id){ for(var i=0;i<state.projects.length;i++) if(state.projects[i].id===id) return state.projects[i]; return null; }
    function tagById(id){ for(var i=0;i<state.tags.length;i++) if(state.tags[i].id===id) return state.tags[i]; return null; }
    function noteById(id){ for(var i=0;i<state.notes.length;i++) if(state.notes[i].id===id) return state.notes[i]; return null; }
    function liveOccs(){ return state.occs.filter(function(o){ return !o.deletedAt; }); }
    function liveSeries(){ return state.series.filter(function(s){ return !s.deletedAt; }); }
    function isOverdue(o){ return o.dueDate && o.dueDate<todayStr() && o.status!=="done" && o.status!=="skipped"; }
    function seriesTargetOf(o){ var s=o&&o.seriesId? seriesById(o.seriesId): null; return s? (s.targetValue||null) : null; }
    function remindAtOf(o){
      if(!o || o.remindOffset==null || o.remindOffset<0 || !o.dueDate) return 0;
      var base=parseD(o.dueDate);
      if(o.dueTime){ var p=o.dueTime.split(":"); base.setHours(+p[0], +p[1]||0, 0, 0); } else base.setHours(9,0,0,0);
      return base.getTime() - o.remindOffset*60000;
    }
    function sortOccs(list){
      var pr={gap:0,cao:1,vua:2,thap:3};
      return list.slice().sort(function(a,b){
        if((a.dueTime||"99")!==(b.dueTime||"99")) return (a.dueTime||"99")<(b.dueTime||"99")?-1:1;
        if(pr[a.priority||"vua"]!==pr[b.priority||"vua"]) return pr[a.priority||"vua"]-pr[b.priority||"vua"];
        return (a.createdAt||0)-(b.createdAt||0);
      });
    }

    /* ---------- phiên đếm giờ (đếm xuôi + đếm ngược) ---------- */
    function liveSession(o){ return (o.sessions||[]).filter(function(s){return !s.end;})[0] || null; }
    function sessionElapsed(s, now){
      if(s.end) return s.finalSec!=null? s.finalSec : Math.max(0, Math.round((s.end-s.start)/1000));
      var acc=s.acc||0;
      if(s.pausedAt) return acc;
      return acc + Math.max(0, Math.floor((now-(s.segStart||s.start))/1000));
    }
    function actualSeconds(o){
      var now=Date.now(), total=0;
      (o.sessions||[]).forEach(function(s){ total += sessionElapsed(s, now); });
      return total;
    }
    function actualMin(o){ return Math.round(actualSeconds(o)/60); }
    function startSession(o, mode, targetSec){
      o.sessions=o.sessions||[];
      var now=Date.now();
      var s={ id:uid(), start:now, end:null, mode:mode||"up", targetSec:targetSec||null, acc:0, segStart:now, pausedAt:null, finalSec:null, events:[{kind:"start", at:now}] };
      o.sessions.push(s);
      if(o.status==="todo"){ o.status="doing"; if(o.progress==null) o.progress=0; }
      logAct(o,"timer_start", mode==="down"? ("Bắt đầu đếm ngược "+fmtSec(targetSec||0)) : "Bắt đầu đếm giờ");
      return s;
    }
    function pauseSession(o, s){
      var now=Date.now();
      s.acc=(s.acc||0)+Math.max(0, Math.floor((now-(s.segStart||s.start))/1000));
      s.pausedAt=now; s.events.push({kind:"pause", at:now});
      logAct(o,"timer_pause","Tạm dừng đếm giờ");
    }
    function resumeSession(o, s){
      var now=Date.now();
      s.segStart=now; s.pausedAt=null; s.events.push({kind:"resume", at:now});
      logAct(o,"timer_resume","Tiếp tục đếm giờ");
    }
    function stopSession(o, s, natural){
      var now=Date.now();
      var el=sessionElapsed(s, now);
      s.finalSec = (s.mode==="down" && natural && s.targetSec) ? s.targetSec : el;
      s.end=now; s.pausedAt=null; s.events.push({kind:"stop", at:now});
      logAct(o,"timer_stop","Kết thúc phiên đếm giờ · tổng đã làm "+fmtDur(actualMin(o)));
    }
    var audioCtx=null;
    function beep(){
      try{
        if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==="suspended") audioCtx.resume();
        var t=audioCtx.currentTime;
        [0,0.25].forEach(function(off){
          var osc=audioCtx.createOscillator(), g=audioCtx.createGain();
          osc.frequency.value=880; osc.connect(g); g.connect(audioCtx.destination);
          g.gain.setValueAtTime(0.0001, t+off); g.gain.exponentialRampToValueAtTime(0.25, t+off+0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+off+0.22);
          osc.start(t+off); osc.stop(t+off+0.25);
        });
      }catch(e){}
    }
    function notifyFire(title, body){
      if(!meta.notify) return;
      try{ if(window.Notification && Notification.permission==="granted") new Notification(title, { body:body||"" }); }catch(e){}
      try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
    }
</script>
