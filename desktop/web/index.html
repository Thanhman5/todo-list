      $$("[data-restore-bk]").forEach(function(b){ b.addEventListener("click", function(){ confirmRestoreId=b.getAttribute("data-restore-bk"); render(); }); });
      $$("[data-restore-no]").forEach(function(b){ b.addEventListener("click", function(){ confirmRestoreId=null; render(); }); });
      $$("[data-restore-yes]").forEach(function(b){ b.addEventListener("click", function(){
        var bk=loadBackups().filter(function(x){return x.id===b.getAttribute("data-restore-yes");})[0];
        confirmRestoreId=null;
        if(!bk){ showErrorBanner(function(){ render(); }); return; }
        try{
          var parsed=JSON.parse(bk.payload); var d=parsed && parsed.data? parsed.data : parsed;
          if(!d || !Array.isArray(d.occs)) throw new Error("bad");
          pushUndo("khôi phục từ bản sao lưu");
          state=migrateData(d); saveNow(); materialize(); closeDrawer(); render();
          toast("Đã khôi phục dữ liệu từ bản sao lưu "+fmtDTFull(bk.ts)+".");
        }catch(e){ logError("restoreBackup", e && e.message); showErrorBanner(function(){ render(); }); }
      }); });
      var eo=$("#exp-open"); if(eo) eo.addEventListener("click", function(){ exportOpen=true; render(); });
      var ec=$("#exp-close"); if(ec) ec.addEventListener("click", function(){ exportOpen=false; render(); });
      var io=$("#imp-open"); if(io) io.addEventListener("click", function(){ importOpen=true; render(); });
      var ic=$("#imp-close"); if(ic) ic.addEventListener("click", function(){ importOpen=false; render(); });
      var dj=$("#dl-json"); if(dj) dj.addEventListener("click", exportJSON);
      var dc=$("#dl-csv"); if(dc) dc.addEventListener("click", exportCSV);
      var uj=$("#up-json"); if(uj) uj.addEventListener("change", function(e){ if(e.target.files && e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
      var ac=$("#auth-change"); if(ac) ac.addEventListener("click", changeCodeFlow);
      var ao=$("#auth-off"); if(ao) ao.addEventListener("click", function(){ openConfirm("Tắt khoá truy cập?", "Ai mở được trình duyệt này cũng vào được app mà không cần mã. Mã đã đặt vẫn được giữ để bạn bật lại sau.", "Tắt khoá", function(){ state.requireLock=false; save(); render(); toast("Đã tắt khoá. Vẫn nên giữ mã để bật lại khi cần."); }); });
      var an=$("#auth-on"); if(an) an.addEventListener("click", function(){ state.requireLock=true; save(); render(); toast("Đã bật khoá lại."); });
      var as=$("#auth-setup"); if(as) as.addEventListener("click", function(){ showGate("setup"); });
      var al=$("#auth-locknow"); if(al) al.addEventListener("click", lockNow);
      $("#wipe-all").addEventListener("click", function(){
        openConfirm("Xoá toàn bộ dữ liệu?", "Toàn bộ việc, chuỗi, ghi chú, lịch sử, dự án, tag và mã truy cập trong trình duyệt này sẽ bị xoá vĩnh viễn.", "Tiếp tục", function(){
          openConfirm("Chắc chắn xoá hết?", "Không có máy chủ sao lưu — xoá là mất hẳn. Hãy xuất JSON trước nếu còn cần dữ liệu.", "Xoá tất cả", function(){
            localStorage.removeItem(LS_DATA); localStorage.removeItem(LS_AUTH); localStorage.removeItem(LS_BACKUPS); sessionStorage.removeItem(SS_UNLOCK);
            state=defaultState(); undoStack=[]; showGate("setup"); toast("Đã xoá toàn bộ. Hãy đặt mã mới.");
          });
        });
      });
    }
    function download(name, text, type){
      var blob=new Blob([text], {type:type||"application/octet-stream"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    }
    function exportJSON(){
      download("task-manager.json", JSON.stringify({app:"task-manager", format:"checklist-v2", version:3, exportedAt:new Date().toISOString(), data:state}, null, 2), "application/json");
      toast("Đã xuất bản sao lưu JSON (task-manager.json).");
    }
    function exportCSV(){
      var rows=[["Tiêu đề","Ngày","Giờ","Trạng thái","Tiến độ %","Số đếm","Ưu tiên","Dự án","Tag","Ghi chú","Chuỗi lặp"]];
      liveOccs().slice().sort(function(a,b){return (a.dueDate||"")<(b.dueDate||"")?-1:1;}).forEach(function(o){
        var p=o.projectId? projectById(o.projectId): null; var s=o.seriesId? seriesById(o.seriesId): null;
        rows.push([o.title, o.dueDate||"", o.dueTime||"", STATUS_LABEL[o.status]||o.status, o.progress||0, o.count||0, o.priority||"vua", p?p.name:"", (o.tags||[]).map(function(t){var tg=tagById(t); return tg?tg.name:"";}).filter(Boolean).join("; "), (o.note||"").replace(/\n/g," "), s? rruleLabel(s.rrule):""]);
      });
      var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\r\n");
      download("task-manager-occurrences.csv", "﻿"+csv, "text/csv");
      toast("Đã xuất CSV.");
    }
    function importJSON(file){
      var rd=new FileReader();
      rd.onload=function(){
        try{
          var parsed=JSON.parse(rd.result);
          var d=parsed && parsed.data ? parsed.data : parsed;
          if(!d || !Array.isArray(d.occs) || !Array.isArray(d.series)) throw new Error("bad");
          openConfirm("Nhập dữ liệu từ file?", "Dữ liệu hiện tại ("+state.occs.length+" lần làm, "+state.series.length+" chuỗi) sẽ bị THAY THẾ bằng dữ liệu trong file ("+d.occs.length+" lần làm, "+d.series.length+" chuỗi).", "Nhập & thay thế", function(){
            pushUndo("nhập dữ liệu JSON");
            state=migrateData(d);
            materialize(); saveNow(); closeDrawer(); render(); toast("Đã nhập dữ liệu thành công.");
          });
        }catch(e){ logError("importJSON", e && e.message); toast("File không đúng định dạng sao lưu của app. Hãy chọn file JSON đã xuất từ app này."); }
      };
      rd.readAsText(file);
    }
    function changeCodeFlow(){
      var auth=loadAuth(); if(!auth) return;
      openCodeForm("Đổi mã truy cập", ["Mã hiện tại","Mã mới (ít nhất 4 ký tự)","Nhập lại mã mới"], function(vals){
        return hashCode(vals[0], auth.salt).then(function(h){
          if(h!==auth.hash) return "Mã hiện tại chưa đúng.";
          if(vals[1].length<4) return "Mã mới cần ít nhất 4 ký tự.";
          if(vals[1]!==vals[2]) return "Hai lần nhập mã mới chưa khớp.";
          var salt=makeSalt();
          return hashCode(vals[1], salt).then(function(h2){ saveAuth({salt:salt, hash:h2}); state.requireLock=true; save(); closeModal(); render(); toast("Đã đổi mã truy cập."); return null; });
        });
      });
    }
</script>

    <script>
    "use strict";
    /* ================= HỘP THOẠI DÙNG CHUNG ================= */
    function openModal(html, wide){ var w=$("#modalwrap"); w.innerHTML='<div class="modal'+(wide?" wide":"")+'">'+html+'</div>'; w.classList.add("on"); }
    function closeModal(){ var w=$("#modalwrap"); w.classList.remove("on"); w.innerHTML=""; }
    $("#modalwrap").addEventListener("click", function(e){ if(e.target===this) closeModal(); });
    function openConfirm(title, body, okLabel, onOk){
      openModal('<h3>'+esc(title)+'</h3><p style="color:var(--ink2)">'+esc(body)+'</p><div class="foot"><button class="btn" id="cf-no">Huỷ</button><button class="btn danger" id="cf-ok">'+esc(okLabel)+'</button></div>');
      $("#cf-no").addEventListener("click", closeModal);
      $("#cf-ok").addEventListener("click", function(){ closeModal(); onOk(); });
    }
    function openTextPrompt(title, label, initial, onOk){
      openModal('<h3>'+esc(title)+'</h3><div class="f-field"><label>'+esc(label)+'</label><input id="tp-in" type="text" value="'+esc(initial||"")+'" /></div><div class="foot"><button class="btn" id="tp-no">Huỷ</button><button class="btn primary" id="tp-ok">Lưu</button></div>');
      $("#tp-no").addEventListener("click", closeModal);
      $("#tp-ok").addEventListener("click", function(){ var v=$("#tp-in").value.trim(); closeModal(); onOk(v); });
      setTimeout(function(){ var i=$("#tp-in"); if(i) i.focus(); }, 30);
    }
    function openCodeForm(title, labels, onSubmit){
      openModal('<h3>'+esc(title)+'</h3><form id="codeform">'
        + labels.map(function(l,i){ return '<div class="f-field"><label>'+esc(l)+'</label><input type="password" data-ci="'+i+'" autocomplete="off" /></div>'; }).join("")
        + '<div class="gate-err" id="codeerr"></div><div class="foot"><button class="btn" type="button" id="cf2-no">Huỷ</button><button class="btn primary" type="submit">Xác nhận</button></div></form>');
      $("#cf2-no").addEventListener("click", closeModal);
      $("#codeform").addEventListener("submit", function(ev){
        ev.preventDefault();
        var vals=labels.map(function(_,i){ return $('input[data-ci="'+i+'"]').value; });
        Promise.resolve(onSubmit(vals)).then(function(err){
          if(err){ var e=$("#codeerr"); e.textContent=err; e.classList.add("show"); }
        });
      });
    }
    function openScopePicker(title, body, options, onPick){
      openModal('<h3>'+esc(title)+'</h3><p style="color:var(--ink2)">'+esc(body)+'</p>'
        + options.map(function(op,i){ return '<button class="btn block" style="margin-top:8px;justify-content:flex-start" data-scope="'+i+'">'+esc(op.label)+'</button>'; }).join("")
        + '<div class="foot"><button class="btn ghost" id="sc-no">Huỷ</button></div>');
      $("#sc-no").addEventListener("click", closeModal);
      $$("[data-scope]").forEach(function(b){ b.addEventListener("click", function(){ var v=options[+b.getAttribute("data-scope")].value; closeModal(); onPick(v); }); });
    }
    function toast(msg){
      var t=document.createElement("div"); t.className="toast";
      var lbl=undoLabel();
      t.innerHTML='<span style="flex:1">'+esc(msg)+'</span>'+(lbl? '<button type="button">'+esc(lbl)+'</button>' : '');
      var b=t.querySelector("button");
      if(b) b.addEventListener("click", function(){ doUndo(); t.remove(); });
      $("#toasts").appendChild(t);
      setTimeout(function(){ t.remove(); }, 5600);
    }

    /* ================= NHẬP NHANH (NLP tối thiểu) ================= */
    function findOrCreateTag(name){
      var n=name.trim().toLowerCase(); if(!n) return null;
      var t=state.tags.filter(function(x){return x.name.toLowerCase()===n;})[0];
      if(!t){ t={id:uid(), name:name.trim(), color:PALETTE[state.tags.length%PALETTE.length]}; state.tags.push(t); }
      return t.id;
    }
    function parseQuick(text){
      var title=text.trim(), tagIds=[], priority=null, rrule=null, toTomorrow=false;
      title=title.replace(/#([^\s#]+)/g, function(m, name){ var id=findOrCreateTag(name); if(id) tagIds.push(id); return ""; });
      title=title.replace(/!(gấp|gap|cao|vừa|thấp|thap)\b/gi, function(m, p){ var k=p.toLowerCase(); priority=(k==="gấp"||k==="gap")?"gap":(k==="cao"?"cao":(k==="vừa"?"vua":"thap")); return ""; });
      if(/ngày mai|ngay mai/.test(title.toLowerCase())){ toTomorrow=true; title=title.replace(/ngày mai|ngay mai/gi,""); }
      var low=" "+title.toLowerCase()+" ";
      var wdMap={"chủ nhật":0,"chu nhat":0,"thứ 2":1,"thu 2":1,"thứ 3":2,"thu 3":2,"thứ 4":3,"thu 4":3,"thứ 5":4,"thu 5":4,"thứ 6":5,"thu 6":5,"thứ 7":6,"thu 7":6};
      var m2=low.match(/mỗi\s+(\d+)\s*(ngày|tuần|tuan|tháng|thang)/);
      var mWeekday=low.match(/mỗi\s+(chủ nhật|chu nhat|thứ\s*[2-7]|thu\s*[2-7])/);
      if(m2){
        var n=+m2[1], unit=m2[2];
        if(unit==="ngày") rrule={freq:"daily", interval:n};
        else if(unit==="tuần"||unit==="tuan") rrule={freq:"weekly", interval:n, weekdays:[parseD(todayStr()).getDay()]};
        else rrule={freq:"monthly", interval:n, monthMode:"day", monthDay:parseD(todayStr()).getDate()};
        title=title.replace(/mỗi\s+\d+\s*(ngày|tuần|tháng)\s*/i,"");
      } else if(mWeekday){
        var key=mWeekday[1].replace(/\s+/g," ").trim(); var wd=wdMap[key]!=null? wdMap[key] : wdMap[mWeekday[1]];
        if(wd!=null){ rrule={freq:"weekly", interval:1, weekdays:[wd]}; title=title.replace(/mỗi\s+(chủ nhật|thứ\s*[2-7])\s*/i,""); }
      } else if(/mỗi ngày làm việc|ngày làm việc/.test(low)){ rrule={freq:"workday", interval:1}; title=title.replace(/(mỗi\s+)?ngày làm việc\s*/i,""); }
      else if(/mỗi ngày|hằng ngày|hang ngay/.test(low)){ rrule={freq:"daily", interval:1}; title=title.replace(/(mỗi ngày|hằng ngày)\s*/i,""); }
      else if(/mỗi tuần|hằng tuần/.test(low)){ rrule={freq:"weekly", interval:1, weekdays:[parseD(todayStr()).getDay()]}; title=title.replace(/(mỗi tuần|hằng tuần)\s*/i,""); }
      else if(/mỗi tháng|hằng tháng/.test(low)){ rrule={freq:"monthly", interval:1, monthMode:"day", monthDay:parseD(todayStr()).getDate()}; title=title.replace(/(mỗi tháng|hằng tháng)\s*/i,""); }
      var timeM=title.match(/\b(\d{1,2})[:h](\d{2})?\b/);
      var dueTime=""; if(timeM){ dueTime=pad2(Math.min(23,+timeM[1]))+":"+(timeM[2]||"00"); title=title.replace(timeM[0],""); }
      title=title.replace(/\s+/g," ").trim();
      return { title:title||text.trim(), tagIds:tagIds, priority:priority||"vua", rrule:rrule, dueTime:dueTime, date: toTomorrow? addDays(todayStr(),1) : todayStr() };
    }
    function quickAdd(text){
      pushUndo("thêm việc nhanh");
      var p=parseQuick(text);
      var start=p.date;
      if(p.rrule && p.rrule.freq==="weekly" && p.rrule.weekdays && p.rrule.weekdays.length){
        var d=parseD(start); while(d.getDay()!==p.rrule.weekdays[0]) d.setDate(d.getDate()+1); start=dstr(d);
      }
      if(p.rrule){
        var s={ id:uid(), title:p.title, desc:"", projectId:null, priority:p.priority, estimateMin:0, dueTime:p.dueTime,
          tags:p.tagIds, steps:[], rrule:p.rrule, start:start, endType:"never", endDate:"", endCount:0, active:true, deletedAt:null, createdAt:Date.now(), remindOffset:-1, skipDates:[], kind:"task", color:null, targetValue:null, targetUnit:"", quitStartedAt:null, relapses:[], generateAheadDays:7 };
        state.series.push(s); materialize();
        var first=state.occs.filter(function(o){return o.seriesId===s.id && o.dueDate===start;})[0];
        if(first) logAct(first,"create","Tạo chuỗi lặp từ nhập nhanh: "+rruleLabel(p.rrule));
        toast("Đã tạo chuỗi lặp “"+p.title+"” ("+rruleLabel(p.rrule)+").");
      } else {
        var o={ id:uid(), seriesId:null, title:p.title, desc:"", projectId:null, priority:p.priority, estimateMin:0, dueDate:p.date, dueTime:p.dueTime,
          status:"todo", progress:0, count:0, note:"", tags:p.tagIds, steps:[], sessions:[], reminders:[], remindOffset:-1, remindFired:false, snoozeUntil:0, detached:false, deletedAt:null, createdAt:Date.now(), sourceNoteId:null, sourceLineIndex:null };
        state.occs.push(o); logAct(o,"create","Tạo việc từ nhập nhanh");
        toast("Đã thêm “"+p.title+"”. Bấm vào việc để bổ sung chi tiết.");
      }
      save(); if(UI.view==="today") UI.viewDate=p.date; render();
    }
    function addRoutinePreset(key){
      var p=ROUTINE_PRESETS.filter(function(x){return x.key===key;})[0]; if(!p || presetAdded(p)) return;
      pushUndo("thêm gợi ý healthy “"+p.title+"”");
      var s={ id:uid(), title:p.title, desc:p.note, projectId:null, priority:"vua", estimateMin:p.estimateMin||0, dueTime:p.dueTime||"",
        tags:[], steps:[], rrule:{freq:"daily", interval:1}, start:todayStr(), endType:"never", endDate:"", endCount:0, active:true,
        deletedAt:null, createdAt:Date.now(), remindOffset:-1, skipDates:[], kind:"task", color:null,
        targetValue:p.targetValue, targetUnit:p.targetUnit||"", quitStartedAt:null, relapses:[], generateAheadDays:7 };
      state.series.push(s); materialize(); save();
      toast("Đã thêm gợi ý “"+p.title+"” thành việc lặp hằng ngày.");
    }
</script>

    <script>
    "use strict";
    /* ================= BỘ CHỌN LỊCH LẶP (v2.9 — ô tóm tắt duy nhất) ================= */
    function weekdayChecks(sel){
      var order=[1,2,3,4,5,6,0], names=["CN","T2","T3","T4","T5","T6","T7"];
      return order.map(function(i){ return '<button type="button" class="chip'+((sel||[]).indexOf(i)>=0?" sel":"")+'" data-wd="'+i+'" aria-label="Thứ '+names[i]+'">'+names[i]+'</button>'; }).join("");
    }
    function colorSwatchesHTML(current){
      return '<div class="swatches"><button type="button" class="swatch auto'+(!current?" sel":"")+'" data-color="">Tự động</button>'
        + SERIES_PALETTE.map(function(c){ return '<button type="button" class="swatch'+(current===c?" sel":"")+'" data-color="'+c+'" style="background:'+c+'" aria-label="Chọn màu '+c+'"></button>'; }).join("") + '</div>';
    }
    function wireSwatches(root, get, set){
      $$("[data-color]", root).forEach(function(b){ b.addEventListener("click", function(){ set(b.getAttribute("data-color")||null); $$("[data-color]", root).forEach(function(x){ x.classList.toggle("sel", x===b); }); }); });
    }
    /* Trạng thái lịch lặp trong form: dùng rrule nội bộ {freq, interval, weekdays, monthMode, monthDay, monthNth, monthWeekday} hoặc null */
    function makeRecEditor(container, initial, startDateStr, onChange){
      var rec = initial? deepClone(initial) : null;
      var open=false, custom=!!initial;
      function summary(){ return rec? rruleLabel(rec) : "Không lặp"; }
      function draw(){
        var h='<button type="button" class="rec-cell" id="rec-cell" aria-expanded="'+open+'"><span>'+esc(summary())+'</span><span class="chev'+(open?" open":"")+'">'+ICONS.chev+'</span></button>';
        if(open){
          h+='<div class="rec-panel">'
            + '<div class="kind-grid" style="margin-bottom:12px"><label class="kind-opt'+(!custom?" sel":"")+'"><input type="radio" name="recmode" id="rec-none" /> Không lặp</label><label class="kind-opt'+(custom?" sel":"")+'"><input type="radio" name="recmode" id="rec-custom" /> Tuỳ chỉnh</label></div>';
          if(custom){
            var kinds=[["daily","Theo ngày"],["workday","Ngày làm việc"],["weekly","Theo tuần"],["monthlyDay","Tháng · theo ngày"],["monthlyNth","Tháng · theo thứ"]];
            var curKind = !rec? "daily" : (rec.freq==="monthly"? (rec.monthMode==="nth"? "monthlyNth" : "monthlyDay") : rec.freq);
            h+='<div class="chipsel" id="rec-kinds" style="margin-bottom:12px">'+kinds.map(function(k){ return '<button type="button" class="chip'+(curKind===k[0]?" sel":"")+'" data-rk="'+k[0]+'">'+k[1]+'</button>'; }).join("")+'</div>'
              + '<div class="f-2"><div class="f-field"><label>Mỗi (số chu kỳ)</label><input id="rec-iv" type="number" min="1" max="52" value="'+(rec? (rec.interval||1) : 1)+'" /></div>'
              + (curKind==="weekly"? '<div class="f-field"><label>Vào các thứ</label><div class="chipsel" id="rec-wds">'+weekdayChecks(rec&&rec.weekdays? rec.weekdays : [parseD(startDateStr||todayStr()).getDay()])+'</div></div>' : '')
              + (curKind==="monthlyDay"? '<div class="f-field"><label>Ngày của tháng</label><input id="rec-mday" type="number" min="1" max="31" value="'+(rec? (rec.monthDay||1) : parseD(startDateStr||todayStr()).getDate())+'" /></div>' : '')
              + (curKind==="monthlyNth"? '<div class="f-field"><label>Thứ trong tháng</label><select id="rec-mwd">'+[1,2,3,4,5,6,0].map(function(w){ var nm=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"]; return '<option value="'+w+'"'+(rec&&rec.monthWeekday===w?" selected":"")+'>'+nm[w]+'</option>'; }).join("")+'</select></div><div class="f-field"><label>Lần thứ</label><select id="rec-mnth">'+[1,2,3,4,5].map(function(nn){ return '<option value="'+nn+'"'+(rec&&rec.monthNth===nn?" selected":"")+'>'+(nn===5? "Cuối" : nn)+'</option>'; }).join("")+'</select></div>' : '')
              + '</div>';
          }
          h+='<div style="text-align:right"><button type="button" class="btn small primary" id="rec-done">Xong — '+esc(summary())+'</button></div></div>';
        }
        container.innerHTML=h;
        var cell=$("#rec-cell", container);
        cell.addEventListener("click", function(){ open=!open; draw(); });
        if(onChange) onChange();
        if(!open) return;
        var rn=$("#rec-none", container), rc=$("#rec-custom", container);
        if(rn) rn.addEventListener("change", function(){ custom=false; rec=null; open=false; draw(); });
        if(rc) rc.addEventListener("change", function(){ custom=true; if(!rec) rec={freq:"daily", interval:1}; draw(); });
        $$("#rec-kinds .chip", container).forEach(function(ch){ ch.addEventListener("click", function(){
          var k=ch.getAttribute("data-rk");
          var iv=rec? (rec.interval||1) : 1;
          if(k==="daily") rec={freq:"daily", interval:iv};
          else if(k==="workday") rec={freq:"workday", interval:1};
          else if(k==="weekly") rec={freq:"weekly", interval:iv, weekdays:(rec&&rec.weekdays&&rec.weekdays.length)? rec.weekdays : [parseD(startDateStr||todayStr()).getDay()]};
          else if(k==="monthlyDay") rec={freq:"monthly", interval:iv, monthMode:"day", monthDay:(rec&&rec.monthDay)||parseD(startDateStr||todayStr()).getDate()};
          else rec={freq:"monthly", interval:iv, monthMode:"nth", monthNth:(rec&&rec.monthNth)||1, monthWeekday:(rec&&rec.monthWeekday!=null)? rec.monthWeekday : parseD(startDateStr||todayStr()).getDay()};
          draw();

      var o=editingOcc, s=o.seriesId? seriesById(o.seriesId) : null;
      var applyToOcc=function(target){
        target.title=data.title; target.desc=data.desc; target.projectId=data.projectId; target.priority=data.priority;
        target.estimateMin=data.estimateMin; target.dueTime=data.dueTime; target.tags=data.tags.slice();

        o.detached=true; applyToOcc(o);
        if(data.date && data.date!==o.dueDate){ s.skipDates=s.skipDates||[]; if(s.skipDates.indexOf(o.dueDate)<0) s.skipDates.push(o.dueDate); o.dueDate=data.date; }

        applySeriesFields(s, data); s.steps=keepSteps;

      } else {
        var oldEnd={endType:s.endType, endDate:s.endDate, endCount:s.endCount};

        var ns2={ id:uid(), title:s.title, desc:s.desc, projectId:s.projectId, priority:s.priority, estimateMin:s.estimateMin, dueTime:s.dueTime, tags:(s.tags||[]).slice(), steps:(s.steps||[]).slice(), rrule: deepClone(s.rrule), start:o.dueDate, endType:oldEnd.endType, endDate:oldEnd.endDate, endCount:oldEnd.endCount, active:true, deletedAt:null, createdAt:Date.now(), remindOffset:s.remindOffset, skipDates:[], kind:"task", color:s.color||null, targetValue:s.targetValue, targetUnit:s.targetUnit||"", quitStartedAt:null, relapses:[], generateAheadDays:s.generateAheadDays!=null? s.generateAheadDays : 7 };
        applySeriesFields(ns2, data); if(data.date && data.date!==o.dueDate) ns2.start=data.date;

        logAct(o,"edit","Sửa từ lần này trở đi (tách chuỗi)");

    }

      });
      var dn2=$("#dr-del-no"); if(dn2) dn2.addEventListener("click", function(){ drawerState.confirmDelete=false; openDrawer(o.id, true); });
      var dy=$("#dr-del-yes"); if(dy) dy.addEventListener("click", function(){ pushUndo("xoá việc “"+o.title+"”"); o.deletedAt=Date.now(); logAct(o,"delete","Xoá việc (vào thùng rác)"); save(); closeDrawer(); render(); });
      if(s && drawerState.deleteExpanded) drawDeleteZone(o, s);
      startTick();
    }
    function drawDeleteZone(o, s){
      var host=$("#dr-delzone"); if(!host) return;
      var scope="this";
      host.innerHTML='<div class="f-field"><label>Phạm vi xoá</label><div class="scope-list">'
        + [["this","Chỉ lần này","Chỉ xoá lần làm đang chọn."],["following","Từ lần này trở đi","Xoá lần này và mọi lần sau; các lần trước giữ nguyên."],["all","Cả chuỗi","Xoá toàn bộ chuỗi việc lặp."]].map(function(op){
            return '<label class="scope-opt'+(scope===op[0]?" sel":"")+'"><input type="radio" name="delscope" value="'+op[0]+'"'+(scope===op[0]?" checked":"")+' /><span><b>'+op[1]+'</b><small>'+op[2]+'</small></span></label>';
          }).join("") + '</div></div>'
        + '<div class="drawer-btn-grid"><button class="btn danger" id="dz-del" type="button">Chuyển vào thùng rác</button><button class="btn" id="dz-cancel" type="button">Huỷ</button></div>'
        + '<div id="dz-confirm"></div>';
      $$('input[name="delscope"]', host).forEach(function(r){ r.addEventListener("change", function(){ scope=r.value; $$('input[name="delscope"]', host).forEach(function(x){ x.closest(".scope-opt").classList.toggle("sel", x.checked); }); }); });
      $("#dz-cancel").addEventListener("click", function(){ drawerState.deleteExpanded=false; openDrawer(o.id, true); });
      $("#dz-del").addEventListener("click", function(){
        var c=$("#dz-confirm");
        c.innerHTML='<span class="inline-confirm" style="margin-top:10px"><span>Xoá theo phạm vi đã chọn?</span><button class="btn small" id="dz-no" type="button">Giữ lại</button><button class="btn small danger" id="dz-yes" type="button">Xoá</button></span>';
        $("#dz-no").addEventListener("click", function(){ drawerState.deleteExpanded=false; openDrawer(o.id, true); });
        $("#dz-yes").addEventListener("click", function(){
          pushUndo("xoá việc trong chuỗi “"+o.title+"”");
          if(scope==="this"){ o.deletedAt=Date.now(); logAct(o,"delete","Xoá chỉ lần này"); }
          else if(scope==="following"){ s.endType="date"; s.endDate=addDays(o.dueDate,-1); state.occs.forEach(function(x){ if(x.seriesId===s.id && !x.deletedAt && x.dueDate>=o.dueDate) x.deletedAt=Date.now(); }); logAct(o,"delete","Xoá từ lần này trở đi"); }
          else { s.deletedAt=Date.now(); state.occs.forEach(function(x){ if(x.seriesId===s.id) x.deletedAt=Date.now(); }); logAct(o,"delete","Xoá cả chuỗi"); }
          drawerState.deleteExpanded=false;
          save(); closeDrawer(); render(); toast("Đã chuyển vào thùng rác. Khôi phục ở màn Thùng Rác.");
        });
      });
    }
    function closeDrawer(){ UI.drawerOcc=null; var d=$("#drawer"); if(d) d.classList.remove("on"); var sc=$("#scrim"); if(sc) sc.classList.remove("on"); }
    $("#scrim").addEventListener("click", closeDrawer);
    function tickClocks(){
      var now=Date.now();
      $$("[data-quit-clock]").forEach(function(el){
        var s=seriesById(el.getAttribute("data-quit-clock")); if(!s) return;
        var startedAt=s.quitStartedAt||s.createdAt||now;
        el.textContent=fmtQuitElapsed(Math.max(0, Math.floor((now-startedAt)/1000)));
      });
      $$("[data-quit-longest]").forEach(function(el){
        var startedAt=+el.getAttribute("data-started"), longest=+el.getAttribute("data-longest");
        var elapsed=Math.max(0, Math.floor((now-startedAt)/1000));
        el.textContent=fmtSec(Math.max(longest, elapsed));
      });
      $$("[data-tick]").forEach(function(el){
        var o=occById(el.getAttribute("data-tick")); if(!o) return;
        var run=liveSession(o);
        if(run) el.textContent=(run.pausedAt? "đang tạm dừng · " : "đang đếm ") + fmtClock(sessionElapsed(run, now)) + (run.mode==="down"&&run.targetSec? " / "+fmtSec(run.targetSec) : "");
      });
      $$("[data-timer-live]").forEach(function(el){
        var o=occById(el.getAttribute("data-timer-live")); if(!o) return;
        var run=liveSession(o); if(!run) return;
        var el2=sessionElapsed(run, now);
        el.textContent = run.mode==="down"&&run.targetSec? fmtClock(Math.max(0, run.targetSec-el2))+" / "+fmtSec(run.targetSec) : fmtClock(el2);
      });
    }
    function checkCountdowns(){
      var now=Date.now(), changed=false;
      liveOccs().forEach(function(o){
        var run=liveSession(o);
        if(run && run.mode==="down" && run.targetSec && !run.pausedAt){
          if(sessionElapsed(run, now) >= run.targetSec){
            stopSession(o, run, true); changed=true;
            beep(); notifyFire("Hết giờ đếm ngược", o.title);
            toast("Đếm ngược đã về 0: “"+o.title+"” — phiên được chốt đúng "+fmtSec(run.targetSec)+".");
          }
        }
      });
      if(changed){ save(); render(); if(UI.drawerOcc) openDrawer(UI.drawerOcc, true); }
    }
    function startTick(){
      if(UI.timerTick) return;
      UI.timerTick=setInterval(function(){ tickClocks(); checkCountdowns(); }, 1000);
    }
</script>

    <script>
    "use strict";
    /* ================= HỘP THOẠI PHIÊN BẢN (v2.1 + v2.11) ================= */
    function changelogGroupsHTML(entry){
      var order=["feature","improvement","fix"];
      return order.filter(function(t){ return entry.changes.some(function(c){return c.type===t;}); }).map(function(t){
        return '<div style="margin-top:8px"><span class="chg '+t+'">'+CHG_LABEL[t]+'</span><ul class="ver-changes">'
          + entry.changes.filter(function(c){return c.type===t;}).map(function(c){ return '<li><span class="chg '+t+'">'+CHG_LABEL[t]+'</span><span>'+esc(c.text)+'</span></li>'; }).join("")
          + '</ul></div>';
      }).join("");
    }
    function openVersionDialog(){
      var unseen=unseenEntries();
      var whatsNew = unseen.length? unseen : [CHANGELOG[0]];
      var hlRows=[];
      whatsNew.forEach(function(e){ e.changes.forEach(function(c){ hlRows.push({version:e.version, type:c.type, text:c.text}); }); });
      var html='<h3><span class="micro">PHIÊN BẢN ỨNG DỤNG</span>Phiên bản v'+APP_VERSION+'</h3>'
        + '<p class="hint" style="margin-top:-8px">Phát hành '+fmtVersionDate(APP_VERSION_DATE)+'</p>'
        + '<div class="dsec" style="margin-top:14px"><h4>Có gì mới?</h4>'
        + (whatsNew.length===1? '<p style="font-weight:700;margin:0 0 4px">'+esc(whatsNew[0].title)+'</p>' : whatsNew.map(function(e){ return '<p style="font-weight:700;margin:0 0 4px">v'+e.version+' — '+esc(e.title)+'</p>'; }).join(""))
        + '<ul class="whatsnew-hl">'+hlRows.map(function(r){ return '<li><span class="chg '+r.type+'">'+CHG_LABEL[r.type]+'</span><span>'+esc(r.text)+'</span></li>'; }).join("")+'</ul></div>'
        + '<div class="dsec"><h4>Lịch sử phiên bản</h4>'
        + '<p class="hint" style="margin-top:0">Đây là lịch sử các phiên bản của chính ứng dụng Task Manager — khác với “Lịch sử cập nhật” trong chi tiết từng việc, vốn ghi lại thay đổi của lần làm đó.</p>'
        + '<ol class="ver-timeline">'
        + CHANGELOG.map(function(e){
            var cur=e.version===APP_VERSION;
            return '<li class="ver-item'+(cur?" cur":"")+'"><article class="ver-card"><div class="ver-head"><span class="ver-badge">v'+e.version+'</span><h4>'+esc(e.title)+'</h4><span style="text-align:right"><span class="vd">'+fmtVersionDate(e.date)+'</span>'+(cur? '<br /><span class="cur-badge">Đang dùng</span>' : '')+'</span></div>'
              + changelogGroupsHTML(e) + '</article></li>';
          }).join("")
        + '</ol></div>'
        + '<div class="foot"><button class="btn primary" id="ver-ok" type="button" style="flex:1">Đã hiểu</button></div>';
      openModal(html, true);
      $("#ver-ok").addEventListener("click", function(){
        meta.lastSeenVersion=APP_VERSION; saveMeta(); closeModal(); renderShell();
      });
    }

    /* ================= HƯỚNG DẪN SỬ DỤNG (v2.5) ================= */
    function openHelp(){
      var secs=[
        ["Bắt đầu nhanh", '<p>Ô nhập nhanh ở đầu mọi màn hình là cách tạo việc nhanh nhất: gõ tên việc rồi bấm <strong>Thêm</strong>. Ngay trong câu chữ, bạn có thể gắn lịch và mức ưu tiên:</p><ul><li><strong>#tag</strong> — gắn tag, ví dụ <strong>#vận-hành</strong>.</li><li><strong>!cao</strong>, <strong>!gấp</strong>, <strong>!thấp</strong> — đặt mức ưu tiên.</li><li><strong>mỗi ngày</strong>, <strong>mỗi thứ 6</strong>, <strong>mỗi 2 tuần</strong>, <strong>hằng tháng</strong>, <strong>ngày làm việc</strong> — đặt lịch lặp.</li><li><strong>9h30</strong> — đặt giờ hẹn; <strong>ngày mai</strong> — dời sang ngày mai.</li></ul><p>Cần đặt chi tiết hơn (dự án, các bước, ngày kết thúc, mục tiêu đo được…)? Bấm nút <strong>Tạo việc</strong> ghim ở cạnh dưới màn hình (trên điện thoại nằm ngay trong thanh điều hướng dưới) để mở hộp thoại “Công việc mới”. Ô nhập nhanh phía trên cũng được ghim cố định khi cuộn. Bấm vào bất kỳ việc nào để mở ngăn chi tiết: đổi trạng thái, ghi chú, các bước, đếm giờ, nhắc việc và xem lịch sử cập nhật đều nằm ở đó.</p><p>Trong hộp thoại “Công việc mới” có nhóm thu gọn <strong>“Gợi ý healthy mỗi ngày”</strong>: 12 thói quen sinh hoạt tốt (uống nước ấm khi thức dậy, vận động buổi sáng, uống đủ nước 8 cốc, đi ngủ trước 23:00…) — mở nhóm và bấm <strong>Thêm</strong> ở mục bạn thích là có ngay việc lặp hằng ngày theo giờ gợi ý; mục đã thêm hiện “Đã thêm” và không thêm trùng.</p>'],
        ["Việc lặp, 3 trạng thái và % tiến độ", '<p>Mỗi việc lặp gồm một <strong>chuỗi</strong> (quy tắc chung: tên, lịch lặp) và nhiều <strong>lần làm</strong> — mỗi ngày đến hạn là một lần làm riêng, có trạng thái, ghi chú và lịch sử riêng. Ba trạng thái chính: <strong>Chưa làm</strong>, <strong>Đang làm</strong>, <strong>Hoàn thành</strong> (thêm <strong>Bỏ qua</strong> khi lần này không làm).</p><p>Khi Đang làm, bạn kéo thanh trượt để ghi % tiến độ — <strong>tối đa 99%</strong>. Con số 100% được dành riêng cho trạng thái Hoàn thành: chỉ khi bấm <strong>Hoàn thành</strong>, lần làm mới được tính là xong hẳn (streak, thống kê và báo cáo đều chỉ đếm lần Hoàn thành). Cách này giúp % luôn trung thực: 99% nghĩa là “gần xong nhưng chưa xong”, không bao giờ nhập nhằng với việc đã hoàn tất.</p><p>Khi sửa hoặc xoá một việc lặp, app hỏi <strong>phạm vi</strong>: chỉ lần này, từ lần này trở đi (tách thành chuỗi mới, phần trước giữ nguyên), hoặc cả chuỗi. Hoãn một lần làm sẽ tách lần đó thành việc độc lập ở ngày mới, nên lịch lặp không bị xô lệch.</p>'],
        ["Ghi chú & nhật ký ngày", '<p>Màn <strong>Ghi Chú</strong> chứa các ghi chú độc lập: ghim lên đầu, gắn tag, gắn dự án, hoặc gắn vào một chuỗi việc để làm “tài liệu quy trình” (mở lần làm nào của chuỗi cũng thấy ghi chú đó trong ngăn chi tiết). Nội dung <strong>tự lưu khi gõ</strong>, không cần bấm lưu.</p><ul><li>Dòng dạng <strong>- [ ] việc cần làm</strong> trở thành mục tick được ngay trong trình soạn.</li><li>Mỗi dòng có nút <strong>Thành việc</strong>: tạo một việc đến hạn hôm nay từ chính dòng đó, hai bên giữ liên kết để nhảy qua lại.</li><li>Tab <strong>Nhật ký ngày</strong>: mỗi ngày một trang, app tự tổng hợp việc đã hoàn thành, việc quá hạn và ghi chú từng lần làm của ngày đó; phần viết tự do ở dưới cũng tự lưu.</li></ul>'],
        ["Thói quen đo được & thói quen cai", '<p><strong>Thói quen đo được:</strong> khi tạo/sửa chuỗi, đặt một con số mục tiêu + đơn vị cho mỗi lần làm (8 cốc nước, 10.000 bước, 30 phút đọc sách). Trên dòng việc hiện bộ đếm <strong>+ / −</strong> riêng cho từng ngày: đạt mục tiêu là lần làm <strong>tự Hoàn thành 100%</strong>; trừ xuống dưới mục tiêu thì tự quay lại Đang làm với % tính lại theo số đếm. Màn Thống Kê có báo cáo từng thói quen dạng lưới chấm theo Tuần / Tháng / Năm.</p><p><strong>Thói quen cai:</strong> loại chuỗi đặc biệt không sinh lần làm — chỉ có đồng hồ đếm thời gian đã cai chạy từng giây, kỷ lục đợt dài nhất và lịch sử tái phạm ở màn Thói Quen. Trượt ngã thì bấm <strong>Tái phạm / Đặt lại</strong>: đợt vừa qua được ghi vào lịch sử rồi đồng hồ bắt đầu lại từ 0.</p>'],
        ["Đồng hồ bấm giờ & đếm ngược", '<p>Trong ngăn chi tiết của một lần làm, mục <strong>Thời gian làm</strong> có hai chế độ: <strong>Đếm xuôi</strong> (bấm giờ làm thực tế) và <strong>Đếm ngược</strong> (chọn nhanh 5–60 phút hoặc nhập số phút tuỳ ý, kiểu Pomodoro). Cả hai đều tạm dừng / tiếp tục được; đếm ngược về 0 sẽ phát âm báo, rung (trên điện thoại) và tự chốt phiên đúng thời lượng đã đặt. Mọi phiên đều lưu lịch sử dạng dòng thời gian Bắt đầu / Tạm dừng / Tiếp tục / Kết thúc để xem lại.</p>'],
        ["Tạo trước & thông báo, rung", '<p><strong>Tạo trước:</strong> mỗi chuỗi lặp có tuỳ chọn “Tạo trước” từ 0 đến 30 ngày (mặc định 7) ngay dưới phần lịch lặp: app chỉ tạo sẵn lần làm trong khoảng đó, không tạo xa hơn. Giảm số ngày tạo trước sẽ dọn các lần làm tương lai <strong>chưa có tương tác nào</strong> vượt mốc mới; lần làm đã tick, ghi chú hay đếm giờ thì giữ nguyên.</p><p><strong>Thông báo &amp; rung:</strong> bật công tắc ở mục Hệ thống (màn Dữ Liệu &amp; Hệ Thống) thì khi nhắc việc tới hạn và khi đồng hồ đếm ngược về 0, app phát thông báo hệ thống kèm rung (trên thiết bị hỗ trợ). App chỉ xin quyền thông báo khi bạn bật công tắc. Lưu ý: thông báo phát <strong>khi app đang mở</strong>; app đóng hẳn thì không đẩy được thông báo — đây là giới hạn của nền tảng.</p><p>Các mục nhỏ trong một việc được gọi thống nhất là <strong>Bước</strong>: trong ngăn chi tiết chỉ có một ô thêm bước, chọn phạm vi “Cho lần này” hoặc “Mẫu của chuỗi” ngay cạnh ô nhập.</p>'],
        ["Sao lưu & khôi phục", '<p>App <strong>tự sao lưu ngay trong trình duyệt này</strong> mỗi khi mở, nếu bản gần nhất đã quá 24 giờ, và luôn giữ <strong>5 bản gần nhất</strong> (bản cũ hơn tự xoá). Nếu quá 7 ngày chưa có bản sao lưu thành công, app hiện cảnh báo ở màn Hôm Nay kèm nút <strong>Sao lưu ngay</strong>.</p><p>Ở màn <strong>Dữ Liệu &amp; Hệ Thống</strong> có nút Sao lưu ngay và danh sách các bản để khôi phục từng bản. Việc và ghi chú đã xoá nằm ở màn <strong>Thùng Rác</strong> riêng — khôi phục hoặc xoá vĩnh viễn tại đó. Lưu ý: khôi phục <strong>thay toàn bộ dữ liệu hiện tại</strong> bằng nội dung tại thời điểm sao lưu nên app luôn hỏi xác nhận trước. Ngoài ra bạn vẫn xuất/nhập dữ liệu bằng tệp JSON như trước.</p>'],
        ["Tìm kiếm & phím tắt", '<ul><li><kbd>Ctrl</kbd> + <kbd>K</kbd> (trên Mac: <kbd>Cmd</kbd> + <kbd>K</kbd>) — mở bảng lệnh: tìm việc, ghi chú hoặc nhảy tới màn hình. Dùng <kbd>↑</kbd> <kbd>↓</kbd> để chọn và <kbd>Enter</kbd> để mở.</li><li><kbd>Esc</kbd> — đóng bảng lệnh, ngăn chi tiết và các hộp thoại.</li><li><kbd>Tab</kbd> / <kbd>Shift</kbd> + <kbd>Tab</kbd> — di chuyển giữa các nút và ô nhập; vòng viền sáng cho biết bạn đang ở đâu. Mọi thao tác trong app (kể cả đổi trạng thái trên bảng Kanban bằng các nút chuyển cột) đều làm được bằng bàn phím, không cần chuột.</li></ul><p>Bảng lệnh cũng là nơi tìm nhanh nhất: gõ vài chữ của tên việc hoặc ghi chú là nhảy thẳng tới nơi, khỏi lật qua từng màn hình.</p>']
      ];
      var html='<h3><span class="micro">TRỢ GIÚP</span>Hướng dẫn sử dụng</h3>'
        + secs.map(function(s){ return '<section class="help-sec"><h4>'+esc(s[0])+'</h4>'+s[1]+'</section>'; }).join("")
        + '<div class="foot"><button class="btn primary" id="help-close" type="button" style="flex:1">Đóng</button></div>';
      openModal(html, true);
      $("#help-close").addEventListener("click", closeModal);
    }

    /* ================= BẢNG LỆNH Ctrl+K (v2.2 — tìm cả ghi chú) ================= */
    function openPalette(){
      var p=$("#palette");
      p.innerHTML='<div class="pal-box"><input id="pal-in" type="text" placeholder="Tìm việc, ghi chú hoặc lệnh… (Esc để đóng)" autocomplete="off" /><div class="pal-list" id="pal-list"></div></div>';
      p.classList.add("on");
      function buildItems(q){
        q=(q||"").toLowerCase();
        var groups=[];
        var views=NAV.filter(function(n){ return !q || n.label.toLowerCase().indexOf(q)>=0; }).map(function(n){ return {label:"Đi tới: "+n.label, run:function(){ UI.view=n.id; render(); }}; });
        if(views.length) groups.push({name:"Màn hình", items:views});
        var acts=[
          {label:"Thêm việc mới (form đầy đủ)", run:function(){ openTaskForm(null,null); }},
          {label:"Tạo thói quen cai mới", run:function(){ openTaskForm(null,null,"quit"); }},
          {label:"Ghi chú mới", run:function(){ UI.view="notes"; UI.notesTab="notes"; render(); var n={ id:uid(), title:"", content:"", pinned:false, projectId:null, seriesId:null, tags:[], lineLinks:[], deletedAt:null, createdAt:Date.now(), updatedAt:Date.now() }; state.notes.push(n); save(); openNoteEditor(n.id); }},
          {label:"Hướng dẫn sử dụng", run:function(){ openHelp(); }},
          {label:"Xem phiên bản & Có gì mới", run:function(){ openVersionDialog(); }},
          {label:"Sao lưu ngay (cục bộ)", run:function(){ createBackup("manual"); toast("Đã sao lưu ngay."); }},
          {label:"Xuất sao lưu JSON", run:function(){ UI.view="system"; render(); exportJSON(); }},
          {label:"Khoá app ngay", run:function(){ lockNow(); }}
        ].filter(function(a){ return !q || a.label.toLowerCase().indexOf(q)>=0; });
        var lbl=undoLabel();
        if(lbl) acts.unshift({label:lbl, run:function(){ doUndo(); }});
        if(acts.length) groups.push({name:"Lệnh", items:acts});
        if(q){
          var occs=liveOccs().filter(function(o){ return (o.title+" "+(o.desc||"")+" "+(o.note||"")).toLowerCase().indexOf(q)>=0; }).slice(0,10)
            .map(function(o){ return {label:"Mở việc: "+o.title, sub:o.dueDate? fmtShort(o.dueDate) : "", run:function(){ openDrawer(o.id); }}; });
          if(occs.length) groups.push({name:"Việc", items:occs});
          var notes=liveNotes().filter(function(n){ return (n.title+" "+n.content).toLowerCase().indexOf(q)>=0; }).slice(0,8)
            .map(function(n){ return {label:"Mở ghi chú: "+(n.title||"Không tiêu đề"), sub:fmtDT(n.updatedAt), run:function(){ UI.view="notes"; render(); openNoteEditor(n.id); }}; });
          if(notes.length) groups.push({name:"Ghi chú", items:notes});
        } else {
          var open=liveOccs().filter(function(o){return o.status!=="done"&&o.status!=="skipped";}).slice(0,8)
            .map(function(o){ return {label:"Mở việc: "+o.title, sub:o.dueDate? fmtShort(o.dueDate) : "", run:function(){ openDrawer(o.id); }}; });
          if(open.length) groups.push({name:"Việc đang mở", items:open});
        }
        return groups;
      }
      var flat=[], activeIdx=0;
      function draw(q){
        var groups=buildItems(q);
        flat=[]; groups.forEach(function(g){ g.items.forEach(function(it){ flat.push(it); }); });
        activeIdx=0;
        var gi=0;
        $("#pal-list").innerHTML= flat.length? groups.map(function(g){
          return '<div class="pal-group">'+esc(g.name)+'</div>'+g.items.map(function(it){ var idx=gi++; return '<div class="pal-item'+(idx===activeIdx?" sel":"")+'" data-pi="'+idx+'">'+esc(it.label)+(it.sub? '<span class="k">'+esc(it.sub)+'</span>' : '')+'</div>'; }).join("");
        }).join("") : '<div class="pal-item">Không thấy kết quả</div>';
        $$("#pal-list .pal-item").forEach(function(el){ el.addEventListener("click", function(){ var it=flat[+el.getAttribute("data-pi")]; closePalette(); if(it) it.run(); }); });
      }
      function markActive(){
        $$("#pal-list .pal-item").forEach(function(el){ el.classList.toggle("sel", +el.getAttribute("data-pi")===activeIdx); });
        var sel=$("#pal-list .pal-item.sel"); if(sel && sel.scrollIntoView) sel.scrollIntoView({block:"nearest"});
      }
      draw("");
      var inp=$("#pal-in");
      inp.addEventListener("input", function(){ draw(inp.value); });
      inp.addEventListener("keydown", function(e){
        if(e.key==="ArrowDown"){ e.preventDefault(); activeIdx=Math.min(flat.length-1, activeIdx+1); markActive(); }
        else if(e.key==="ArrowUp"){ e.preventDefault(); activeIdx=Math.max(0, activeIdx-1); markActive(); }
        else if(e.key==="Enter"){ var it=flat[activeIdx]; closePalette(); if(it) it.run(); }
      });
      setTimeout(function(){ inp.focus(); }, 30);
    }
    function closePalette(){ var p=$("#palette"); p.classList.remove("on"); p.innerHTML=""; }
    $("#palette").addEventListener("click", function(e){ if(e.target===this) closePalette(); });
    document.addEventListener("keydown", function(e){
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); if($("#app").classList.contains("on")){ if($("#palette").classList.contains("on")) closePalette(); else openPalette(); } }
      if(e.key==="Escape"){ closePalette(); closeDrawer(); closeModal(); UI.moreOpen=false; renderMoreSheet(); }
    });

    /* ================= NHẮC VIỆC TRONG TRANG (+ thông báo & rung) ================= */
    var remindShown={};
    function nextDueReminder(){
      var now=Date.now(), best=null;
      liveOccs().forEach(function(o){
        if(o.status==="done"||o.status==="skipped") return;
        (o.reminders||[]).forEach(function(r){
          if(!r.done && r.at<=now && !remindShown["r:"+r.id]){ if(!best || r.at<best.at) best={occ:o, rem:r, at:r.at, key:"r:"+r.id}; }
        });
        var t=o.snoozeUntil && o.snoozeUntil>0 ? o.snoozeUntil : remindAtOf(o);
        if(t && t<=now && !o.remindFired && !remindShown["o:"+o.id]){ if(!best || t<best.at) best={occ:o, rem:null, at:t, key:"o:"+o.id}; }
      });
      return best;
    }
    function checkReminders(){
      if(!$("#app").classList.contains("on")) return;
      var due=nextDueReminder();
      if(!due){ $("#remindbar").classList.remove("on"); return; }
      remindShown[due.key]=true;
      notifyFire("Đến giờ: "+due.occ.title, (due.occ.dueDate? fmtDate(due.occ.dueDate) : "")+(due.occ.dueTime? " · "+due.occ.dueTime : ""));
      var bar=$("#remindbar"), o=due.occ;
      bar.innerHTML='<div class="remind-card"><b>⏰ Đến giờ: '+esc(o.title)+'</b><div>'+(o.dueDate? esc(fmtDate(o.dueDate)) : "")+(o.dueTime? " · "+esc(o.dueTime) : "")+'</div><div class="rowb"><button class="btn small primary" id="rb-open">Mở việc</button><button class="btn small" id="rb-10">Nhắc lại sau 10 phút</button><button class="btn small" id="rb-1h">Sau 1 giờ</button><button class="btn small" id="rb-tmr">Ngày mai</button><button class="btn small ghost" id="rb-ok">Đã biết</button></div></div>';
      bar.classList.add("on");
      function markDone(){ if(due.rem){ due.rem.done=true; } else { o.remindFired=true; } save(); }
      $("#rb-open").addEventListener("click", function(){ bar.classList.remove("on"); markDone(); openDrawer(o.id); });
      $("#rb-ok").addEventListener("click", function(){ bar.classList.remove("on"); markDone(); });
      function snoozeRemind(ms, label){
        if(due.rem){ due.rem.at=Date.now()+ms; remindShown["r:"+due.rem.id]=false; }
        else { o.snoozeUntil=Date.now()+ms; o.remindFired=false; remindShown["o:"+o.id]=false; }
        logAct(o,"remind_snooze","Nhắc lại: "+label); save(); bar.classList.remove("on"); toast("Sẽ nhắc lại "+label+".");
      }
      $("#rb-10").addEventListener("click", function(){ snoozeRemind(10*60000, "sau 10 phút"); });
      $("#rb-1h").addEventListener("click", function(){ snoozeRemind(60*60000, "sau 1 giờ"); });
      $("#rb-tmr").addEventListener("click", function(){ snoozeRemind(24*3600000, "vào ngày mai"); });
    }
    setInterval(checkReminders, 20000);

    /* ================= RENDER & KHỞI ĐỘNG ================= */
    function render(){
      renderShell();
      if(UI.view==="today") renderToday();
      else if(UI.view==="inbox") renderInbox();
      else if(UI.view==="calendar") renderCalendar();
      else if(UI.view==="kanban") renderKanban();
      else if(UI.view==="notes") renderNotes();
      else if(UI.view==="projects") renderProjects();
      else if(UI.view==="habits") renderHabits();
      else if(UI.view==="stats") renderStats();
      else if(UI.view==="trash") renderTrash();
      else if(UI.view==="system") renderSystem();
    }
    $("#fab").addEventListener("click", function(){ openTaskForm(null, null); });
    function enterApp(){
      $("#gate").hidden=true;
      $("#app").classList.add("on");
      loadMeta(); applyTheme();
      loadData(); materialize();
      maybeAutoBackup(); runRestoreDrill();
      UI.viewDate=todayStr();
      render(); checkReminders(); startTick();
      if(hasUnseenVersion()){
        setTimeout(function(){ openVersionDialog(); }, 450);
      }
    }
    (function boot(){
      loadMeta(); applyTheme();
      var auth=loadAuth();
      if(!auth){ showGate("setup"); return; }
      try{ var d=JSON.parse(localStorage.getItem(LS_DATA)); if(d && d.requireLock===false){ enterApp(); return; } }catch(e){}
      if(sessionStorage.getItem(SS_UNLOCK)==="1"){ enterApp(); return; }
      showGate("lock");
    })();
</script>
  </body>
</html>
