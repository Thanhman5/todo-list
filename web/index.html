<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Checklist Công Việc Lặp Lại — Bản Public</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#f6f4ef; --surface:#fffdfa; --surface2:#efece4; --ink:#1d2129; --ink2:#5b6068; --ink3:#8a8f98;
        --line:#e2ded2; --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e0f2ef;
        --amber:#b45309; --amber-soft:#fdf0dd; --red:#b3352b; --red-soft:#fbe9e7;
        --green:#2e7d4f; --green-soft:#e4f2e8; --blue:#2563eb; --blue-soft:#e6eefc;
        --shadow:0 10px 30px rgba(29,33,41,.10); --radius:14px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#14161a; --surface:#1d2026; --surface2:#262a31; --ink:#eceef1; --ink2:#a8adb6; --ink3:#767c86;
          --line:#333842; --accent:#2dd4bf; --accent-ink:#06231f; --accent-soft:#123b36;
          --amber:#f0b269; --amber-soft:#3d2f18; --red:#f08a80; --red-soft:#40201d;
          --green:#7fce9b; --green-soft:#1e3325; --blue:#8fb4f5; --blue-soft:#1d2c47;
          --shadow:0 10px 30px rgba(0,0,0,.45);
        }
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
      button{font:inherit;cursor:pointer}
      input,select,textarea{font:inherit;color:var(--ink)}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

      /* ---------- GATE (AUTH) ---------- */
      #gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
      #gate[hidden]{display:none}
      .gate-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);max-width:400px;width:100%;padding:32px 28px;text-align:left}
      .gate-mark{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
      .gate-card h1{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
      .gate-card p{color:var(--ink2);margin:0 0 20px;font-size:14px}
      .gate-card label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
      .gate-card input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
      .gate-err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:14px;display:none}
      .gate-err.show{display:block}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px;font-size:14.5px}
      .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
      .btn.danger{background:var(--red);border-color:var(--red);color:#fff}
      .btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
      .btn.small{min-height:38px;padding:6px 12px;font-size:13.5px}
      .btn.block{width:100%}
      .gate-card .btn.primary{width:100%;margin-top:20px}
      .gate-foot{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;text-align:center}
      .gate-note{font-size:12.5px;color:var(--ink3);margin-top:16px;text-align:center}

      /* ---------- APP SHELL ---------- */
      #app{display:none;min-height:100dvh}
      #app.on{display:flex}
      aside{width:228px;flex:0 0 228px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:2px}
      .brand{font-weight:800;font-size:16px;padding:4px 10px 14px;letter-spacing:-.01em}
      .brand small{display:block;font-weight:500;color:var(--ink3);font-size:12px;margin-top:2px}
      .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:11px 10px;border-radius:10px;color:var(--ink2);font-weight:600;min-height:44px;font-size:14.5px}
      .navbtn svg{flex:0 0 auto}
      .navbtn.active{background:var(--accent-soft);color:var(--ink)}
      .navbtn .cnt{margin-left:auto;background:var(--surface2);border-radius:99px;font-size:12px;padding:1px 8px;color:var(--ink2)}
      .navbtn .cnt.hot{background:var(--red-soft);color:var(--red)}
      aside .spacer{flex:1}
      main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1060px;margin:0 auto;width:100%}
      .topbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
      .quickadd{flex:1;min-width:220px;display:flex;gap:8px}
      .quickadd input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;min-height:48px}
      .viewhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
      .viewhead h2{font-size:24px;margin:0;font-weight:800;letter-spacing:-.01em}
      .viewhead .sub{color:var(--ink2);font-size:14px}
      .datenav{display:flex;align-items:center;gap:6px;margin-left:auto}
      .datenav .btn{min-width:44px;padding:8px 10px}
      .datenav input[type=date]{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}

      .day-progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
      .day-progress .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);margin-bottom:8px}
      .day-progress .row b{color:var(--ink);font-size:15px}
      .pbar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
      .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

      .group-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
      .group-title .cnt{background:var(--surface2);border-radius:99px;padding:0 8px;font-size:12px;letter-spacing:0}
      .group-title.overdue{color:var(--red)}

      .task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
      .task.done{opacity:.62}
      .task.skipped{opacity:.5}
      .task .check{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink3);background:transparent;display:flex;align-items:center;justify-content:center;margin-top:2px;color:transparent;padding:0}
      .task .check.doing{border-color:var(--amber);color:var(--amber)}
      .task .check.done{border-color:var(--green);background:var(--green);color:#fff}
      .task .body{flex:1;min-width:0;cursor:pointer}
      .task .title{font-weight:600;font-size:15.5px;word-break:break-word}
      .task.done .title{text-decoration:line-through}
      .task .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:12.5px;color:var(--ink2);align-items:center}
      .task .meta .overdue{color:var(--red);font-weight:600}
      .chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2)}
      .chip .dot{width:8px;height:8px;border-radius:50%}
      .chip.p-gap{background:var(--red-soft);color:var(--red)}
      .chip.p-cao{background:var(--amber-soft);color:var(--amber)}
      .chip.tagchip{background:var(--blue-soft);color:var(--blue)}
      .task .acts{display:flex;gap:4px;flex:0 0 auto}
      .iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center}
      .iconbtn:hover{background:var(--surface2)}
      .iconbtn.run{color:var(--red)}
      .task .prog{margin-top:8px;display:none}
      .task .prog.show{display:flex;align-items:center;gap:10px}
      .task .prog input[type=range]{flex:1;accent-color:var(--amber);min-height:32px}
      .task .prog b{font-size:13px;min-width:38px;text-align:right}
      .steps-mini{margin-top:6px;font-size:12.5px;color:var(--ink3)}
      .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--ink2)}
      .empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:4px}

      /* filters */
      .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
      .filterbar input[type=search],.filterbar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;font-size:14px}
      .filterbar input[type=search]{flex:1;min-width:160px}

      /* calendar */
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
      .cal-dow{font-size:12px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
      .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
      .cal-cell.dim{opacity:.38}
      .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
      .cal-cell .d{font-weight:700;font-size:13px}
      .cal-cell .mini{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .cal-cell .mini.done{color:var(--green)}
      .cal-cell .mini.doing{color:var(--amber)}
      .cal-cell .more{font-size:11px;color:var(--ink3)}

      /* kanban */
      .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
      .kcol{background:var(--surface2);border-radius:var(--radius);padding:12px;min-height:120px}
      .kcol h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
      .kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
      .kcard .t{font-weight:600;font-size:14.5px;cursor:pointer}
      .kcard .m{font-size:12px;color:var(--ink2);margin-top:3px}
      .kcard .rowbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

      /* projects / habits / stats */
      .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
      .card h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
      .card .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
      .card p{margin:4px 0;color:var(--ink2);font-size:13.5px}
      .streak-flame{font-size:20px}
      .heat{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin-top:8px}
      .heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
      .heat i.l1{background:#bfe3d2}.heat i.l2{background:#7cc7a4}.heat i.l3{background:#3da873}.heat i.l4{background:#1d7a4c}
      @media (prefers-color-scheme: dark){.heat i.l1{background:#1e3d2c}.heat i.l2{background:#276848}.heat i.l3{background:#2f9263}.heat i.l4{background:#43b67c}}
      table.stats{width:100%;border-collapse:collapse;font-size:14px}
      table.stats th,table.stats td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
      table.stats th{color:var(--ink3);font-size:12.5px}
      table.stats td.num,table.stats th.num{text-align:right}

      /* drawer */
      #scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:90;display:none}
      #scrim.on{display:block}
      #drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);z-index:100;transform:translateX(105%);transition:transform .25s ease;overflow-y:auto;padding:20px;box-shadow:var(--shadow)}
      #drawer.on{transform:none}
      #drawer h3{margin:0 40px 4px 0;font-size:19px}
      .dsec{margin-top:20px}
      .dsec>h4{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
      .dclose{position:absolute;top:14px;right:14px}
      .step-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
      .step-row .st{flex:1}
      .step-row .st.done{text-decoration:line-through;color:var(--ink3)}
      .steptoggle{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--ink3);background:transparent;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent}
      .steptoggle.done{background:var(--green);border-color:var(--green);color:#fff}
      textarea.note{width:100%;min-height:74px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical}
      .hist{font-size:13px;color:var(--ink2)}
      .hist div{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
      .hist time{color:var(--ink3);white-space:nowrap;font-size:12px;padding-top:1px}
      .seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
      .seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:8px;font-weight:600;color:var(--ink2);min-height:40px;font-size:13.5px;white-space:nowrap}
      .seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

      /* modal */
      #modalwrap{position:fixed;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;background:rgba(10,12,16,.45);padding:18px;overflow-y:auto}
      #modalwrap.on{display:flex}
      .modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;padding:22px;margin:auto 0;box-shadow:var(--shadow)}
      .modal h3{margin:0 0 14px;font-size:19px}
      .f-field{margin-bottom:13px}
      .f-field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
      .f-field input,.f-field select,.f-field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
      .f-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .f-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
      .chipsel{display:flex;flex-wrap:wrap;gap:6px}
      .chipsel .chip{cursor:pointer;border:1px solid var(--line);min-height:34px;padding:4px 12px}
      .chipsel .chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
      .modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
      .hint{font-size:12.5px;color:var(--ink3);margin-top:4px}

      /* palette */
      #palette{position:fixed;inset:0;z-index:130;display:none;background:rgba(10,12,16,.45);padding:12vh 16px 16px;justify-content:center;align-items:flex-start}
      #palette.on{display:flex}
      .pal-box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;box-shadow:var(--shadow);overflow:hidden}
      .pal-box input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px;font-size:16px;background:var(--surface)}
      .pal-list{max-height:50vh;overflow-y:auto}
      .pal-item{padding:12px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14.5px}
      .pal-item.sel,.pal-item:hover{background:var(--surface2)}
      .pal-item .k{margin-left:auto;font-size:12px;color:var(--ink3)}

      /* toast + reminder */
      #toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;width:min(480px,calc(100vw - 24px))}
      .toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:14px}
      .toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:32px}
      #remindbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:140;width:min(520px,calc(100vw - 24px));display:none}
      #remindbar.on{display:block}
      .remind-card{background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
      .remind-card b{font-size:15.5px}
      .remind-card .rowb{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

      /* bottom nav mobile */
      #bottomnav{display:none}
      @media (max-width:860px){
        aside{display:none}
        main{padding:16px 14px 150px}
        #toasts{bottom:150px}
        #bottomnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
        #bottomnav button{border:0;background:transparent;color:var(--ink2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:10px;min-height:52px}
        #bottomnav button.active{color:var(--accent)}
        .kanban{grid-template-columns:1fr}
        .cal-cell{min-height:58px}
        .f-2,.f-3{grid-template-columns:1fr}
        .heat{grid-template-columns:repeat(13,1fr)}
      }
      @media (prefers-reduced-motion: reduce){*{transition:none!important}}
    </style>
  </head>
  <body>
    <!-- ======= CỔNG KHOÁ ======= -->
    <div id="gate"></div>

    <!-- ======= APP ======= -->
    <div id="app">
      <aside id="sidebar"></aside>
      <main id="main"></main>
      <nav id="bottomnav"></nav>
    </div>

    <div id="scrim"></div>
    <section id="drawer" aria-label="Chi tiết việc"></section>
    <div id="modalwrap"></div>
    <div id="palette"></div>
    <div id="remindbar"></div>
    <div id="toasts"></div>

    <script>
    "use strict";
    /* =====================================================================
       Checklist Công Việc Lặp Lại — Bản Public (tĩnh)
       - Auth: mã truy cập băm SHA-256 + salt, lưu localStorage (không lưu mã thô)
       - Dữ liệu: toàn bộ trong localStorage của trình duyệt người mở
       ===================================================================== */
    var LS_AUTH = "cklp.auth.v1";
    var LS_DATA = "cklp.data.v1";
    var SS_UNLOCK = "cklp.unlocked";

    /* ---------- tiện ích ---------- */
    function $(s, r){ return (r||document).querySelector(s); }
    function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
    function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
    function pad2(n){ return (n<10?"0":"")+n; }
    function dstr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
    function todayStr(){ return dstr(new Date()); }
    function parseD(s){ if(!s) return null; var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
    function addDays(s, n){ var d=parseD(s); d.setDate(d.getDate()+n); return dstr(d); }
    function fmtDate(s){ if(!s) return "Chưa đặt ngày"; var d=parseD(s); var days=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"]; return days[d.getDay()]+", "+pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear(); }
    function fmtDT(ts){ var d=new Date(ts); return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
    function fmtDur(min){ if(!min) return "0p"; if(min<60) return min+"p"; var h=Math.floor(min/60), m=min%60; return m? h+"g "+m+"p" : h+"g"; }
    function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
    var PALETTE = ["#0f766e","#2563eb","#b45309","#b3352b","#2e7d4f","#6d4fa1","#0e7490","#a16207","#be185d","#4d7c0f"];

    /* ---------- AUTH ---------- */
    function loadAuth(){ try{ var a=JSON.parse(localStorage.getItem(LS_AUTH)); return (a && a.hash) ? a : null; }catch(e){ return null; } }
    function saveAuth(a){ if(a) localStorage.setItem(LS_AUTH, JSON.stringify(a)); else localStorage.removeItem(LS_AUTH); }
    function sha256Hex(text){
      if(window.crypto && crypto.subtle && crypto.subtle.digest){
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){

    function seriesDates(s, fromStr, toStr){
      /* sinh các ngày khớp rrule trong [fromStr..toStr], tôn trọng start/end */
      var out=[]; if(!s.rrule) return out;

      var hi = to;
      if(s.endType==="date" && s.endDate){ var ed=parseD(s.endDate); if(ed<hi) hi=ed; }
      if(hi<lo) return out;
      var r=s.rrule, iv=r.interval||1, count=0, guard=0;
      var countedTo = lo;
      if(s.endType==="count"){
        /* đếm số lần từ start tới trước lo */
        countedTo = new Date(start.getTime());
        count = countMatches(s, start, addDays(dstr(lo),-1));
        if(count>=(s.endCount||0)) return out;
      }
      var d=new Date(lo.getTime());

        guard++;
        if(matchesRule(s, d)){
          if(s.endType==="count"){ if(count>=(s.endCount||0)) break; count++; }
          out.push(dstr(d));

        d.setDate(d.getDate()+1);
      }
      return out;
    }
    function countMatches(s, fromD, toStr){
      var to=parseD(toStr); if(!to||to<fromD) return 0; var n=0, d=new Date(fromD.getTime()), g=0;
      while(d<=to && g<4000){ g++; if(matchesRule(s,d)) n++; d.setDate(d.getDate()+1); }
      return n;
    }
    function matchesRule(s, d){
      var r=s.rrule; if(!r) return false;
      var start=parseD(s.start); var iv=r.interval||1;
      var diffDays=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);
      if(diffDays<0) return false;
      if(r.freq==="daily") return diffDays % iv === 0;
      if(r.freq==="workday") return d.getDay()>=1 && d.getDay()<=5;
      if(r.freq==="weekly"){
        if(!r.weekdays || !r.weekdays.length) return d.getDay()===start.getDay();
        if(r.weekdays.indexOf(d.getDay())<0) return false;
        var weekIdx=Math.floor(diffDays/7);
        /* neo tuần theo chủ nhật của tuần chứa start */
        var startSunday=new Date(start.getTime()); startSunday.setDate(start.getDate()-start.getDay());
        var dSunday=new Date(d.getTime()); dSunday.setDate(d.getDate()-d.getDay());
        weekIdx=Math.round((dSunday-startSunday)/604800000);
        return weekIdx % iv === 0;
      }
      if(r.freq==="monthly"){
        var mDiff=(d.getFullYear()-start.getFullYear())*12 + (d.getMonth()-start.getMonth());
        if(mDiff<0 || mDiff % iv !== 0) return false;
        if(r.monthMode==="nth"){
          if(d.getDay()!==(r.monthWeekday!=null?r.monthWeekday:start.getDay())) return false;
          var nth=r.monthNth||1;
          if(nth===5){ var nm=new Date(d.getFullYear(), d.getMonth(), d.getDate()+7); return nm.getMonth()!==d.getMonth(); }
          return Math.floor((d.getDate()-1)/7)+1===nth;
        }
        var md=r.monthDay||start.getDate();
        var lastDay=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
        return d.getDate()===Math.min(md, lastDay);
      }
      return false;
    }

      var tagOpts='<option value="">Mọi tag</option>'+state.tags.map(function(t){return '<option value="'+t.id+'"'+(f.tagId===t.id?" selected":"")+'">#'+esc(t.name)+'</option>';}).join("");
      return '<div class="filterbar"><input type="search" id="f-q" placeholder="Tìm kiếm việc…" value="'+esc(f.q)+'" />'
        + '<select id="f-proj">'+projOpts+'</select><select id="f-tag">'+tagOpts+'</select>'
        + '<select id="f-pri"><option value="">Mọi mức ưu tiên</option><option value="gap"'+(f.priority==="gap"?" selected":"")+'>Gấp</option><option value="cao"'+(f.priority==="cao"?" selected":"")+'>Cao</option><option value="vua"'+(f.priority==="vua"?" selected":"")+'>Vừa</option><option value="thap"'+(f.priority==="thap"?" selected":"")+'>Thấp</option></select>'
        + '<select id="f-status"><option value="">Mọi trạng thái</option><option value="todo"'+(f.status==="todo"?" selected":"")+'>Chưa làm</option><option value="doing"'+(f.status==="doing"?" selected":"")+'>Đang làm</option><option value="done"'+(f.status==="done"?" selected":"")+'>Hoàn thành</option><option value="skipped"'+(f.status==="skipped"?" selected":"")+'>Bỏ qua</option><option value="overdue"'+(f.status==="overdue"?" selected":"")+'>Quá hạn</option></select>'
        + '<button class="btn small" id="f-save" type="button">Lưu view</button>'
        + (state.views.length? '<select id="f-views"><option value="">View đã lưu…</option>'+state.views.map(function(v){return '<option value="'+v.id+'">'+esc(v.name)+'</option>';}).join("")+'</select><button class="btn small ghost" id="f-delview" type="button">Xoá view chọn</button>' : '')
        + ((f.q||f.projectId||f.tagId||f.priority||f.status)? '<button class="btn small ghost" id="f-clear" type="button">Xoá lọc</button>' : '')
        + '</div>';
    }
    function wireFilterbar(){
      var q=$("#f-q"); if(!q) return;
      q.addEventListener("input", function(){ UI.filter.q=q.value; refreshListArea(); });
      $("#f-proj").addEventListener("change", function(e){ UI.filter.projectId=e.target.value; render(); });
      $("#f-tag").addEventListener("change", function(e){ UI.filter.tagId=e.target.value; render(); });
      $("#f-pri").addEventListener("change", function(e){ UI.filter.priority=e.target.value; render(); });
      $("#f-status").addEventListener("change", function(e){ UI.filter.status=e.target.value; render(); });
      var c=$("#f-clear"); if(c) c.addEventListener("click", function(){ UI.filter={q:"",projectId:"",tagId:"",priority:"",status:""}; render(); });
      $("#f-save").addEventListener("click", function(){
        openTextPrompt("Lưu bộ lọc thành view", "Tên view", "", function(name){
          if(!name) return; state.views.push({id:uid(), name:name, filter:deepClone(UI.filter)}); save(); render(); toast("Đã lưu view “"+name+"”.");
        });
      });
      var vs=$("#f-views"); if(vs) vs.addEventListener("change", function(){ var v=state.views.filter(function(x){return x.id===vs.value;})[0]; if(v){ UI.filter=deepClone(v.filter); render(); } });
      var dv=$("#f-delview"); if(dv) dv.addEventListener("click", function(){ var sel=$("#f-views"); if(sel && sel.value){ state.views=state.views.filter(function(x){return x.id!==sel.value;}); save(); render(); toast("Đã xoá view."); } });
    }
    function applyFilter(list){
      var f=UI.filter;
      return list.filter(function(o){
        if(f.q && (o.title+" "+(o.desc||"")).toLowerCase().indexOf(f.q.toLowerCase())<0) return false;
        if(f.projectId && o.projectId!==f.projectId) return false;
        if(f.tagId && (o.tags||[]).indexOf(f.tagId)<0) return false;
        if(f.priority && (o.priority||"vua")!==f.priority) return false;
        if(f.status){ if(f.status==="overdue"){ if(!isOverdue(o)) return false; } else if(o.status!==f.status) return false; }
        return true;
      });
    }
    function runningSession(o){ return (o.sessions||[]).filter(function(s){return !s.end;})[0] || null; }
    function actualMin(o){
      var total=0, now=Date.now();
      (o.sessions||[]).forEach(function(s){ total += ((s.end||now)-s.start)/60000; });
      return Math.round(total);
    }
    function priChip(p){
      if(p==="gap") return '<span class="chip p-gap">Gấp</span>';
      if(p==="cao") return '<span class="chip p-cao">Cao</span>';
      if(p==="thap") return '<span class="chip">Thấp</span>';
      return "";
    }
    function taskRowHTML(o, showDate){
      var run=runningSession(o);
      var proj=o.projectId? projectById(o.projectId): null;
      var doneSteps=(o.steps||[]).filter(function(s){return s.done;}).length;
      var meta="";
      if(showDate && o.dueDate) meta+='<span class="'+(isOverdue(o)?"overdue":"")+'">'+(o.dueDate===todayStr()?"Hôm nay":fmtDate(o.dueDate))+'</span>';
      if(!showDate && isOverdue(o)) meta+='<span class="overdue">Quá hạn từ '+fmtDate(o.dueDate)+'</span>';
      if(o.dueTime) meta+='<span>'+esc(o.dueTime)+'</span>';
      if(o.estimateMin) meta+='<span>Ước tính '+fmtDur(o.estimateMin)+'</span>';
      var act=actualMin(o); if(act>0) meta+='<span>Đã làm '+fmtDur(act)+'</span>';
      if(o.seriesId){ var s=seriesById(o.seriesId); if(s) meta+='<span>'+esc(rruleLabel(s.rrule))+'</span>'; }
      if(o.note) meta+='<span>Có ghi chú</span>';
      var tagsHtml=(o.tags||[]).map(function(tid){ var t=tagById(tid); return t? '<span class="chip tagchip">#'+esc(t.name)+'</span>' : ""; }).join("");
      var checkCls = o.status==="done" ? "done" : (o.status==="doing" ? "doing" : "");
      return '<div class="task '+o.status+'" data-occ="'+o.id+'">'
        + '<button class="check '+checkCls+'" data-act="cycle" title="Đổi trạng thái" aria-label="Đổi trạng thái">'+(o.status==="done"?ICONS.check:(o.status==="doing"?'<span style="font-size:11px;font-weight:800">'+(o.progress||0)+'%</span>':""))+'</button>'
        + '<div class="body" data-act="open"><div class="title">'+esc(o.title)+'</div>'
        + '<div class="meta">'+priChip(o.priority)+(proj? '<span class="chip"><span class="dot" style="background:'+esc(proj.color)+'"></span>'+esc(proj.name)+'</span>' : '')+tagsHtml+meta+'</div>'
        + ((o.steps&&o.steps.length)? '<div class="steps-mini">Việc con: '+doneSteps+'/'+o.steps.length+' xong</div>' : '')
        + '<div class="prog'+(o.status==="doing"?" show":"")+'"><input type="range" min="0" max="99" value="'+(o.progress||0)+'" data-prog="'+o.id+'" aria-label="Tiến độ phần trăm" /><b>'+(o.progress||0)+'%</b></div>'
        + '</div>'
        + '<div class="acts">'
        + '<button class="iconbtn'+(run?" run":"")+'" data-act="timer" title="'+(run?"Dừng đếm giờ":"Bắt đầu đếm giờ")+'">'+(run?ICONS.pause:ICONS.play)+'</button>'
        + (o.status!=="done"&&o.status!=="skipped"? '<button class="iconbtn" data-act="snooze" title="Hoãn sang ngày mai">'+ICONS.snooze+'</button>' : '')
        + '<button class="iconbtn" data-act="open" title="Chi tiết">'+ICONS.dots+'</button>'
        + '</div></div>';
    }
    function wireTaskRows(root){
      $$(".task", root).forEach(function(row){
        var id=row.getAttribute("data-occ");
        $$("[data-act]", row).forEach(function(b){
          b.addEventListener("click", function(ev){
            ev.stopPropagation();
            var act=b.getAttribute("data-act"), o=occById(id); if(!o) return;
            if(act==="open") openDrawer(id);
            else if(act==="cycle") cycleStatus(o);
            else if(act==="timer") toggleTimer(o);
            else if(act==="snooze") snoozeOcc(o, addDays(todayStr(),1), "ngày mai");
          });
        });
        var rg=$('input[type=range]', row);
        if(rg) rg.addEventListener("input", function(){ var o=occById(id); if(!o) return; setProgress(o, +rg.value, false); var b=rg.parentElement.querySelector("b"); if(b) b.textContent=rg.value+"%"; var chk=row.querySelector(".check span"); if(chk) chk.textContent=rg.value+"%"; });
        if(rg) rg.addEventListener("change", function(){ render(); });
      });
    }
    function refreshListArea(){ /* cập nhật lại danh sách khi gõ tìm kiếm mà không mất focus */
      if(UI.view==="today") renderTodayList();
      else if(UI.view==="inbox") render();
    }
    function emptyHTML(title, sub){
      return '<div class="empty"><b>'+esc(title)+'</b>'+esc(sub)+'</div>';
    }

    /* ================= MÀN: HÔM NAY ================= */
    function renderToday(){
      var vd=UI.viewDate, isToday=vd===todayStr();
      var h='<div class="viewhead"><h2>'+(isToday?"Hôm Nay":fmtDate(vd))+'</h2><span class="sub">'+(isToday? fmtDate(vd) : "Đang xem lại — vẫn sửa được như thường")+'</span>'
        + '<div class="datenav"><button class="btn" id="d-prev" title="Ngày trước">‹</button><input type="date" id="d-pick" value="'+vd+'" /><button class="btn" id="d-next" title="Ngày sau">›</button>'
        + (!isToday? '<button class="btn" id="d-today">Về hôm nay</button>' : '') + '</div></div>'
        + filterbarHTML() + '<div id="todaylist"></div>';
      $("#main").innerHTML = topbarHTML() + h;
      wireTopbar(); wireFilterbar();
      $("#d-prev").addEventListener("click", function(){ UI.viewDate=addDays(UI.viewDate,-1); render(); });
      $("#d-next").addEventListener("click", function(){ UI.viewDate=addDays(UI.viewDate,1); render(); });
      $("#d-pick").addEventListener("change", function(e){ if(e.target.value){ UI.viewDate=e.target.value; render(); } });
      var dt=$("#d-today"); if(dt) dt.addEventListener("click", function(){ UI.viewDate=todayStr(); render(); });
      renderTodayList();
    }
    function renderTodayList(){
      var host=$("#todaylist"); if(!host) return;
      var vd=UI.viewDate, isToday=vd===todayStr();
      var dayOccs = liveOccs().filter(function(o){ return o.dueDate===vd; });
      var total=dayOccs.length;
      var doneN=dayOccs.filter(function(o){return o.status==="done";}).length;
      var pct= total? Math.round(doneN/total*100) : 0;
      var list = sortOccs(applyFilter(dayOccs));
      var overdue = isToday ? sortOccs(applyFilter(liveOccs().filter(function(o){ return isOverdue(o) && o.dueDate!==vd; }))) : [];
      var focus = list.filter(function(o){ return (o.priority==="gap"||o.priority==="cao") && o.status!=="done" && o.status!=="skipped"; }).slice(0,3);
      var focusIds={}; focus.forEach(function(o){ focusIds[o.id]=1; });
      var rest = list.filter(function(o){ return !focusIds[o.id]; });
      var h='<div class="day-progress"><div class="row"><span>Tiến độ ngày: <b>'+doneN+'/'+total+' việc xong</b></span><span><b>'+pct+'%</b></span></div><div class="pbar"><i style="width:'+pct+'%"></i></div></div>';
      if(overdue.length) h+='<div class="group-title overdue">Quá hạn <span class="cnt">'+overdue.length+'</span></div>'+overdue.map(function(o){return taskRowHTML(o,true);}).join("");
      if(focus.length) h+='<div class="group-title">Trọng tâm <span class="cnt">'+focus.length+'</span></div>'+focus.map(function(o){return taskRowHTML(o,false);}).join("");
      h+='<div class="group-title">'+(isToday?"Việc hôm nay":"Việc trong ngày")+' <span class="cnt">'+rest.length+'</span></div>';
      h+= rest.length? rest.map(function(o){return taskRowHTML(o,false);}).join("") : emptyHTML(total? "Không có việc nào khớp bộ lọc" : "Chưa có việc nào cho ngày này", "Dùng ô thêm nhanh ở trên, hoặc nút “+ Việc chi tiết” để tạo việc.");
      host.innerHTML=h;
      wireTaskRows(host);
    }

    /* ================= MÀN: HỘP ĐẾN ================= */
    function renderInbox(){
      var nodate = sortOccs(applyFilter(liveOccs().filter(function(o){ return !o.dueDate && o.status!=="done" && o.status!=="skipped"; })));
      var upcoming = liveOccs().filter(function(o){ return o.dueDate && o.dueDate>todayStr() && o.dueDate<=addDays(todayStr(),14) && o.status!=="done" && o.status!=="skipped"; });
      var byDay={}; upcoming.forEach(function(o){ (byDay[o.dueDate]=byDay[o.dueDate]||[]).push(o); });
      var days=Object.keys(byDay).sort();
      var h='<div class="viewhead"><h2>Hộp Đến</h2><span class="sub">Việc chưa xếp ngày và việc sắp tới trong 14 ngày</span></div>'+filterbarHTML();
      h+='<div class="group-title">Chưa có ngày <span class="cnt">'+nodate.length+'</span></div>';
      h+= nodate.length? nodate.map(function(o){return taskRowHTML(o,false);}).join("") : emptyHTML("Hộp đến trống","Việc tạo mà chưa chọn ngày sẽ nằm ở đây.");
      days.forEach(function(d){ h+='<div class="group-title">'+esc(fmtDate(d))+' <span class="cnt">'+byDay[d].length+'</span></div>'+sortOccs(byDay[d]).map(function(o){return taskRowHTML(o,false);}).join(""); });
      h+='<div class="group-title">Mẫu việc <span class="cnt">'+state.templates.length+'</span></div>';
      h+= state.templates.length? '<div class="cards">'+state.templates.map(function(t){ return '<div class="card"><h3>'+esc(t.name)+'</h3><p>'+esc(t.payload.title||"")+'</p><button class="btn small primary" data-tpl="'+t.id+'">Tạo việc từ mẫu</button> <button class="btn small ghost" data-tpldel="'+t.id+'">Xoá mẫu</button></div>'; }).join("")+'</div>'
        : emptyHTML("Chưa có mẫu việc nào","Mở chi tiết một việc và chọn “Lưu làm mẫu” để tạo nhanh các việc giống nhau.");
      $("#main").innerHTML = topbarHTML()+h;
      wireTopbar(); wireFilterbar(); wireTaskRows($("#main"));
      $$("[data-tpl]").forEach(function(b){ b.addEventListener("click", function(){ createFromTemplate(b.getAttribute("data-tpl")); }); });
      $$("[data-tpldel]").forEach(function(b){ b.addEventListener("click", function(){ pushUndo("xoá mẫu việc"); state.templates=state.templates.filter(function(t){return t.id!==b.getAttribute("data-tpldel");}); save(); render(); }); });
    }
</script>
    <script>
    "use strict";
    /* ================= MÀN: LỊCH THÁNG ================= */
    function renderCalendar(){
      var ym=UI.calCursor.split("-"); var y=+ym[0], m=+ym[1]-1;
      var first=new Date(y,m,1); var startOffset=first.getDay();
      var gridStart=new Date(y,m,1-startOffset);
      var monthNames=["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6","Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];
      var h='<div class="viewhead"><h2>'+monthNames[m]+' '+y+'</h2><div class="datenav"><button class="btn" id="c-prev">‹ Tháng trước</button><button class="btn" id="c-today">Tháng này</button><button class="btn" id="c-next">Tháng sau ›</button></div></div>';
      h+='<div class="cal-grid">'+["CN","T2","T3","T4","T5","T6","T7"].map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join("");
      for(var i=0;i<42;i++){
        var d=new Date(gridStart.getTime()); d.setDate(gridStart.getDate()+i);
        var ds=dstr(d); var inMonth=d.getMonth()===m;
        var os=liveOccs().filter(function(o){return o.dueDate===ds;});
        var shown=os.slice(0,3).map(function(o){ return '<div class="mini '+o.status+'">'+(o.status==="done"?"✓ ":o.status==="doing"?"◐ ":"")+esc(o.title)+'</div>'; }).join("");
        h+='<button class="cal-cell'+(inMonth?"":" dim")+(ds===todayStr()?" today":"")+'" data-day="'+ds+'"><span class="d">'+d.getDate()+'</span>'+shown+(os.length>3? '<span class="more">+'+(os.length-3)+' việc nữa</span>' : '')+'</button>';
      }
      h+='</div><p class="hint" style="margin-top:12px">Bấm vào một ngày để xem và sửa việc của ngày đó (kể cả ngày đã qua).</p>';
      $("#main").innerHTML=topbarHTML()+h; wireTopbar();
      $("#c-prev").addEventListener("click", function(){ var d=new Date(y,m-1,1); UI.calCursor=dstr(d).slice(0,7); render(); });
      $("#c-next").addEventListener("click", function(){ var d=new Date(y,m+1,1); UI.calCursor=dstr(d).slice(0,7); render(); });
      $("#c-today").addEventListener("click", function(){ UI.calCursor=todayStr().slice(0,7); render(); });
      $$("[data-day]").forEach(function(b){ b.addEventListener("click", function(){ UI.viewDate=b.getAttribute("data-day"); UI.view="today"; render(); }); });
    }

    /* ================= MÀN: KANBAN ================= */
    function renderKanban(){
      var vd=UI.viewDate;
      var pool=liveOccs().filter(function(o){ return o.dueDate===vd || isOverdue(o); });
      pool=applyFilter(pool);
      var cols=[{k:"todo",t:"Chưa làm"},{k:"doing",t:"Đang làm"},{k:"done",t:"Hoàn thành"}];
      var h='<div class="viewhead"><h2>Kanban</h2><span class="sub">Việc của '+esc(fmtDate(vd))+' và việc quá hạn, xếp theo trạng thái</span>'
        +'<div class="datenav"><button class="btn" id="k-prev">‹</button><input type="date" id="k-pick" value="'+vd+'" /><button class="btn" id="k-next">›</button>'+(vd!==todayStr()? '<button class="btn" id="k-today">Về hôm nay</button>' : '')+'</div></div>'
        + filterbarHTML() + '<div class="kanban">'
        + cols.map(function(c){
            var items=sortOccs(pool.filter(function(o){ return c.k==="done" ? (o.status==="done"||o.status==="skipped") : o.status===c.k; }));
            return '<div class="kcol"><h3>'+c.t+'<span>'+items.length+'</span></h3>'

                  if(o.status==="doing") btns='<button class="btn small primary" data-kact="done" data-id="'+o.id+'">Xong</button><button class="btn small" data-kact="todo" data-id="'+o.id+'">Về chưa làm</button>';

                  return '<div class="kcard"><div class="t" data-kopen="'+o.id+'">'+esc(o.title)+'</div><div class="m">'+(isOverdue(o)? '<span style="color:var(--red);font-weight:600">Quá hạn · </span>' : '')+esc(o.dueDate?fmtDate(o.dueDate):"")+(o.dueTime?" · "+esc(o.dueTime):"")+(o.status==="doing"?" · "+(o.progress||0)+"%":"")+(o.status==="skipped"?" · Đã bỏ qua":"")+'</div><div class="rowbtns">'+btns+'</div></div>';
                }).join("") : '<p class="hint">Trống</p>')
              + '</div>';
          }).join("") + '</div>';
      $("#main").innerHTML=topbarHTML()+h; wireTopbar(); wireFilterbar();
      $("#k-prev").addEventListener("click", function(){ UI.viewDate=addDays(UI.viewDate,-1); render(); });
      $("#k-next").addEventListener("click", function(){ UI.viewDate=addDays(UI.viewDate,1); render(); });
      $("#k-pick").addEventListener("change", function(e){ if(e.target.value){ UI.viewDate=e.target.value; render(); } });
      var kt=$("#k-today"); if(kt) kt.addEventListener("click", function(){ UI.viewDate=todayStr(); render(); });
      $$("[data-kact]").forEach(function(b){ b.addEventListener("click", function(){ var o=occById(b.getAttribute("data-id")); if(o) setStatus(o, b.getAttribute("data-kact"), true); }); });
      $$("[data-kopen]").forEach(function(b){ b.addEventListener("click", function(){ openDrawer(b.getAttribute("data-kopen")); }); });
    }

    /* ================= MÀN: DỰ ÁN ================= */
    function renderProjects(){
      var list=state.projects.slice().sort(function(a,b){ return (a.archived?1:0)-(b.archived?1:0); });
      var h='<div class="viewhead"><h2>Dự Án</h2><span class="sub">Nhóm việc theo dự án và nhãn (tag)</span></div>'
        + '<form class="filterbar" id="newproj"><input type="search" style="flex:1" id="np-name" placeholder="Tên dự án mới…" /><button class="btn primary" type="submit">+ Tạo dự án</button></form>'
        + '<form class="filterbar" id="newtag"><input type="search" style="flex:1" id="nt-name" placeholder="Tên tag mới (không cần #)…" /><button class="btn" type="submit">+ Tạo tag</button></form>';
      if(list.length){
        h+='<div class="cards">'+list.map(function(p){
          var os=liveOccs().filter(function(o){return o.projectId===p.id;});
          var open=os.filter(function(o){return o.status!=="done"&&o.status!=="skipped";}).length;
          var done=os.filter(function(o){return o.status==="done";}).length;
          var seriesN=state.series.filter(function(s){return s.projectId===p.id && !s.deletedAt;}).length;
          return '<div class="card"><h3><span class="dot" style="width:12px;height:12px;border-radius:50%;background:'+esc(p.color)+';display:inline-block"></span>'+esc(p.name)+(p.archived?' <span class="chip">Đã lưu trữ</span>':'')+'</h3>'
            + '<p>'+open+' việc đang mở · '+done+' đã xong · '+seriesN+' chuỗi lặp</p>'
            + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn small" data-pview="'+p.id+'">Xem việc</button><button class="btn small" data-parch="'+p.id+'">'+(p.archived?"Bỏ lưu trữ":"Lưu trữ")+'</button><button class="btn small ghost" data-pdel="'+p.id+'">Xoá</button></div></div>';
        }).join("")+'</div>';

    /* ================= MÀN: THÓI QUEN ================= */
    function streakOf(s){
      var byDate={};
      state.occs.forEach(function(o){ if(o.seriesId===s.id && !o.deletedAt) byDate[o.dueDate]=o; });
      var cur=0, d=todayStr();
      if(!byDate[d] || byDate[d].status!=="done") d=addDays(d,-1);
      var guard=0;
      while(guard<800){ guard++; var o=byDate[d]; if(!o) break; if(o.status==="done"){ cur++; d=addDays(d,-1); } else if(o.status==="skipped"){ d=addDays(d,-1); } else break; }
      /* streak dài nhất */
      var dates=Object.keys(byDate).sort(); var best=0, run=0, prev=null;
      dates.forEach(function(ds){ var o=byDate[ds]; if(o.status==="done"){ if(prev && addDays(prev,1)===ds) run++; else run=1; prev=ds; if(run>best) best=run; } else if(o.status!=="skipped"){ run=0; prev=null; } });
      var doneTotal=dates.filter(function(ds){return byDate[ds].status==="done";}).length;
      return {cur:cur, best:Math.max(best,cur), doneTotal:doneTotal, total:dates.length};
    }

        var last14=""; for(var i=13;i>=0;i--){ var ds=addDays(todayStr(),-i); var o=state.occs.filter(function(x){return x.seriesId===s.id && x.dueDate===ds && !x.deletedAt;})[0]; last14+='<span title="'+ds+'" style="display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:3px;background:'+(o? (o.status==="done"?"var(--green)":o.status==="doing"?"var(--amber)":o.status==="skipped"?"var(--ink3)":"var(--surface2)") : "transparent")+'"></span>'; }

          + '<p>Kỷ lục: '+st.best+' ngày · Đã hoàn thành '+st.doneTotal+'/'+st.total+' lần</p>'
          + '<div style="margin:8px 0">'+last14+'</div>'
          + '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-hpause="'+s.id+'">'+(s.active===false?"Tiếp tục chuỗi":"Tạm dừng chuỗi")+'</button><button class="btn small" data-hedit="'+s.id+'">Sửa chuỗi</button></div></div>';
      }).join("")+'</div>';

      $$("[data-hedit]").forEach(function(b){ b.addEventListener("click", function(){ var s=seriesById(b.getAttribute("data-hedit")); if(s) openTaskForm(null, s); }); });

    /* ================= MÀN: THỐNG KÊ ================= */
    function renderStats(){

      /* 14 ngày gần nhất */

      var h='<div class="viewhead"><h2>Thống Kê</h2><span class="sub">Suy ra từ nhật ký hoạt động và trạng thái các lần làm</span></div>'

        + '<div class="card"><p>Tổng việc đang theo dõi</p><div class="big">'+all.length+'</div><p>'+state.series.filter(function(s){return !s.deletedAt;}).length+' chuỗi lặp · '+state.projects.length+' dự án</p></div>'
        + '<div class="card"><p>Dự báo 7 ngày tới</p><div class="big">'+fc.reduce(function(a,b){return a+b.n;},0)+'</div><p>'+fc.map(function(f){return f.ds.slice(8)+'/'+f.ds.slice(5,7)+': '+f.n;}).join(" · ")+'</p></div></div>'
        + '<div class="group-title">Hoàn thành 14 ngày gần nhất</div><div class="card">'+svg+'<p class="hint">Cột đầy = tổng việc đến hạn · phần đậm = đã hoàn thành</p></div>'
        + '<div class="group-title">Heatmap 6 tháng (số việc hoàn thành mỗi ngày)</div><div class="card"><div class="heat">'+heat+'</div></div>'
        + '<div class="group-title">Việc hay trễ</div>'
        + (lateList.length? '<div class="card"><table class="stats"><tr><th>Việc</th><th class="num">Số lần trễ / quá hạn</th></tr>'+lateList.map(function(r){return '<tr><td>'+esc(r.t)+'</td><td class="num">'+r.n+'</td></tr>';}).join("")+'</table></div>' : emptyHTML("Chưa ghi nhận việc trễ nào","Hoàn thành muộn so với ngày hẹn hoặc đang quá hạn sẽ được tính ở đây."))
        + '<div class="group-title">Theo dự án</div>'
        + (projRows.length? '<div class="card"><table class="stats"><tr><th>Dự án</th><th class="num">Đã xong</th><th class="num">Tổng</th><th class="num">%</th></tr>'+projRows.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td class="num">'+r.done+'</td><td class="num">'+r.total+'</td><td class="num">'+(r.total?Math.round(r.done/r.total*100):0)+'%</td></tr>';}).join("")+'</table></div>' : '<p class="hint">Chưa có việc nào gán dự án.</p>');

      var auth=loadAuth(); if(!auth) return;
      openCodeForm("Đổi mã truy cập", ["Mã hiện tại","Mã mới (ít nhất 4 ký tự)","Nhập lại mã mới"], function(vals){
        return hashCode(vals[0], auth.salt).then(function(h){
          if(h!==auth.hash) return "Mã hiện tại chưa đúng.";
          if(vals[1].length<4) return "Mã mới cần ít nhất 4 ký tự.";
          if(vals[1]!==vals[2]) return "Hai lần nhập mã mới chưa khớp.";
          var salt=makeSalt();
          return hashCode(vals[1], salt).then(function(h2){ saveAuth({salt:salt, hash:h2}); state.requireLock=true; save(); closeModal(); render(); toast("Đã đổi mã truy cập."); return null; });
        });
      });
    }

    /* ================= THAO TÁC VIỆC ================= */
    function setStatus(o, st, rerender){
      pushUndo("đổi trạng thái việc");
      var old=o.status;
      o.status=st;
      if(st==="done"){ o.progress=100; var run=runningSession(o); if(run) run.end=Date.now(); }
      if(st==="doing" && (o.progress==null || o.progress>=100)) o.progress=0;
      if(st==="todo"){ o.progress=0; }
      if(st==="skipped"){ var r2=runningSession(o); if(r2) r2.end=Date.now(); }
      var label={done:"Hoàn thành", doing:"Bắt đầu làm", todo:"Mở lại (chưa làm)", skipped:"Bỏ qua"}[st]||st;
      logAct(o, st, label+(old!==st? " (từ: "+old+")":""));
      save(); if(rerender!==false) render(); if(UI.drawerOcc===o.id) openDrawer(o.id, true);
    }
    function setProgress(o, p, log){
      if(o.status!=="doing"){ o.status="doing"; }
      o.progress=Math.max(0, Math.min(99, p));
      if(log){ logAct(o,"progress","Cập nhật tiến độ: "+o.progress+"%"); save(); }
    }
    function cycleStatus(o){
      if(o.status==="todo") setStatus(o,"doing");
      else if(o.status==="doing") setStatus(o,"done");
      else setStatus(o,"todo");
    }
    function snoozeOcc(o, toDate, label){
      pushUndo("hoãn việc");
      var from=o.dueDate;
      if(o.seriesId){
        /* hoãn 1 lần của chuỗi: ghi ngày gốc vào danh sách bỏ qua của chuỗi để không sinh trùng */
        o.detached=true;
        var s=seriesById(o.seriesId);
        if(s && from){ s.skipDates=s.skipDates||[]; if(s.skipDates.indexOf(from)<0) s.skipDates.push(from); }
      }
      o.dueDate=toDate; o.remindFired=false; o.snoozeUntil=0;
      logAct(o,"snooze","Hoãn từ "+(from||"chưa có ngày")+" sang "+toDate);
      save(); render(); toast("Đã hoãn “"+o.title+"” sang "+label+" ("+fmtDate(toDate)+"). Hoàn tác được ở thanh điều hướng.");
      if(UI.drawerOcc===o.id) openDrawer(o.id, true);
    }
    function toggleTimer(o){
      pushUndo("đếm giờ");
      var run=runningSession(o);
      if(run){ run.end=Date.now(); logAct(o,"timer_stop","Dừng đếm giờ · tổng đã làm "+fmtDur(actualMin(o))); toast("Đã dừng đếm giờ cho “"+o.title+"”."); }
      else { o.sessions=o.sessions||[]; o.sessions.push({start:Date.now(), end:null}); if(o.status==="todo") { o.status="doing"; if(o.progress==null) o.progress=0; } logAct(o,"timer_start","Bắt đầu đếm giờ"); toast("Đang đếm giờ: “"+o.title+"”."); }
      save(); render(); if(UI.drawerOcc===o.id) openDrawer(o.id, true);
    }

    /* ================= NHẬP NHANH (NLP tối thiểu) ================= */
    function findOrCreateTag(name){
      var n=name.trim().toLowerCase(); if(!n) return null;
      var t=state.tags.filter(function(x){return x.name.toLowerCase()===n;})[0];
      if(!t){ t={id:uid(), name:name.trim(), color:PALETTE[state.tags.length%PALETTE.length]}; state.tags.push(t); }
      return t.id;
    }
    function parseQuick(text){
      var title=text.trim(), tagIds=[], priority=null, rrule=null;
      title=title.replace(/#([^\s#]+)/g, function(m, name){ var id=findOrCreateTag(name); if(id) tagIds.push(id); return ""; });
      title=title.replace(/!(gấp|gap|cao|vừa|thấp|thap)\b/gi, function(m, p){ var k=p.toLowerCase(); priority=(k==="gấp"||k==="gap")?"gap":(k==="cao"?"cao":(k==="vừa"?"vua":"thap")); return ""; });
      var low=" "+title.toLowerCase()+" ";
      var wdMap={"chủ nhật":0,"chu nhat":0,"thứ 2":1,"thu 2":1,"thứ 3":2,"thu 3":2,"thứ 4":3,"thu 4":3,"thứ 5":4,"thu 5":4,"thứ 6":5,"thu 6":5,"thứ 7":6,"thu 7":6};
      var m2=low.match(/mỗi\s+(\d+)\s*(ngày|tuần|tuan|tháng|thang)/);
      var mWeekday=low.match(/mỗi\s+(chủ nhật|chu nhat|thứ\s*[2-7]|thu\s*[2-7])/);
      if(m2){
        var n=+m2[1], unit=m2[2];
        if(unit==="ngày") rrule={freq:"daily", interval:n};
        else if(unit==="tuần"||unit==="tuan") rrule={freq:"weekly", interval:n, weekdays:[parseD(todayStr()).getDay()]};
        else rrule={freq:"monthly", interval:n, monthMode:"day", monthDay:parseD(todayStr()).getDate()};
        title=title.replace(/mỗi\s+\d+\s*(ngày|tuần|tháng)\s*/i,"");
      } else if(mWeekday){
        var key=mWeekday[1].replace(/\s+/g," ").trim(); var wd=wdMap[key]!=null? wdMap[key] : wdMap[mWeekday[1]];
        if(wd!=null){ rrule={freq:"weekly", interval:1, weekdays:[wd]}; title=title.replace(/mỗi\s+(chủ nhật|thứ\s*[2-7])\s*/i,""); }
      } else if(/mỗi ngày làm việc|ngày làm việc/.test(low)){ rrule={freq:"workday", interval:1}; title=title.replace(/(mỗi\s+)?ngày làm việc\s*/i,""); }
      else if(/mỗi ngày|hằng ngày|hang ngay/.test(low)){ rrule={freq:"daily", interval:1}; title=title.replace(/(mỗi ngày|hằng ngày)\s*/i,""); }
      else if(/mỗi tuần|hằng tuần/.test(low)){ rrule={freq:"weekly", interval:1, weekdays:[parseD(todayStr()).getDay()]}; title=title.replace(/(mỗi tuần|hằng tuần)\s*/i,""); }
      else if(/mỗi tháng|hằng tháng/.test(low)){ rrule={freq:"monthly", interval:1, monthMode:"day", monthDay:parseD(todayStr()).getDate()}; title=title.replace(/(mỗi tháng|hằng tháng)\s*/i,""); }
      var timeM=title.match(/\b(\d{1,2})[:h](\d{2})?\b/);
      var dueTime=""; if(timeM){ dueTime=pad2(Math.min(23,+timeM[1]))+":"+(timeM[2]||"00"); }
      title=title.replace(/\s+/g," ").trim();
      return { title:title||text.trim(), tagIds:tagIds, priority:priority||"vua", rrule:rrule, dueTime:dueTime };
    }
    function quickAdd(text){
      pushUndo("thêm việc nhanh");
      var p=parseQuick(text);
      var start=todayStr();
      if(p.rrule && p.rrule.freq==="weekly" && p.rrule.weekdays && p.rrule.weekdays.length){
        /* lần đầu rơi vào thứ đã chọn, gần nhất kể từ hôm nay */
        var d=parseD(start); while(d.getDay()!==p.rrule.weekdays[0]) d.setDate(d.getDate()+1); start=dstr(d);
      }
      if(p.rrule){
        var s={ id:uid(), title:p.title, desc:"", projectId:null, priority:p.priority, estimateMin:0, dueTime:p.dueTime,
          tags:p.tagIds, steps:[], rrule:p.rrule, start:start, endType:"never", endDate:"", endCount:0, active:true, deletedAt:null, createdAt:Date.now(), remindOffset:-1 };
        state.series.push(s); materialize();
        var first=state.occs.filter(function(o){return o.seriesId===s.id && o.dueDate===start;})[0];
        if(first) logAct(first,"create","Tạo chuỗi lặp từ nhập nhanh: "+rruleLabel(p.rrule));
        toast("Đã tạo chuỗi lặp “"+p.title+"” ("+rruleLabel(p.rrule)+").");
      } else {
        var o={ id:uid(), seriesId:null, title:p.title, desc:"", projectId:null, priority:p.priority, estimateMin:0, dueDate:todayStr(), dueTime:p.dueTime,
          status:"todo", progress:0, note:"", tags:p.tagIds, steps:[], sessions:[], remindOffset:-1, remindFired:false, snoozeUntil:0, detached:false, deletedAt:null, createdAt:Date.now() };
        state.occs.push(o); logAct(o,"create","Tạo việc từ nhập nhanh");
        toast("Đã thêm “"+p.title+"” vào hôm nay.");
      }
      save(); if(UI.viewDate!==todayStr() && UI.view==="today") UI.viewDate=todayStr(); render();
    }
    function createFromTemplate(tplId){
      var t=state.templates.filter(function(x){return x.id===tplId;})[0]; if(!t) return;
      pushUndo("tạo việc từ mẫu");
      var p=deepClone(t.payload);
      if(p.rrule){
        var s={ id:uid(), title:p.title, desc:p.desc||"", projectId:p.projectId||null, priority:p.priority||"vua", estimateMin:p.estimateMin||0, dueTime:p.dueTime||"", tags:(p.tags||[]).slice(), steps:(p.steps||[]).slice(), rrule:p.rrule, start:todayStr(), endType:"never", endDate:"", endCount:0, active:true, deletedAt:null, createdAt:Date.now(), remindOffset:(p.remindOffset!=null?p.remindOffset:-1) };
        state.series.push(s); materialize();
      } else {
        state.occs.push({ id:uid(), seriesId:null, title:p.title, desc:p.desc||"", projectId:p.projectId||null, priority:p.priority||"vua", estimateMin:p.estimateMin||0, dueDate:todayStr(), dueTime:p.dueTime||"", status:"todo", progress:0, note:"", tags:(p.tags||[]).slice(), steps:(p.steps||[]).map(function(x){return {id:uid(), title:x, done:false};}), sessions:[], remindOffset:(p.remindOffset!=null?p.remindOffset:-1), remindFired:false, snoozeUntil:0, detached:false, deletedAt:null, createdAt:Date.now() });
      }
      save(); UI.view="today"; UI.viewDate=todayStr(); render(); toast("Đã tạo việc từ mẫu “"+t.name+"”.");
    }
</script>

    function openScopePicker(title, body, options, onPick){

    function toast(msg, withUndo){
      var t=document.createElement("div"); t.className="toast";

      $("#toasts").appendChild(t);
      setTimeout(function(){ t.remove(); }, 5200);

    /* ================= FORM VIỆC (tạo / sửa, có phạm vi) ================= */

      var names=["CN","T2","T3","T4","T5","T6","T7"];

        if(freq!=="none"){

          if(freq==="weekly"){ rr.weekdays=$$("#tf-wds .chip.sel").map(function(c){return +c.getAttribute("data-wd");}); if(!rr.weekdays.length) rr.weekdays=[parseD(data.date||todayStr()).getDay()]; }
          if(freq==="monthly"){ var mm=$("#tf-mmode").value; rr.monthMode=mm; if(mm==="nth"){ rr.monthNth=Math.min(5, Math.max(1, +$("#tf-mday").value||1)); rr.monthWeekday=parseD(data.date||todayStr()).getDay(); } else rr.monthDay=Math.min(31, Math.max(1, +$("#tf-mday").value||1)); }
          data.rrule=rr;

        }

        submitTaskForm(data, editingOcc, editingSeries);
      });

    function stepsFromText(text, oldSteps){
      var doneMap={}; (oldSteps||[]).forEach(function(s){ doneMap[s.title]=s.done; });
      return text.split("\n").map(function(x){return x.trim();}).filter(Boolean).map(function(t){ return { id:uid(), title:t, done: !!doneMap[t] }; });
    }
    function stepsTextToTitles(text){ return text.split("\n").map(function(x){return x.trim();}).filter(Boolean); }
    function applySeriesFields(s, data){
      s.title=data.title; s.desc=data.desc; s.projectId=data.projectId; s.priority=data.priority;
      s.estimateMin=data.estimateMin; s.dueTime=data.dueTime; s.tags=data.tags.slice();
      s.steps=stepsTextToTitles(data.stepsText); s.remindOffset=data.remindOffset;
      if(data.rrule){ s.rrule=data.rrule; s.endType=data.endType; s.endDate=data.endDate; s.endCount=data.endCount; }
    }
    function refreshFutureOccs(s, fromDate){
      state.occs.forEach(function(o){
        if(o.seriesId===s.id && !o.deletedAt && o.dueDate>=fromDate && !occInteracted(o)){
          o.title=s.title; o.desc=s.desc; o.projectId=s.projectId; o.priority=s.priority; o.estimateMin=s.estimateMin;
          o.dueTime=s.dueTime; o.tags=(s.tags||[]).slice(); o.remindOffset=s.remindOffset;
          o.steps=(s.steps||[]).map(function(t){ return {id:uid(), title:t, done:false}; });
        }
      });
    }
    function submitTaskForm(data, editingOcc, editingSeries){
      pushUndo(editingOcc||editingSeries? "sửa việc" : "thêm việc");
      var finish=function(){ materialize(); save(); closeDrawer(); render(); };
      /* --- sửa chuỗi trực tiếp (từ màn Thói Quen) --- */
      if(editingSeries && !editingOcc){
        applySeriesFields(editingSeries, data);
        if(!data.rrule){ /* bỏ lặp: huỷ chuỗi, giữ các lần làm thành việc rời */ state.occs.forEach(function(o){ if(o.seriesId===editingSeries.id){ o.seriesId=null; o.detached=false; } }); state.series=state.series.filter(function(x){return x.id!==editingSeries.id;}); }
        else refreshFutureOccs(editingSeries, todayStr());
        logAct({id:null, seriesId:editingSeries.id, title:data.title},"edit_series","Sửa chuỗi việc");
        finish(); toast("Đã lưu chuỗi “"+data.title+"”."); return;
      }
      /* --- tạo mới --- */
      if(!editingOcc){
        if(data.rrule){
          var s={ id:uid(), title:data.title, desc:data.desc, projectId:data.projectId, priority:data.priority, estimateMin:data.estimateMin, dueTime:data.dueTime, tags:data.tags, steps:stepsTextToTitles(data.stepsText), rrule:data.rrule, start:data.date||todayStr(), endType:data.endType, endDate:data.endDate, endCount:data.endCount, active:true, deletedAt:null, createdAt:Date.now(), remindOffset:data.remindOffset };
          state.series.push(s); finish(); toast("Đã tạo chuỗi lặp “"+data.title+"”.");
        } else {
          var o={ id:uid(), seriesId:null, title:data.title, desc:data.desc, projectId:data.projectId, priority:data.priority, estimateMin:data.estimateMin, dueDate:data.date||null, dueTime:data.dueTime, status:"todo", progress:0, note:"", tags:data.tags, steps:stepsFromText(data.stepsText, []), sessions:[], remindOffset:data.remindOffset, remindFired:false, snoozeUntil:0, detached:false, deletedAt:null, createdAt:Date.now() };
          state.occs.push(o); logAct(o,"create","Tạo việc"); finish(); toast("Đã thêm “"+data.title+"”.");
        }
        return;
      }
      /* --- sửa một lần làm --- */
      var o=editingOcc, s=o.seriesId? seriesById(o.seriesId) : null;
      var applyToOcc=function(target){
        target.title=data.title; target.desc=data.desc; target.projectId=data.projectId; target.priority=data.priority;
        target.estimateMin=data.estimateMin; target.dueTime=data.dueTime; target.tags=data.tags.slice();
        target.steps=stepsFromText(data.stepsText, target.steps); target.remindOffset=data.remindOffset; target.remindFired=false;
      };
      if(!s){ applyToOcc(o); if(data.date) o.dueDate=data.date; logAct(o,"edit","Sửa việc"); finish(); return; }
      openScopePicker("Việc này thuộc một chuỗi lặp", "Bạn muốn áp dụng thay đổi cho phạm vi nào?", [
        {label:"Chỉ lần này ("+fmtDate(o.dueDate)+")", value:"this"},
        {label:"Từ lần này trở đi (tách chuỗi mới)", value:"following"},
        {label:"Cả chuỗi", value:"all"}
      ], function(scope){
        if(scope==="this"){
          o.detached=true; applyToOcc(o);
          if(data.date && data.date!==o.dueDate){ s.skipDates=s.skipDates||[]; if(s.skipDates.indexOf(o.dueDate)<0) s.skipDates.push(o.dueDate); o.dueDate=data.date; }
          logAct(o,"edit","Sửa chỉ lần này");
        } else if(scope==="all"){
          applySeriesFields(s, data); refreshFutureOccs(s, "0000-01-01"); logAct(o,"edit","Sửa cả chuỗi");
        } else {
          var oldEnd={endType:s.endType, endDate:s.endDate, endCount:s.endCount};
          s.endType="date"; s.endDate=addDays(o.dueDate,-1);
          state.occs.forEach(function(x){ if(x.seriesId===s.id && !x.deletedAt && x.dueDate>=o.dueDate && !occInteracted(x)) x.deletedAt=Date.now(); });
          var ns={ id:uid(), title:s.title, desc:s.desc, projectId:s.projectId, priority:s.priority, estimateMin:s.estimateMin, dueTime:s.dueTime, tags:(s.tags||[]).slice(), steps:(s.steps||[]).slice(), rrule: deepClone(s.rrule), start:o.dueDate, endType:oldEnd.endType, endDate:oldEnd.endDate, endCount:oldEnd.endCount, active:true, deletedAt:null, createdAt:Date.now(), remindOffset:s.remindOffset };
          applySeriesFields(ns, data); if(data.date && data.date!==o.dueDate) ns.start=data.date;
          state.series.push(ns);
          state.occs.forEach(function(x){ if(x.seriesId===s.id && !x.deletedAt && x.dueDate>=o.dueDate) x.seriesId=ns.id; });
          logAct(o,"edit","Sửa từ lần này trở đi (tách chuỗi)");
        }

      });
    }

      });
      if(!due){ $("#remindbar").classList.remove("on"); return; }
      remindShown[due.id]=true;

      bar.innerHTML='<div class="remind-card"><b>⏰ Đến giờ: '+esc(due.title)+'</b><div>'+(due.dueDate? esc(fmtDate(due.dueDate)) : "")+(due.dueTime? " · "+esc(due.dueTime) : "")+'</div><div class="rowb"><button class="btn small primary" id="rb-open">Mở việc</button><button class="btn small" id="rb-10">Nhắc lại sau 10 phút</button><button class="btn small" id="rb-1h">Sau 1 giờ</button><button class="btn small" id="rb-tmr">Ngày mai</button><button class="btn small ghost" id="rb-ok">Đã biết</button></div></div>';
      bar.classList.add("on");
      $("#rb-open").addEventListener("click", function(){ bar.classList.remove("on"); due.remindFired=true; save(); openDrawer(due.id); });
      $("#rb-ok").addEventListener("click", function(){ bar.classList.remove("on"); due.remindFired=true; save(); });
      function snoozeRemind(ms, label){ due.snoozeUntil=Date.now()+ms; due.remindFired=false; remindShown[due.id]=false; logAct(due,"remind_snooze","Nhắc lại: "+label); save(); bar.classList.remove("on"); toast("Sẽ nhắc lại "+label+"."); }
      $("#rb-10").addEventListener("click", function(){ snoozeRemind(10*60000, "sau 10 phút"); });
      $("#rb-1h").addEventListener("click", function(){ snoozeRemind(60*60000, "sau 1 giờ"); });
      $("#rb-tmr").addEventListener("click", function(){ snoozeRemind(24*3600000, "vào ngày mai"); });
    }
    setInterval(checkReminders, 20000);

    /* ================= RENDER & KHỞI ĐỘNG ================= */
    function render(){
      renderShell();
      if(UI.view==="today") renderToday();
      else if(UI.view==="inbox") renderInbox();
      else if(UI.view==="calendar") renderCalendar();
      else if(UI.view==="kanban") renderKanban();
      else if(UI.view==="projects") renderProjects();
      else if(UI.view==="habits") renderHabits();
      else if(UI.view==="stats") renderStats();
      else if(UI.view==="data") renderData();
    }
    function enterApp(){
      $("#gate").hidden=true;
      $("#app").classList.add("on");
      loadData(); materialize();
      UI.viewDate=todayStr();
      render(); checkReminders();
      toast("Dữ liệu của bạn chỉ lưu trong trình duyệt này — nhớ xuất sao lưu JSON định kỳ ở mục Thùng Rác & Dữ Liệu.", false);
    }
    (function boot(){
      var auth=loadAuth();
      if(!auth){ showGate("setup"); return; }
      if(state && state.requireLock===false){ /* dữ liệu chưa load; kiểm tra cờ trong LS */ }
      try{ var d=JSON.parse(localStorage.getItem(LS_DATA)); if(d && d.requireLock===false){ enterApp(); return; } }catch(e){}
      if(sessionStorage.getItem(SS_UNLOCK)==="1"){ enterApp(); return; }
      showGate("lock");
    })();
</script>
  </body>
</html>
